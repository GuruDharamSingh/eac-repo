<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>18-forum</title>
<!--
Design reference, not production code.
Markup for one screen, cut from "Elkdonis App.dc.html" lines 1200-1222. All sizes, colours and radii are in the inline styles.
{{ name }}  a value filled in at runtime (see renderVals() in Elkdonis App.dc.html for what it holds)
<sc-if>     shows its children when the value is true
<sc-for>    repeats its children once per item in the list
Described in screens-guest.md. For the live, working version open "Elkdonis Experiences.dc.html".
-->
<style>@font-face{font-family:"Basteleur";src:url("../fonts/Basteleur-Moonlight.woff2") format("woff2");font-weight:400;font-display:swap}@font-face{font-family:"Basteleur";src:url("../fonts/Basteleur-Bold.woff2") format("woff2");font-weight:700;font-display:swap}@font-face{font-family:"Brothers";src:url("../fonts/BrothersTypeface-Regular.otf") format("opentype");font-display:swap}@font-face{font-family:"Venture";src:url("../fonts/Venture-nRqOR.otf") format("opentype");font-display:swap}@keyframes elkIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@keyframes elkUp{from{transform:translateY(100%)}to{transform:none}}@keyframes elkFade{from{opacity:0}to{opacity:1}}@keyframes elkToast{0%{opacity:0;transform:translateY(-8px)}10%{opacity:1;transform:none}85%{opacity:1}100%{opacity:0}}*{box-sizing:border-box}html,body{background:#1c1f24}body{margin:0}button,input,textarea{font-family:inherit}a{color:#dcc08a}a:hover{color:#f1ece2}input::placeholder,textarea::placeholder{color:#857f76}sc-if,sc-for{display:contents}body{background:#16181c;display:flex;justify-content:center;padding:24px}</style>
</head>
<body>
<div style="position:relative;flex:none;width:390px;height:844px;overflow:hidden;background:linear-gradient(180deg,#25282e 0%,#2b2f36 55%,#282b31 100%);color:#f1ece2;font-family:Basteleur,Georgia,serif;font-size:15px">
<sc-if value="{{ is.forum }}" hint-placeholder-val="{{ false }}">
<div style="position:absolute;inset:0;overflow-y:auto;scrollbar-width:none;padding:58px 0 120px;animation:elkIn .32s ease both">
<div style="display:flex;align-items:center;gap:14px;padding:0 16px"><button onClick="{{ back }}" style="flex:none;width:44px;height:44px;border-radius:22px;border:1px solid rgba(241,236,226,.16);background:rgba(241,236,226,.04);color:#f1ece2;font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0">←</button><span style="font-family:Venture,Georgia,serif;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:#b9b2a5">Forum · Elkdonis</span></div>
<h1 style="margin:18px 20px 0;font-family:Brothers,Georgia,serif;font-weight:400;font-size:42px;line-height:1">Elkdonis Forum</h1>
<p style="margin:8px 20px 0;font-family:ui-monospace,Menlo,monospace;font-size:11.5px;color:#8f8a82">{{ fm.status }}</p>
<p style="margin:10px 20px 0;font-size:13.5px;line-height:1.5;color:#b9b2a5">{{ fm.viewerLine }}</p>
<sc-if value="{{ fm.hasUnread }}" hint-placeholder-val="{{ false }}"><div style="display:flex;align-items:center;gap:10px;margin:16px 16px 0;padding:12px 14px;border-radius:16px;background:rgba(201,162,92,.1);border:1px solid rgba(201,162,92,.4)"><span style="flex:none;width:7px;height:7px;border-radius:4px;background:#c9a25c"></span><span style="flex:1;font-size:14px">{{ fm.unreadLine }}</span><button onClick="{{ fm.markAll }}" style="flex:none;padding:0;border:0;background:transparent;color:#dcc08a;font-size:13px;cursor:pointer">Mark all read</button></div></sc-if>
<div style="display:flex;align-items:center;gap:10px;margin:26px 20px 10px"><span style="font-family:Venture,Georgia,serif;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#c9a25c">Sections</span><div style="flex:1;height:1px;background:linear-gradient(90deg,rgba(201,162,92,.6),transparent)"></div></div>
<div style="display:flex;flex-direction:column;gap:2px;padding:0 16px">
<sc-for list="{{ fm.secs }}" as="x" hint-placeholder-count="4">
<div style="display:flex;flex-direction:column;border-left:3px solid {{ x.accent }};background:#2f3339;border-radius:0 14px 14px 0">
<button onClick="{{ x.open }}" style="display:flex;align-items:center;gap:10px;padding:15px 16px;border:0;background:transparent;color:#f1ece2;text-align:left;cursor:pointer"><span style="flex:1;font-family:Basteleur,Georgia,serif;font-weight:700;font-size:19px">{{ x.name }}</span><sc-if value="{{ x.closed }}" hint-placeholder-val="{{ false }}"><span style="font-size:11px;color:#8f8a82">Closed</span></sc-if><span style="font-family:ui-monospace,Menlo,monospace;font-size:11.5px;color:#8f8a82">{{ x.count }}</span><sc-if value="{{ x.hasNew }}" hint-placeholder-val="{{ false }}"><span style="font-family:ui-monospace,Menlo,monospace;font-size:11.5px;font-weight:700;color:#c9a25c">· {{ x.newLabel }}</span></sc-if></button>
<sc-for list="{{ x.subs }}" as="y" hint-placeholder-count="0"><button onClick="{{ y.open }}" style="display:flex;align-items:center;gap:10px;padding:11px 16px 12px 30px;border:0;border-top:1px solid rgba(241,236,226,.05);background:transparent;color:#e6e0d4;text-align:left;cursor:pointer"><span style="color:#8f8a82">↳</span><span style="flex:1;font-size:16.5px">{{ y.name }}</span><span style="font-family:ui-monospace,Menlo,monospace;font-size:11px;color:#8f8a82">{{ y.count }}</span><sc-if value="{{ y.hasNew }}" hint-placeholder-val="{{ false }}"><span style="font-family:ui-monospace,Menlo,monospace;font-size:11px;font-weight:700;color:#c9a25c">· {{ y.newLabel }}</span></sc-if></button></sc-for>
</div>
</sc-for>
</div>
<div style="display:flex;align-items:center;gap:10px;margin:26px 20px 4px"><span style="font-family:Venture,Georgia,serif;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#c9a25c">Latest</span><div style="flex:1;height:1px;background:linear-gradient(90deg,rgba(201,162,92,.6),transparent)"></div></div>
<div style="display:flex;flex-direction:column;padding:0 16px">
<sc-for list="{{ fm.latest }}" as="r" hint-placeholder-count="6"><button onClick="{{ r.open }}" style="display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:10px;align-items:start;padding:12px 4px;border:0;border-bottom:1px solid rgba(241,236,226,.07);background:transparent;color:#f1ece2;text-align:left;cursor:pointer"><span style="color:{{ r.accent }};font-size:13px;text-align:center;padding-top:2px">{{ r.glyph }}</span><span style="display:flex;flex-direction:column;gap:3px;min-width:0"><span style="display:flex;align-items:center;gap:7px"><span style="flex:none;width:6px;height:6px;border-radius:3px;background:{{ r.dot }}"></span><span style="font-size:15px;line-height:1.3;font-weight:{{ r.weight }}">{{ r.title }}</span></span><span style="font-family:ui-monospace,Menlo,monospace;font-size:11px;color:#8f8a82">{{ r.meta }}</span><sc-if value="{{ r.hasLock }}" hint-placeholder-val="{{ false }}"><span style="align-self:flex-start;padding:1px 7px;border-radius:8px;border:1px solid rgba(241,236,226,.2);font-size:10.5px;color:#b9b2a5">{{ r.lock }}</span></sc-if></span><span style="font-family:ui-monospace,Menlo,monospace;font-size:11px;color:#8f8a82;padding-top:3px">{{ r.when }}</span></button></sc-for>
</div>
</div>
<button onClick="{{ fm.compose }}" style="position:absolute;left:20px;right:20px;bottom:30px;height:56px;border:0;background:#c9a25c;color:#1b1e23;font-family:Basteleur,Georgia,serif;font-weight:700;font-size:16px;cursor:pointer;z-index:5;clip-path:polygon(12px 0,calc(100% - 12px) 0,100% 12px,100% calc(100% - 12px),calc(100% - 12px) 100%,12px 100%,0 calc(100% - 12px),0 12px)">✎ Start a topic</button>
</sc-if>
</div>
</body>
</html>
