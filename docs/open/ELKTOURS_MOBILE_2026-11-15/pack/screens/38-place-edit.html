<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>38-place-edit</title>
<!--
Design reference, not production code.
Markup for one screen, cut from "Elkdonis App.dc.html" lines 1152-1167. All sizes, colours and radii are in the inline styles.
{{ name }}  a value filled in at runtime (see renderVals() in Elkdonis App.dc.html for what it holds)
<sc-if>     shows its children when the value is true
<sc-for>    repeats its children once per item in the list
Described in screens-board.md. For the live, working version open "Elkdonis Experiences.dc.html".
-->
<style>@font-face{font-family:"Basteleur";src:url("../fonts/Basteleur-Moonlight.woff2") format("woff2");font-weight:400;font-display:swap}@font-face{font-family:"Basteleur";src:url("../fonts/Basteleur-Bold.woff2") format("woff2");font-weight:700;font-display:swap}@font-face{font-family:"Brothers";src:url("../fonts/BrothersTypeface-Regular.otf") format("opentype");font-display:swap}@font-face{font-family:"Venture";src:url("../fonts/Venture-nRqOR.otf") format("opentype");font-display:swap}@keyframes elkIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@keyframes elkUp{from{transform:translateY(100%)}to{transform:none}}@keyframes elkFade{from{opacity:0}to{opacity:1}}@keyframes elkToast{0%{opacity:0;transform:translateY(-8px)}10%{opacity:1;transform:none}85%{opacity:1}100%{opacity:0}}*{box-sizing:border-box}html,body{background:#1c1f24}body{margin:0}button,input,textarea{font-family:inherit}a{color:#dcc08a}a:hover{color:#f1ece2}input::placeholder,textarea::placeholder{color:#857f76}sc-if,sc-for{display:contents}body{background:#16181c;display:flex;justify-content:center;padding:24px}</style>
</head>
<body>
<div style="position:relative;flex:none;width:390px;height:844px;overflow:hidden;background:linear-gradient(180deg,#25282e 0%,#2b2f36 55%,#282b31 100%);color:#f1ece2;font-family:Basteleur,Georgia,serif;font-size:15px">
<sc-if value="{{ is.placeEdit }}" hint-placeholder-val="{{ false }}">
<div style="position:absolute;inset:0;overflow-y:auto;scrollbar-width:none;padding:58px 0 60px;animation:elkIn .32s ease both">
<div style="display:flex;align-items:center;gap:14px;padding:0 16px"><button onClick="{{ back }}" style="flex:none;width:44px;height:44px;border-radius:22px;border:1px solid rgba(241,236,226,.16);background:rgba(241,236,226,.04);color:#f1ece2;font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0">←</button><span style="font-family:Venture,Georgia,serif;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:#b9b2a5">Places</span></div>
<h1 style="margin:18px 20px 0;font-family:Brothers,Georgia,serif;font-weight:400;font-size:36px;line-height:1.02">{{ npf.heading }}</h1>
<div style="display:flex;flex-direction:column;gap:16px;padding:20px 20px 0">
<label style="display:flex;flex-direction:column;gap:7px"><span style="font-family:Venture,Georgia,serif;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#b9b2a5">Name</span><input value="{{ npf.name }}" onChange="{{ npf.setName }}" placeholder="Gallery, studio, shop, café…" style="height:50px;padding:0 16px;border-radius:16px;border:1px solid rgba(241,236,226,.14);background:#31353c;color:#f1ece2;font-size:15px;outline:0"></input></label>
<div style="display:flex;flex-direction:column;gap:8px"><span style="font-family:Venture,Georgia,serif;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#b9b2a5">Kind</span><div style="display:flex;flex-wrap:wrap;gap:8px"><sc-for list="{{ npf.kinds }}" as="c" hint-placeholder-count="5"><button onClick="{{ c.pick }}" style="height:36px;padding:0 14px;border-radius:18px;border:1px solid {{ c.border }};background:{{ c.bg }};color:{{ c.fg }};font-family:Basteleur,Georgia,serif;font-size:13.5px;cursor:pointer">{{ c.label }}</button></sc-for></div></div>
<label style="display:flex;flex-direction:column;gap:7px"><span style="font-family:Venture,Georgia,serif;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#b9b2a5">Address or area</span><input value="{{ npf.area }}" onChange="{{ npf.setArea }}" placeholder="12 Rue de Turenne, 3e" style="height:50px;padding:0 16px;border-radius:16px;border:1px solid rgba(241,236,226,.14);background:#31353c;color:#f1ece2;font-size:15px;outline:0"></input></label>
<label style="display:flex;flex-direction:column;gap:7px"><span style="font-family:Venture,Georgia,serif;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#b9b2a5">Website · optional</span><input type="url" value="{{ npf.url }}" onChange="{{ npf.setUrl }}" placeholder="https://" style="height:50px;padding:0 16px;border-radius:16px;border:1px solid rgba(241,236,226,.14);background:#31353c;color:#f1ece2;font-size:15px;outline:0"></input></label>
<label style="display:flex;flex-direction:column;gap:7px"><span style="font-family:Venture,Georgia,serif;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#b9b2a5">Why you like it</span><textarea value="{{ npf.note }}" onChange="{{ npf.setNote }}" rows="3" placeholder="Guests read this on the place card" style="padding:14px 16px;border-radius:16px;border:1px solid rgba(241,236,226,.14);background:#31353c;color:#f1ece2;font-size:15px;line-height:1.45;outline:0;resize:none"></textarea></label>
<div style="display:flex;flex-direction:column;gap:8px"><span style="font-family:Venture,Georgia,serif;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#b9b2a5">Tags · guests filter the catalogue by these</span><div style="display:flex;flex-wrap:wrap;gap:8px"><sc-for list="{{ npf.tagChips }}" as="c" hint-placeholder-count="6"><button onClick="{{ c.pick }}" style="height:34px;padding:0 12px;border-radius:17px;border:1px solid {{ c.border }};background:{{ c.bg }};color:{{ c.fg }};font-family:Basteleur,Georgia,serif;font-size:13px;cursor:pointer">{{ c.label }}</button></sc-for></div><div style="display:flex;gap:8px"><input value="{{ npf.tagIn }}" onChange="{{ npf.setTagIn }}" placeholder="New tag" style="flex:1;min-width:0;height:44px;padding:0 14px;border-radius:14px;border:1px solid rgba(241,236,226,.14);background:#31353c;color:#f1ece2;font-size:14.5px;outline:0"></input><button onClick="{{ npf.addTag }}" style="flex:none;height:44px;padding:0 16px;border-radius:14px;border:1px solid #c9a25c;background:transparent;color:#dcc08a;font-family:Basteleur,Georgia,serif;font-size:14px;cursor:pointer">Add</button></div></div>
<div style="display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:18px;background:#31353c;border:1px solid rgba(241,236,226,.1)"><div style="flex:1;display:flex;flex-direction:column;gap:2px"><span style="font-family:Basteleur,Georgia,serif;font-weight:700;font-size:15px">Feature on Discover</span><span style="font-size:12.5px;color:#b9b2a5">Shows under Favourite places</span></div><button onClick="{{ npf.favToggle }}" style="flex:none;position:relative;width:50px;height:28px;border-radius:14px;border:0;background:{{ npf.favTrack }};cursor:pointer;padding:0"><span style="position:absolute;top:3px;left:{{ npf.favKnob }};width:22px;height:22px;border-radius:11px;background:#f1ece2;transition:left .2s"></span></button></div>
</div>
<button onClick="{{ npf.save }}" style="display:block;width:calc(100% - 32px);height:56px;margin:22px 16px 0;border:0;background:{{ npf.bg }};color:{{ npf.fg }};font-family:Basteleur,Georgia,serif;font-weight:700;font-size:16px;cursor:pointer;clip-path:polygon(12px 0,calc(100% - 12px) 0,100% 12px,100% calc(100% - 12px),calc(100% - 12px) 100%,12px 100%,0 calc(100% - 12px),0 12px)">{{ npf.saveLabel }}</button>
</div>
</sc-if>
</div>
</body>
</html>
