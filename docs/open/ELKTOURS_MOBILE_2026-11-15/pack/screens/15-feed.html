<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>15-feed</title>
<!--
Design reference, not production code.
Markup for one screen, cut from "Elkdonis App.dc.html" lines 1276-1285. All sizes, colours and radii are in the inline styles.
{{ name }}  a value filled in at runtime (see renderVals() in Elkdonis App.dc.html for what it holds)
<sc-if>     shows its children when the value is true
<sc-for>    repeats its children once per item in the list
Described in screens-guest.md. For the live, working version open "Elkdonis Experiences.dc.html".
-->
<style>@font-face{font-family:"Basteleur";src:url("../fonts/Basteleur-Moonlight.woff2") format("woff2");font-weight:400;font-display:swap}@font-face{font-family:"Basteleur";src:url("../fonts/Basteleur-Bold.woff2") format("woff2");font-weight:700;font-display:swap}@font-face{font-family:"Brothers";src:url("../fonts/BrothersTypeface-Regular.otf") format("opentype");font-display:swap}@font-face{font-family:"Venture";src:url("../fonts/Venture-nRqOR.otf") format("opentype");font-display:swap}@keyframes elkIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@keyframes elkUp{from{transform:translateY(100%)}to{transform:none}}@keyframes elkFade{from{opacity:0}to{opacity:1}}@keyframes elkToast{0%{opacity:0;transform:translateY(-8px)}10%{opacity:1;transform:none}85%{opacity:1}100%{opacity:0}}*{box-sizing:border-box}html,body{background:#1c1f24}body{margin:0}button,input,textarea{font-family:inherit}a{color:#dcc08a}a:hover{color:#f1ece2}input::placeholder,textarea::placeholder{color:#857f76}sc-if,sc-for{display:contents}body{background:#16181c;display:flex;justify-content:center;padding:24px}</style>
</head>
<body>
<div style="position:relative;flex:none;width:390px;height:844px;overflow:hidden;background:linear-gradient(180deg,#25282e 0%,#2b2f36 55%,#282b31 100%);color:#f1ece2;font-family:Basteleur,Georgia,serif;font-size:15px">
<sc-if value="{{ is.feed }}" hint-placeholder-val="{{ false }}">
<div style="position:absolute;inset:0;overflow-y:auto;scrollbar-width:none;padding:58px 0 60px;animation:elkIn .32s ease both">
<div style="display:flex;align-items:center;gap:14px;padding:0 16px"><button onClick="{{ back }}" style="flex:none;width:44px;height:44px;border-radius:22px;border:1px solid rgba(241,236,226,.16);background:rgba(241,236,226,.04);color:#f1ece2;font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0">←</button><span style="font-family:Venture,Georgia,serif;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:#b9b2a5">From the guides · {{ fdr.count }}</span></div>
<h1 style="margin:18px 20px 0;font-family:Brothers,Georgia,serif;font-weight:400;font-size:42px;line-height:1">Feed</h1>
<p style="margin:10px 20px 0;font-size:14.5px;line-height:1.5;color:#b9b2a5;text-wrap:pretty">Posts and links the guides share, confirmed by the office. Anyone can comment. Each one is also a topic in the forum's Feed section.</p>
<div style="display:flex;flex-direction:column;gap:8px;padding:18px 16px 0">
<sc-for list="{{ fdr.rows }}" as="c" hint-placeholder-count="3"><button onClick="{{ c.open }}" style="display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px 12px 12px;border-radius:20px;background:#31353c;border:1px solid rgba(241,236,226,.09);color:#f1ece2;text-align:left;cursor:pointer"><span style="flex:none;width:48px;height:56px;border-radius:24px 24px 8px 8px;border:1px solid #c9a25c;background:repeating-linear-gradient(135deg,rgba(201,162,92,.12) 0 1px,transparent 1px 7px),#3d424a;display:flex;align-items:center;justify-content:center;font-family:Brothers,Georgia,serif;font-size:19px;color:#dcc08a">{{ c.initial }}</span><span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:3px"><span style="font-family:Venture,Georgia,serif;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#b9b2a5">{{ c.kicker }}</span><span style="font-weight:700;font-size:15.5px;line-height:1.25">{{ c.title }}</span><span style="font-size:12.5px;color:#dcc08a">{{ c.sub }}</span></span><span style="color:#c9a25c;font-size:18px">›</span></button></sc-for>
</div>
</div>
</sc-if>
</div>
</body>
</html>
