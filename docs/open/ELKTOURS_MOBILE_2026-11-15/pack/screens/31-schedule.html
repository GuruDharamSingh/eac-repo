<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>31-schedule</title>
<!--
Design reference, not production code.
Markup for one screen, cut from "Elkdonis App.dc.html" lines 430-490. All sizes, colours and radii are in the inline styles.
{{ name }}  a value filled in at runtime (see renderVals() in Elkdonis App.dc.html for what it holds)
<sc-if>     shows its children when the value is true
<sc-for>    repeats its children once per item in the list
Described in screens-board.md. For the live, working version open "Elkdonis Experiences.dc.html".
-->
<style>@font-face{font-family:"Basteleur";src:url("../fonts/Basteleur-Moonlight.woff2") format("woff2");font-weight:400;font-display:swap}@font-face{font-family:"Basteleur";src:url("../fonts/Basteleur-Bold.woff2") format("woff2");font-weight:700;font-display:swap}@font-face{font-family:"Brothers";src:url("../fonts/BrothersTypeface-Regular.otf") format("opentype");font-display:swap}@font-face{font-family:"Venture";src:url("../fonts/Venture-nRqOR.otf") format("opentype");font-display:swap}@keyframes elkIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@keyframes elkUp{from{transform:translateY(100%)}to{transform:none}}@keyframes elkFade{from{opacity:0}to{opacity:1}}@keyframes elkToast{0%{opacity:0;transform:translateY(-8px)}10%{opacity:1;transform:none}85%{opacity:1}100%{opacity:0}}*{box-sizing:border-box}html,body{background:#1c1f24}body{margin:0}button,input,textarea{font-family:inherit}a{color:#dcc08a}a:hover{color:#f1ece2}input::placeholder,textarea::placeholder{color:#857f76}sc-if,sc-for{display:contents}body{background:#16181c;display:flex;justify-content:center;padding:24px}</style>
</head>
<body>
<div style="position:relative;flex:none;width:390px;height:844px;overflow:hidden;background:linear-gradient(180deg,#25282e 0%,#2b2f36 55%,#282b31 100%);color:#f1ece2;font-family:Basteleur,Georgia,serif;font-size:15px">
<sc-if value="{{ is.schedule }}" hint-placeholder-val="{{ false }}">
<div style="position:absolute;inset:0;overflow-y:auto;scrollbar-width:none;padding:60px 0 130px;animation:elkIn .32s ease both">
<div style="display:flex;align-items:center;gap:12px;padding:0 18px">
<div style="flex:none;width:44px;height:44px;border-radius:22px;border:1px solid #c9a25c;background:#3d424a;display:flex;align-items:center;justify-content:center;font-family:Brothers,Georgia,serif;font-size:20px;color:#dcc08a">{{ viewer.initial }}</div>
<div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px"><span style="font-family:Basteleur,Georgia,serif;font-weight:700;font-size:15.5px">{{ viewer.name }}</span><span style="font-size:12.5px;color:#b9b2a5">{{ viewer.sub }}</span></div>
<div style="display:flex;padding:3px;border-radius:20px;background:#1f2227;border:1px solid rgba(241,236,226,.12)">
<sc-for list="{{ roles }}" as="r" hint-placeholder-count="2"><button onClick="{{ r.pick }}" style="height:32px;padding:0 12px;border-radius:16px;border:0;background:{{ r.bg }};color:{{ r.fg }};font-family:Venture,Georgia,serif;font-size:11px;letter-spacing:.14em;text-transform:uppercase;cursor:pointer">{{ r.label }}</button></sc-for>
</div>
</div>
<div style="display:flex;align-items:flex-end;justify-content:space-between;margin:22px 18px 0">
<div style="display:flex;flex-direction:column;gap:6px"><span style="font-family:Venture,Georgia,serif;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:#c9a25c">{{ weekLabel }}</span><h1 style="margin:0;font-family:Brothers,Georgia,serif;font-weight:400;font-size:40px;line-height:1">Schedule</h1></div>
<div style="display:flex;gap:8px">
<button onClick="{{ prevWeek }}" style="width:40px;height:40px;border-radius:20px;border:1px solid rgba(241,236,226,.16);background:transparent;color:#f1ece2;font-size:16px;cursor:pointer;opacity:{{ prevOpacity }};padding:0">‹</button>
<button onClick="{{ nextWeek }}" style="width:40px;height:40px;border-radius:20px;border:1px solid rgba(241,236,226,.16);background:transparent;color:#f1ece2;font-size:16px;cursor:pointer;opacity:{{ nextOpacity }};padding:0">›</button>
</div>
</div>
<div style="display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin:16px 14px 0">
<sc-for list="{{ strip }}" as="w" hint-placeholder-count="7">
<button onClick="{{ w.pick }}" style="display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 7px;border-radius:24px;border:1px solid {{ w.border }};background:{{ w.bg }};color:{{ w.fg }};cursor:pointer">
<span style="font-family:Venture,Georgia,serif;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;opacity:.8">{{ w.wd }}</span>
<span style="font-family:Basteleur,Georgia,serif;font-weight:700;font-size:18px;line-height:1.1">{{ w.num }}</span>
<span style="height:10px;font-size:11px;line-height:10px;letter-spacing:1px;color:{{ w.dotColor }}">{{ w.dots }}</span>
</button>
</sc-for>
</div>
<sc-if value="{{ isAdmin }}" hint-placeholder-val="{{ false }}">
<div style="display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:14px 18px 0">
<sc-for list="{{ gfilters }}" as="c" hint-placeholder-count="3"><button onClick="{{ c.pick }}" style="flex:none;height:34px;padding:0 14px;border-radius:17px;border:1px solid {{ c.border }};background:{{ c.bg }};color:{{ c.fg }};font-family:Basteleur,Georgia,serif;font-size:13.5px;cursor:pointer">{{ c.label }}</button></sc-for>
</div>
</sc-if>
<sc-if value="{{ banner.show }}" hint-placeholder-val="{{ false }}">
<button onClick="{{ banner.go }}" style="display:flex;align-items:center;gap:14px;width:calc(100% - 32px);margin:16px 16px 0;padding:14px 16px;border-radius:20px;border:1px solid rgba(232,128,92,.65);background:rgba(232,128,92,.1);color:#f1ece2;text-align:left;cursor:pointer">
<span style="flex:none;width:12px;height:12px;background:#e8805c;transform:rotate(45deg)"></span>
<div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px"><span style="font-family:Basteleur,Georgia,serif;font-weight:700;font-size:15px">{{ banner.text }}</span><span style="font-size:12.5px;color:#e6c3b4">{{ banner.sub }}</span></div>
<span style="font-family:Venture,Georgia,serif;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#e8805c">Decide →</span>
</button>
</sc-if>
<div style="display:flex;flex-direction:column;gap:6px;padding:4px 16px 0">
<sc-for list="{{ groups }}" as="g" hint-placeholder-count="2">
<div style="display:flex;align-items:center;gap:10px;margin:18px 4px 8px"><span style="font-family:Venture,Georgia,serif;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#c9a25c">{{ g.label }}</span><div style="flex:1;height:1px;background:rgba(241,236,226,.1)"></div><span style="font-size:12px;color:#8f8a82">{{ g.count }}</span></div>
<div style="display:flex;flex-direction:column;gap:8px">
<sc-for list="{{ g.items }}" as="d" hint-placeholder-count="2">
<button onClick="{{ d.open }}" style="display:flex;flex-direction:column;gap:11px;width:100%;text-align:left;padding:14px 16px;border-radius:20px;background:#31353c;border:1px solid rgba(241,236,226,.09);color:#f1ece2;cursor:pointer;opacity:{{ d.opacity }}">
<div style="display:flex;align-items:flex-start;gap:12px;width:100%">
<div style="display:flex;flex-direction:column;min-width:52px"><span style="font-family:Basteleur,Georgia,serif;font-weight:700;font-size:19px;line-height:1.1">{{ d.time }}</span><span style="font-family:Venture,Georgia,serif;font-size:11px;letter-spacing:.1em;color:#8f8a82">to {{ d.end }}</span></div>
<div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:4px"><span style="font-size:15.5px;line-height:1.25;text-decoration:{{ d.strike }}">{{ d.title }}</span><span style="font-size:12.5px;color:{{ d.statusColor }}">{{ d.status }}</span></div>
<sc-if value="{{ d.showGuide }}" hint-placeholder-val="{{ false }}"><span style="flex:none;width:30px;height:30px;border-radius:15px;background:#3e434c;border:1px solid rgba(201,162,92,.55);display:flex;align-items:center;justify-content:center;font-family:Brothers,Georgia,serif;font-size:14px;color:#dcc08a">{{ d.initial }}</span></sc-if>
</div>
<div style="display:flex;align-items:center;gap:12px;width:100%">
<div style="position:relative;flex:1;height:6px;border-radius:3px;background:rgba(241,236,226,.1)"><div style="position:absolute;left:0;top:0;bottom:0;border-radius:3px;width:{{ d.fillPct }};background:{{ d.fillColor }}"></div><div style="position:absolute;top:-4px;bottom:-4px;width:2px;margin-left:-1px;left:{{ d.minPct }};background:#f1ece2;border-radius:1px"></div></div>
<span style="font-family:Venture,Georgia,serif;font-size:12px;letter-spacing:.08em;color:#b9b2a5;min-width:38px;text-align:right">{{ d.seats }}</span>
</div>
<sc-if value="{{ d.hasExtra }}" hint-placeholder-val="{{ false }}"><span style="font-size:12px;color:#8f8a82">{{ d.extra }}</span></sc-if>
</button>
</sc-for>
</div>
</sc-for>
<sc-if value="{{ weekEmpty }}" hint-placeholder-val="{{ false }}"><p style="margin:24px 4px;color:#b9b2a5;font-size:14px">Nothing scheduled here yet. Tap + to add slots.</p></sc-if>
</div>
</div>
</sc-if>
</div>
</body>
</html>
