<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>39-share-post</title>
<!--
Design reference, not production code.
Markup for one screen, cut from "Elkdonis App.dc.html" lines 1137-1150. All sizes, colours and radii are in the inline styles.
{{ name }}  a value filled in at runtime (see renderVals() in Elkdonis App.dc.html for what it holds)
<sc-if>     shows its children when the value is true
<sc-for>    repeats its children once per item in the list
Described in screens-board.md. For the live, working version open "Elkdonis Experiences.dc.html".
-->
<style>@font-face{font-family:"Basteleur";src:url("../fonts/Basteleur-Moonlight.woff2") format("woff2");font-weight:400;font-display:swap}@font-face{font-family:"Basteleur";src:url("../fonts/Basteleur-Bold.woff2") format("woff2");font-weight:700;font-display:swap}@font-face{font-family:"Brothers";src:url("../fonts/BrothersTypeface-Regular.otf") format("opentype");font-display:swap}@font-face{font-family:"Venture";src:url("../fonts/Venture-nRqOR.otf") format("opentype");font-display:swap}@keyframes elkIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@keyframes elkUp{from{transform:translateY(100%)}to{transform:none}}@keyframes elkFade{from{opacity:0}to{opacity:1}}@keyframes elkToast{0%{opacity:0;transform:translateY(-8px)}10%{opacity:1;transform:none}85%{opacity:1}100%{opacity:0}}*{box-sizing:border-box}html,body{background:#1c1f24}body{margin:0}button,input,textarea{font-family:inherit}a{color:#dcc08a}a:hover{color:#f1ece2}input::placeholder,textarea::placeholder{color:#857f76}sc-if,sc-for{display:contents}body{background:#16181c;display:flex;justify-content:center;padding:24px}</style>
</head>
<body>
<div style="position:relative;flex:none;width:390px;height:844px;overflow:hidden;background:linear-gradient(180deg,#25282e 0%,#2b2f36 55%,#282b31 100%);color:#f1ece2;font-family:Basteleur,Georgia,serif;font-size:15px">
<sc-if value="{{ is.post }}" hint-placeholder-val="{{ false }}">
<div style="position:absolute;inset:0;overflow-y:auto;scrollbar-width:none;padding:58px 0 60px;animation:elkIn .32s ease both">
<div style="display:flex;align-items:center;gap:14px;padding:0 16px"><button onClick="{{ back }}" style="flex:none;width:44px;height:44px;border-radius:22px;border:1px solid rgba(241,236,226,.16);background:rgba(241,236,226,.04);color:#f1ece2;font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0">←</button><span style="font-family:Venture,Georgia,serif;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:#b9b2a5">Share on Discover</span></div>
<h1 style="margin:18px 20px 0;font-family:Brothers,Georgia,serif;font-weight:400;font-size:36px;line-height:1.02">A post or a link</h1>
<div style="display:flex;gap:8px;padding:18px 20px 0"><sc-for list="{{ postF.kinds }}" as="c" hint-placeholder-count="2"><button onClick="{{ c.pick }}" style="flex:1;height:42px;border-radius:21px;border:1px solid {{ c.border }};background:{{ c.bg }};color:{{ c.fg }};font-family:Basteleur,Georgia,serif;font-size:14.5px;cursor:pointer">{{ c.label }}</button></sc-for></div>
<div style="display:flex;flex-direction:column;gap:16px;padding:20px 20px 0">
<label style="display:flex;flex-direction:column;gap:7px"><span style="font-family:Venture,Georgia,serif;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#b9b2a5">Title</span><input value="{{ postF.title }}" onChange="{{ postF.setTitle }}" placeholder="What guests will see first" style="height:50px;padding:0 16px;border-radius:16px;border:1px solid rgba(241,236,226,.14);background:#31353c;color:#f1ece2;font-size:15px;outline:0"></input></label>
<sc-if value="{{ postF.isLink }}" hint-placeholder-val="{{ false }}"><label style="display:flex;flex-direction:column;gap:7px"><span style="font-family:Venture,Georgia,serif;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#b9b2a5">Link</span><input type="url" value="{{ postF.url }}" onChange="{{ postF.setUrl }}" placeholder="https://" style="height:50px;padding:0 16px;border-radius:16px;border:1px solid rgba(241,236,226,.14);background:#31353c;color:#f1ece2;font-size:15px;outline:0"></input></label></sc-if>
<label style="display:flex;flex-direction:column;gap:7px"><span style="font-family:Venture,Georgia,serif;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#b9b2a5">{{ postF.bodyLabel }}</span><textarea value="{{ postF.body }}" onChange="{{ postF.setBody }}" placeholder="{{ postF.bodyHint }}" rows="6" style="padding:14px 16px;border-radius:16px;border:1px solid rgba(241,236,226,.14);background:#31353c;color:#f1ece2;font-size:15px;line-height:1.45;outline:0;resize:none"></textarea></label>
</div>
<p style="margin:14px 20px 0;font-size:13px;line-height:1.5;color:#8f8a82">{{ postF.note }}</p>
<button onClick="{{ postF.send }}" style="display:block;width:calc(100% - 32px);height:56px;margin:18px 16px 0;border:0;background:{{ postF.bg }};color:{{ postF.fg }};font-family:Basteleur,Georgia,serif;font-weight:700;font-size:16px;cursor:pointer;clip-path:polygon(12px 0,calc(100% - 12px) 0,100% 12px,100% calc(100% - 12px),calc(100% - 12px) 100%,12px 100%,0 calc(100% - 12px),0 12px)">{{ postF.cta }}</button>
</div>
</sc-if>
</div>
</body>
</html>
