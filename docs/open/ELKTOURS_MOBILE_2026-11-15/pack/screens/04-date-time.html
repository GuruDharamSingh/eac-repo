<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>04-date-time</title>
<!--
Design reference, not production code.
Markup for one screen, cut from "Elkdonis App.dc.html" lines 308-356. All sizes, colours and radii are in the inline styles.
{{ name }}  a value filled in at runtime (see renderVals() in Elkdonis App.dc.html for what it holds)
<sc-if>     shows its children when the value is true
<sc-for>    repeats its children once per item in the list
Described in screens-guest.md. For the live, working version open "Elkdonis Experiences.dc.html".
-->
<style>@font-face{font-family:"Basteleur";src:url("../fonts/Basteleur-Moonlight.woff2") format("woff2");font-weight:400;font-display:swap}@font-face{font-family:"Basteleur";src:url("../fonts/Basteleur-Bold.woff2") format("woff2");font-weight:700;font-display:swap}@font-face{font-family:"Brothers";src:url("../fonts/BrothersTypeface-Regular.otf") format("opentype");font-display:swap}@font-face{font-family:"Venture";src:url("../fonts/Venture-nRqOR.otf") format("opentype");font-display:swap}@keyframes elkIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@keyframes elkUp{from{transform:translateY(100%)}to{transform:none}}@keyframes elkFade{from{opacity:0}to{opacity:1}}@keyframes elkToast{0%{opacity:0;transform:translateY(-8px)}10%{opacity:1;transform:none}85%{opacity:1}100%{opacity:0}}*{box-sizing:border-box}html,body{background:#1c1f24}body{margin:0}button,input,textarea{font-family:inherit}a{color:#dcc08a}a:hover{color:#f1ece2}input::placeholder,textarea::placeholder{color:#857f76}sc-if,sc-for{display:contents}body{background:#16181c;display:flex;justify-content:center;padding:24px}</style>
</head>
<body>
<div style="position:relative;flex:none;width:390px;height:844px;overflow:hidden;background:linear-gradient(180deg,#25282e 0%,#2b2f36 55%,#282b31 100%);color:#f1ece2;font-family:Basteleur,Georgia,serif;font-size:15px">
<sc-if value="{{ is.dates }}" hint-placeholder-val="{{ false }}">
<div style="position:absolute;inset:0;overflow-y:auto;scrollbar-width:none;padding:58px 0 150px;animation:elkIn .32s ease both">
<div style="display:flex;align-items:center;gap:14px;padding:0 16px">
<button onClick="{{ back }}" style="flex:none;width:44px;height:44px;border-radius:22px;border:1px solid rgba(241,236,226,.16);background:rgba(241,236,226,.04);color:#f1ece2;font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0">←</button>
<div style="display:flex;flex-direction:column;gap:2px;min-width:0"><span style="font-family:Venture,Georgia,serif;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:#b9b2a5">Choose a date</span><span style="font-family:Basteleur,Georgia,serif;font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ detail.title }}</span></div>
</div>
<div style="margin:20px 16px 0;padding:18px 16px;border-radius:24px;background:#31353c;border:1px solid rgba(241,236,226,.08)">
<div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px"><span style="font-family:Brothers,Georgia,serif;font-size:26px">November</span><span style="font-family:Venture,Georgia,serif;font-size:12px;letter-spacing:.16em;color:#b9b2a5">2026</span></div>
<div style="display:grid;grid-template-columns:repeat(7,minmax(0,1fr));row-gap:6px;text-align:center">
<sc-for list="{{ weekHead }}" as="w" hint-placeholder-count="7"><span style="font-family:Venture,Georgia,serif;font-size:10.5px;letter-spacing:.12em;color:#8f8a82;padding-bottom:4px">{{ w }}</span></sc-for>
<sc-for list="{{ dates.cal }}" as="c" hint-placeholder-count="35">
<div style="display:flex;justify-content:center"><button onClick="{{ c.pick }}" style="width:38px;height:38px;border-radius:19px;border:1px solid {{ c.border }};background:{{ c.bg }};color:{{ c.fg }};font-family:Basteleur,Georgia,serif;font-size:14.5px;cursor:{{ c.cursor }};padding:0">{{ c.label }}</button></div>
</sc-for>
</div>
</div>
<div style="display:flex;align-items:center;gap:10px;margin:24px 20px 12px">
<span style="font-family:Venture,Georgia,serif;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#c9a25c">{{ dates.dayLabel }}</span>
<div style="flex:1;height:1px;background:linear-gradient(90deg,rgba(201,162,92,.6),transparent)"></div>
</div>
<div style="display:flex;flex-direction:column;gap:10px;padding:0 16px">
<sc-for list="{{ dates.slots }}" as="sl" hint-placeholder-count="2">
<button onClick="{{ sl.pick }}" style="display:flex;align-items:center;gap:14px;width:100%;padding:14px 16px;border-radius:20px;border:1px solid {{ sl.border }};background:{{ sl.bg }};color:#f1ece2;text-align:left;cursor:pointer;opacity:{{ sl.opacity }}">
<div style="display:flex;flex-direction:column;min-width:56px"><span style="font-family:Basteleur,Georgia,serif;font-weight:700;font-size:21px;line-height:1.05">{{ sl.time }}</span><span style="font-family:Venture,Georgia,serif;font-size:11px;letter-spacing:.1em;color:#8f8a82">to {{ sl.end }}</span></div>
<div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:3px">
<span style="font-size:14px;color:{{ sl.l1Color }}">{{ sl.l1 }}</span>
<span style="font-size:12px;line-height:1.35;color:#8f8a82">{{ sl.l2 }} · {{ sl.guide }}</span>
</div>
<span style="flex:none;width:22px;height:22px;border-radius:11px;border:1.5px solid {{ sl.dotBorder }};display:flex;align-items:center;justify-content:center"><span style="width:10px;height:10px;border-radius:5px;background:{{ sl.dot }}"></span></span>
</button>
</sc-for>
<sc-if value="{{ dates.noSlots }}" hint-placeholder-val="{{ false }}"><p style="margin:4px 4px;color:#b9b2a5;font-size:14px;line-height:1.5">No dates are open for this one yet. Private days are arranged directly with the guide.</p></sc-if>
</div>
<sc-if value="{{ dates.hasSel }}" hint-placeholder-val="{{ true }}">
<div style="display:flex;align-items:center;justify-content:space-between;margin:18px 16px 0;padding:14px 16px;border-radius:20px;background:#31353c;border:1px solid rgba(241,236,226,.08)">
<div style="display:flex;flex-direction:column;gap:2px"><span style="font-family:Basteleur,Georgia,serif;font-weight:700;font-size:15.5px">People</span><span style="font-size:12.5px;color:#8f8a82">{{ dates.partyHint }}</span></div>
<div style="display:flex;align-items:center;gap:14px">
<button onClick="{{ dates.partyMinus }}" style="width:38px;height:38px;border-radius:19px;border:1px solid rgba(241,236,226,.22);background:transparent;color:#f1ece2;font-size:20px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0">−</button>
<span style="min-width:18px;text-align:center;font-family:Basteleur,Georgia,serif;font-weight:700;font-size:20px">{{ dates.party }}</span>
<button onClick="{{ dates.partyPlus }}" style="width:38px;height:38px;border-radius:19px;border:1px solid rgba(241,236,226,.22);background:transparent;color:#f1ece2;font-size:20px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0">+</button>
</div>
</div>
<p style="margin:14px 22px 0;font-size:12.5px;line-height:1.55;color:#8f8a82;text-wrap:pretty">{{ dates.rule }}</p>
</sc-if>
</div>
<div style="position:absolute;left:0;right:0;bottom:0;padding:22px 20px 30px;background:linear-gradient(180deg,rgba(40,43,49,0) 0%,#282b31 32%);display:flex;align-items:center;gap:16px">
<div style="display:flex;flex-direction:column;gap:2px;min-width:92px"><span style="font-family:Basteleur,Georgia,serif;font-weight:700;font-size:22px;color:#dcc08a">{{ dates.total }}</span><span style="font-size:12.5px;color:#b9b2a5">{{ dates.totalSub }}</span></div>
<button onClick="{{ dates.go }}" style="flex:1;display:flex;align-items:center;justify-content:center;height:56px;padding:0 24px;border:0;background:{{ dates.ctaBg }};color:#1b1e23;font-family:Basteleur,Georgia,serif;font-weight:700;font-size:16px;cursor:pointer;clip-path:polygon(12px 0,calc(100% - 12px) 0,100% 12px,100% calc(100% - 12px),calc(100% - 12px) 100%,12px 100%,0 calc(100% - 12px),0 12px)">{{ dates.cta }}</button>
</div>
</sc-if>
</div>
</body>
</html>
