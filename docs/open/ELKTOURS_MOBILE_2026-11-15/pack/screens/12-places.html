<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>12-places</title>
<!--
Design reference, not production code.
Markup for one screen, cut from "Elkdonis App.dc.html" lines 1063-1089. All sizes, colours and radii are in the inline styles.
{{ name }}  a value filled in at runtime (see renderVals() in Elkdonis App.dc.html for what it holds)
<sc-if>     shows its children when the value is true
<sc-for>    repeats its children once per item in the list
Described in screens-guest.md. For the live, working version open "Elkdonis Experiences.dc.html".
-->
<style>@font-face{font-family:"Basteleur";src:url("../fonts/Basteleur-Moonlight.woff2") format("woff2");font-weight:400;font-display:swap}@font-face{font-family:"Basteleur";src:url("../fonts/Basteleur-Bold.woff2") format("woff2");font-weight:700;font-display:swap}@font-face{font-family:"Brothers";src:url("../fonts/BrothersTypeface-Regular.otf") format("opentype");font-display:swap}@font-face{font-family:"Venture";src:url("../fonts/Venture-nRqOR.otf") format("opentype");font-display:swap}@keyframes elkIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@keyframes elkUp{from{transform:translateY(100%)}to{transform:none}}@keyframes elkFade{from{opacity:0}to{opacity:1}}@keyframes elkToast{0%{opacity:0;transform:translateY(-8px)}10%{opacity:1;transform:none}85%{opacity:1}100%{opacity:0}}*{box-sizing:border-box}html,body{background:#1c1f24}body{margin:0}button,input,textarea{font-family:inherit}a{color:#dcc08a}a:hover{color:#f1ece2}input::placeholder,textarea::placeholder{color:#857f76}sc-if,sc-for{display:contents}body{background:#16181c;display:flex;justify-content:center;padding:24px}</style>
</head>
<body>
<div style="position:relative;flex:none;width:390px;height:844px;overflow:hidden;background:linear-gradient(180deg,#25282e 0%,#2b2f36 55%,#282b31 100%);color:#f1ece2;font-family:Basteleur,Georgia,serif;font-size:15px">
<sc-if value="{{ is.places }}" hint-placeholder-val="{{ false }}">
<div style="position:absolute;inset:0;overflow-y:auto;scrollbar-width:none;padding:58px 0 60px;animation:elkIn .32s ease both">
<div style="display:flex;align-items:center;gap:14px;padding:0 16px">
<button onClick="{{ back }}" style="flex:none;width:44px;height:44px;border-radius:22px;border:1px solid rgba(241,236,226,.16);background:rgba(241,236,226,.04);color:#f1ece2;font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0">←</button>
<span style="font-family:Venture,Georgia,serif;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:#b9b2a5">Paris · {{ pl.count }}</span>
</div>
<h1 style="margin:18px 20px 0;font-family:Brothers,Georgia,serif;font-weight:400;font-size:40px;line-height:1">Places</h1>
<p style="margin:10px 20px 0;font-size:14.5px;line-height:1.5;color:#b9b2a5;text-wrap:pretty">{{ pl.intro }}</p>
<div style="display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:16px 20px 4px">
<sc-for list="{{ pl.filters }}" as="c" hint-placeholder-count="5"><button onClick="{{ c.pick }}" style="flex:none;height:36px;padding:0 14px;border-radius:18px;border:1px solid {{ c.border }};background:{{ c.bg }};color:{{ c.fg }};font-family:Basteleur,Georgia,serif;font-size:13.5px;cursor:pointer;white-space:nowrap">{{ c.label }}</button></sc-for>
</div>
<sc-if value="{{ pl.canEdit }}" hint-placeholder-val="{{ false }}"><button onClick="{{ pl.add }}" style="display:block;width:calc(100% - 32px);height:48px;margin:12px 16px 0;border-radius:20px;border:1px dashed rgba(201,162,92,.7);background:transparent;color:#dcc08a;font-family:Basteleur,Georgia,serif;font-size:14.5px;cursor:pointer">+ Add a place</button></sc-if>
<div style="display:flex;flex-direction:column;gap:8px;padding:12px 16px 0">
<sc-for list="{{ pl.items }}" as="c" hint-placeholder-count="5">
<div style="display:flex;align-items:center;gap:12px;padding:10px 12px 10px 10px;border-radius:20px;background:#31353c;border:1px solid rgba(241,236,226,.08)">
<div onClick="{{ c.tap }}" style="flex:1;min-width:0;display:flex;align-items:center;gap:12px;cursor:pointer">
<span style="flex:none;width:52px;height:64px;border-radius:26px 26px 8px 8px;background:repeating-linear-gradient(135deg,rgba(201,162,92,.1) 0 1px,transparent 1px 7px),linear-gradient(165deg,#474c56,#2e3238);border:1px solid rgba(241,236,226,.1)"></span>
<span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:3px"><span style="font-family:Venture,Georgia,serif;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#b9b2a5">{{ c.label }}</span><span style="font-family:Basteleur,Georgia,serif;font-weight:700;font-size:15.5px;line-height:1.25">{{ c.name }}</span><span style="font-size:12px;color:#8f8a82">{{ c.tagLine }}</span><span style="font-size:12px;color:#dcc08a">{{ c.sub }}</span></span>
</div>
<sc-if value="{{ pl.canEdit }}" hint-placeholder-val="{{ false }}"><button onClick="{{ c.toggleFav }}" style="flex:none;width:44px;height:44px;border-radius:22px;border:1px solid rgba(241,236,226,.14);background:transparent;color:{{ c.starColor }};font-size:20px;cursor:pointer;padding:0">{{ c.star }}</button></sc-if>
<sc-if value="{{ pl.isGuest }}" hint-placeholder-val="{{ true }}"><span style="flex:none;color:#c9a25c;font-size:18px">›</span></sc-if>
</div>
</sc-for>
<sc-if value="{{ pl.empty }}" hint-placeholder-val="{{ false }}"><p style="margin:12px 4px;font-size:14px;color:#b9b2a5">None here yet.</p></sc-if>
</div>
</div>
</sc-if>
</div>
</body>
</html>
