<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>07-experience</title>
<!--
Design reference, not production code.
Markup for one screen, cut from "Elkdonis App.dc.html" lines 733-778. All sizes, colours and radii are in the inline styles.
{{ name }}  a value filled in at runtime (see renderVals() in Elkdonis App.dc.html for what it holds)
<sc-if>     shows its children when the value is true
<sc-for>    repeats its children once per item in the list
Described in screens-guest.md. For the live, working version open "Elkdonis Experiences.dc.html".
-->
<style>@font-face{font-family:"Basteleur";src:url("../fonts/Basteleur-Moonlight.woff2") format("woff2");font-weight:400;font-display:swap}@font-face{font-family:"Basteleur";src:url("../fonts/Basteleur-Bold.woff2") format("woff2");font-weight:700;font-display:swap}@font-face{font-family:"Brothers";src:url("../fonts/BrothersTypeface-Regular.otf") format("opentype");font-display:swap}@font-face{font-family:"Venture";src:url("../fonts/Venture-nRqOR.otf") format("opentype");font-display:swap}@keyframes elkIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@keyframes elkUp{from{transform:translateY(100%)}to{transform:none}}@keyframes elkFade{from{opacity:0}to{opacity:1}}@keyframes elkToast{0%{opacity:0;transform:translateY(-8px)}10%{opacity:1;transform:none}85%{opacity:1}100%{opacity:0}}*{box-sizing:border-box}html,body{background:#1c1f24}body{margin:0}button,input,textarea{font-family:inherit}a{color:#dcc08a}a:hover{color:#f1ece2}input::placeholder,textarea::placeholder{color:#857f76}sc-if,sc-for{display:contents}body{background:#16181c;display:flex;justify-content:center;padding:24px}</style>
</head>
<body>
<div style="position:relative;flex:none;width:390px;height:844px;overflow:hidden;background:linear-gradient(180deg,#25282e 0%,#2b2f36 55%,#282b31 100%);color:#f1ece2;font-family:Basteleur,Georgia,serif;font-size:15px">
<sc-if value="{{ is.exp }}" hint-placeholder-val="{{ false }}">
<div style="position:absolute;inset:0;overflow-y:auto;scrollbar-width:none;padding:58px 0 60px;animation:elkIn .32s ease both">
<div style="display:flex;align-items:center;justify-content:space-between;padding:0 16px">
<button onClick="{{ back }}" style="flex:none;width:44px;height:44px;border-radius:22px;border:1px solid rgba(241,236,226,.16);background:rgba(241,236,226,.04);color:#f1ece2;font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0">←</button>
<span style="font-family:Venture,Georgia,serif;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#86b9ab">An experience</span>
<span style="width:44px"></span>
</div>
<sc-if value="{{ xp.isPreview }}" hint-placeholder-val="{{ false }}"><div style="margin:14px 16px 0;padding:10px 14px;border-radius:14px;border:1px dashed rgba(241,236,226,.3);font-size:12.5px;line-height:1.45;color:#b9b2a5;text-align:center">{{ xp.previewText }}</div></sc-if>
<div style="display:flex;justify-content:center;margin-top:24px">
<div style="position:relative;width:272px;height:272px;border-radius:50%;border:1px solid #86b9ab;outline:1px solid rgba(134,185,171,.25);outline-offset:7px;background:repeating-linear-gradient(135deg,rgba(134,185,171,.1) 0 1px,transparent 1px 11px),radial-gradient(circle at 40% 35%,#4f585e 0%,#2c3036 75%);display:flex;align-items:flex-end;justify-content:center;padding-bottom:42px">
<span style="font-family:ui-monospace,Menlo,monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:rgba(241,236,226,.5)">photo · {{ xp.img }}</span>
<span style="position:absolute;right:-8px;top:14px;width:78px;height:78px;border-radius:50%;background:#86b9ab;color:#1b1e23;display:flex;align-items:center;justify-content:center;text-align:center;font-family:Venture,Georgia,serif;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;line-height:1.35;transform:rotate(12deg);padding:8px">Something strange</span>
</div>
</div>
<h1 style="margin:30px 24px 0;font-family:Brothers,Georgia,serif;font-weight:400;font-size:38px;line-height:1.02;text-align:center;text-wrap:balance">{{ xp.title }}</h1>
<p style="margin:12px 28px 0;font-size:16px;line-height:1.5;color:#e6e0d4;text-align:center;text-wrap:pretty">{{ xp.strange }}</p>
<button onClick="{{ xp.openArtist }}" style="display:flex;align-items:center;gap:12px;width:calc(100% - 32px);margin:22px 16px 0;padding:12px 16px 12px 12px;border-radius:22px;background:#31353c;border:1px solid rgba(241,236,226,.1);color:#f1ece2;text-align:left;cursor:pointer">
<span style="flex:none;width:48px;height:48px;border-radius:24px;border:1px solid #86b9ab;background:#3d424a;display:flex;align-items:center;justify-content:center;font-family:Brothers,Georgia,serif;font-size:21px;color:#86b9ab">{{ xp.initial }}</span>
<span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px"><span style="font-family:Venture,Georgia,serif;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#b9b2a5">Hosted by</span><span style="font-weight:700;font-size:16px">{{ xp.artistName }}</span><span style="font-size:12.5px;color:#b9b2a5">{{ xp.craft }} · {{ xp.area }}</span></span>
<span style="color:#86b9ab;font-size:18px">›</span>
</button>
<div style="display:grid;grid-template-columns:1fr 1fr;margin:16px 16px 0;border:1px solid rgba(134,185,171,.35);border-radius:20px;overflow:hidden">
<sc-for list="{{ xp.facts }}" as="f" hint-placeholder-count="4"><div style="display:flex;flex-direction:column;gap:4px;padding:12px 14px;border-right:{{ f.br }};border-bottom:{{ f.bb }}"><span style="font-family:Venture,Georgia,serif;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#b9b2a5">{{ f.k }}</span><span style="font-weight:700;font-size:14.5px;line-height:1.25">{{ f.v }}</span></div></sc-for>
</div>
<p style="margin:22px 20px 0;font-size:16px;line-height:1.6;color:#e6e0d4;text-wrap:pretty"><span style="float:left;font-family:Basteleur,Georgia,serif;font-weight:700;font-size:60px;line-height:.82;margin:6px 10px 0 0;color:#86b9ab">{{ xp.first }}</span>{{ xp.rest }}</p>
<sc-if value="{{ xp.hasTours }}" hint-placeholder-val="{{ true }}">
<div style="display:flex;align-items:center;gap:10px;margin:28px 20px 12px"><span style="font-family:Venture,Georgia,serif;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#c9a25c">Find it on a tour</span><div style="flex:1;height:1px;background:linear-gradient(90deg,rgba(201,162,92,.6),transparent)"></div></div>
<div style="display:flex;flex-direction:column;gap:8px;padding:0 16px">
<sc-for list="{{ xp.onTours }}" as="t" hint-placeholder-count="1"><button onClick="{{ t.open }}" style="display:flex;gap:12px;align-items:center;width:100%;padding:10px 14px 10px 10px;border-radius:22px;background:#31353c;border:1px solid rgba(201,162,92,.35);color:#f1ece2;text-align:left;cursor:pointer"><span style="flex:none;width:56px;height:70px;border-radius:28px 28px 8px 8px;background:repeating-linear-gradient(135deg,rgba(201,162,92,.1) 0 1px,transparent 1px 8px),linear-gradient(165deg,#474c56,#2e3238)"></span><span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:3px"><span style="font-family:Venture,Georgia,serif;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#dcc08a">{{ t.kicker }}</span><span style="font-weight:700;font-size:15.5px;line-height:1.25">{{ t.title }}</span><span style="font-size:12.5px;color:#b9b2a5">{{ t.sub }}</span></span><span style="color:#c9a25c;font-size:18px">›</span></button></sc-for>
</div>
</sc-if>
<sc-if value="{{ xp.hasDates }}" hint-placeholder-val="{{ true }}">
<div style="display:flex;align-items:center;gap:10px;margin:24px 20px 12px"><span style="font-family:Venture,Georgia,serif;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#c9a25c">Tour dates with {{ xp.artistShort }}</span><div style="flex:1;height:1px;background:linear-gradient(90deg,rgba(201,162,92,.6),transparent)"></div></div>
<div style="display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding:0 16px">
<sc-for list="{{ xp.dates }}" as="n" hint-placeholder-count="2"><button onClick="{{ n.pick }}" style="flex:none;display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:12px 16px;border-radius:18px;border:1px solid rgba(241,236,226,.14);background:#31353c;color:#f1ece2;cursor:pointer;text-align:left"><span style="font-weight:700;font-size:15px">{{ n.day }}</span><span style="font-size:12.5px;color:#b9b2a5">{{ n.time }}</span></button></sc-for>
</div>
</sc-if>
<sc-if value="{{ xp.hasOwn }}" hint-placeholder-val="{{ true }}">
<div style="margin:28px 16px 0;padding:16px;border-radius:22px;border:1px solid rgba(134,185,171,.45);outline:1px solid rgba(134,185,171,.15);outline-offset:4px">
<span style="font-family:Venture,Georgia,serif;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#86b9ab">On its own</span>
<p style="margin:8px 0 0;font-size:14px;line-height:1.5;color:#e6e0d4;text-wrap:pretty">{{ xp.ownText }}</p>
<button onClick="{{ xp.ask }}" style="width:100%;margin-top:14px;height:50px;border-radius:25px;border:1px solid #86b9ab;background:{{ xp.askBg }};color:{{ xp.askFg }};font-size:15px;cursor:pointer">{{ xp.askLabel }}</button>
</div>
</sc-if>
</div>
</sc-if>
</div>
</body>
</html>
