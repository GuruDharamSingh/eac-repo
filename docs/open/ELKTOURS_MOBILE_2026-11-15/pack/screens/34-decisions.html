<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>34-decisions</title>
<!--
Design reference, not production code.
Markup for one screen, cut from "Elkdonis App.dc.html" lines 492-522. All sizes, colours and radii are in the inline styles.
{{ name }}  a value filled in at runtime (see renderVals() in Elkdonis App.dc.html for what it holds)
<sc-if>     shows its children when the value is true
<sc-for>    repeats its children once per item in the list
Described in screens-board.md. For the live, working version open "Elkdonis Experiences.dc.html".
-->
<style>@font-face{font-family:"Basteleur";src:url("../fonts/Basteleur-Moonlight.woff2") format("woff2");font-weight:400;font-display:swap}@font-face{font-family:"Basteleur";src:url("../fonts/Basteleur-Bold.woff2") format("woff2");font-weight:700;font-display:swap}@font-face{font-family:"Brothers";src:url("../fonts/BrothersTypeface-Regular.otf") format("opentype");font-display:swap}@font-face{font-family:"Venture";src:url("../fonts/Venture-nRqOR.otf") format("opentype");font-display:swap}@keyframes elkIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@keyframes elkUp{from{transform:translateY(100%)}to{transform:none}}@keyframes elkFade{from{opacity:0}to{opacity:1}}@keyframes elkToast{0%{opacity:0;transform:translateY(-8px)}10%{opacity:1;transform:none}85%{opacity:1}100%{opacity:0}}*{box-sizing:border-box}html,body{background:#1c1f24}body{margin:0}button,input,textarea{font-family:inherit}a{color:#dcc08a}a:hover{color:#f1ece2}input::placeholder,textarea::placeholder{color:#857f76}sc-if,sc-for{display:contents}body{background:#16181c;display:flex;justify-content:center;padding:24px}</style>
</head>
<body>
<div style="position:relative;flex:none;width:390px;height:844px;overflow:hidden;background:linear-gradient(180deg,#25282e 0%,#2b2f36 55%,#282b31 100%);color:#f1ece2;font-family:Basteleur,Georgia,serif;font-size:15px">
<sc-if value="{{ is.decisions }}" hint-placeholder-val="{{ false }}">
<div style="position:absolute;inset:0;overflow-y:auto;scrollbar-width:none;padding:60px 0 130px;animation:elkIn .32s ease both">
<div style="display:flex;align-items:center;gap:14px;padding:0 16px 16px"><button onClick="{{ back }}" style="flex:none;width:44px;height:44px;border-radius:22px;border:1px solid rgba(241,236,226,.16);background:rgba(241,236,226,.04);color:#f1ece2;font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0">←</button></div>
<div style="display:flex;flex-direction:column;gap:6px;padding:0 18px"><span style="font-family:Venture,Georgia,serif;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:#c9a25c">{{ viewer.name }}</span><h1 style="margin:0;font-family:Brothers,Georgia,serif;font-weight:400;font-size:40px;line-height:1">Decisions</h1></div>
<p style="margin:10px 18px 0;font-size:14px;line-height:1.5;color:#b9b2a5;text-wrap:pretty">{{ decisions.intro }}</p>
<sc-if value="{{ decisions.hasBelow }}" hint-placeholder-val="{{ true }}">
<div style="display:flex;align-items:center;gap:10px;margin:22px 20px 10px"><span style="font-family:Venture,Georgia,serif;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#e8805c">Below minimum at cutoff</span><div style="flex:1;height:1px;background:rgba(232,128,92,.35)"></div></div>
<div style="display:flex;flex-direction:column;gap:8px;padding:0 16px">
<sc-for list="{{ decisions.below }}" as="d" hint-placeholder-count="1">
<button onClick="{{ d.open }}" style="display:flex;flex-direction:column;gap:11px;width:100%;text-align:left;padding:14px 16px;border-radius:20px;background:#31353c;border:1px solid rgba(232,128,92,.5);color:#f1ece2;cursor:pointer">
<div style="display:flex;align-items:flex-start;gap:12px;width:100%"><div style="display:flex;flex-direction:column;min-width:84px"><span style="font-family:Venture,Georgia,serif;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#b9b2a5">{{ d.day }}</span><span style="font-family:Basteleur,Georgia,serif;font-weight:700;font-size:19px;line-height:1.15">{{ d.time }}</span></div><div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:4px"><span style="font-size:15.5px;line-height:1.25">{{ d.title }}</span><span style="font-size:12.5px;color:{{ d.statusColor }}">{{ d.status }}</span></div></div>
<div style="display:flex;align-items:center;gap:12px;width:100%"><div style="position:relative;flex:1;height:6px;border-radius:3px;background:rgba(241,236,226,.1)"><div style="position:absolute;left:0;top:0;bottom:0;border-radius:3px;width:{{ d.fillPct }};background:{{ d.fillColor }}"></div><div style="position:absolute;top:-4px;bottom:-4px;width:2px;margin-left:-1px;left:{{ d.minPct }};background:#f1ece2;border-radius:1px"></div></div><span style="font-family:Venture,Georgia,serif;font-size:12px;letter-spacing:.08em;color:#b9b2a5;min-width:38px;text-align:right">{{ d.seats }}</span></div>
</button>
</sc-for>
</div>
</sc-if>
<sc-if value="{{ decisions.hasWaits }}" hint-placeholder-val="{{ true }}">
<div style="display:flex;align-items:center;gap:10px;margin:24px 20px 10px"><span style="font-family:Venture,Georgia,serif;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#c9a25c">Waitlists</span><div style="flex:1;height:1px;background:rgba(201,162,92,.35)"></div></div>
<div style="display:flex;flex-direction:column;gap:8px;padding:0 16px">
<sc-for list="{{ decisions.waits }}" as="d" hint-placeholder-count="1">
<button onClick="{{ d.open }}" style="display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 16px;border-radius:20px;background:#31353c;border:1px solid rgba(241,236,226,.09);color:#f1ece2;cursor:pointer">
<div style="display:flex;flex-direction:column;min-width:84px"><span style="font-family:Venture,Georgia,serif;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#b9b2a5">{{ d.day }}</span><span style="font-family:Basteleur,Georgia,serif;font-weight:700;font-size:19px;line-height:1.15">{{ d.time }}</span></div>
<div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:4px"><span style="font-size:15px;line-height:1.25">{{ d.title }}</span><span style="font-size:12.5px;color:#dcc08a">{{ d.extra }} · {{ d.seats }} booked</span></div>
<span style="color:#c9a25c;font-size:18px">›</span>
</button>
</sc-for>
</div>
</sc-if>
<sc-if value="{{ decisions.none }}" hint-placeholder-val="{{ false }}"><p style="margin:28px 20px;color:#b9b2a5;font-size:14px">Nothing waiting on you.</p></sc-if>
</div>
</sc-if>
</div>
</body>
</html>
