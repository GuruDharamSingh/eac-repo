<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>10-local-artists</title>
<!--
Design reference, not production code.
Markup for one screen, cut from "Elkdonis App.dc.html" lines 1188-1198. All sizes, colours and radii are in the inline styles.
{{ name }}  a value filled in at runtime (see renderVals() in Elkdonis App.dc.html for what it holds)
<sc-if>     shows its children when the value is true
<sc-for>    repeats its children once per item in the list
Described in screens-guest.md. For the live, working version open "Elkdonis Experiences.dc.html".
-->
<style>@font-face{font-family:"Basteleur";src:url("../fonts/Basteleur-Moonlight.woff2") format("woff2");font-weight:400;font-display:swap}@font-face{font-family:"Basteleur";src:url("../fonts/Basteleur-Bold.woff2") format("woff2");font-weight:700;font-display:swap}@font-face{font-family:"Brothers";src:url("../fonts/BrothersTypeface-Regular.otf") format("opentype");font-display:swap}@font-face{font-family:"Venture";src:url("../fonts/Venture-nRqOR.otf") format("opentype");font-display:swap}@keyframes elkIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@keyframes elkUp{from{transform:translateY(100%)}to{transform:none}}@keyframes elkFade{from{opacity:0}to{opacity:1}}@keyframes elkToast{0%{opacity:0;transform:translateY(-8px)}10%{opacity:1;transform:none}85%{opacity:1}100%{opacity:0}}*{box-sizing:border-box}html,body{background:#1c1f24}body{margin:0}button,input,textarea{font-family:inherit}a{color:#dcc08a}a:hover{color:#f1ece2}input::placeholder,textarea::placeholder{color:#857f76}sc-if,sc-for{display:contents}body{background:#16181c;display:flex;justify-content:center;padding:24px}</style>
</head>
<body>
<div style="position:relative;flex:none;width:390px;height:844px;overflow:hidden;background:linear-gradient(180deg,#25282e 0%,#2b2f36 55%,#282b31 100%);color:#f1ece2;font-family:Basteleur,Georgia,serif;font-size:15px">
<sc-if value="{{ is.locals }}" hint-placeholder-val="{{ false }}">
<div style="position:absolute;inset:0;overflow-y:auto;scrollbar-width:none;padding:58px 0 60px;animation:elkIn .32s ease both">
<div style="display:flex;align-items:center;gap:14px;padding:0 16px"><button onClick="{{ back }}" style="flex:none;width:44px;height:44px;border-radius:22px;border:1px solid rgba(241,236,226,.16);background:rgba(241,236,226,.04);color:#f1ece2;font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0">←</button><span style="font-family:Venture,Georgia,serif;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:#b9b2a5">Paris · {{ lc.count }}</span></div>
<h1 style="margin:18px 20px 0;font-family:Brothers,Georgia,serif;font-weight:400;font-size:42px;line-height:1">Local Artists</h1>
<p style="margin:10px 20px 0;font-size:14.5px;line-height:1.5;color:#b9b2a5;text-wrap:pretty">The guides who lead the tours and the artists who host experiences along them.</p>
<div style="display:flex;gap:8px;padding:16px 20px 4px"><sc-for list="{{ lc.filters }}" as="c" hint-placeholder-count="3"><button onClick="{{ c.pick }}" style="flex:none;height:36px;padding:0 14px;border-radius:18px;border:1px solid {{ c.border }};background:{{ c.bg }};color:{{ c.fg }};font-family:Basteleur,Georgia,serif;font-size:13.5px;cursor:pointer">{{ c.label }}</button></sc-for></div>
<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:14px 16px 0">
<sc-for list="{{ lc.items }}" as="p" hint-placeholder-count="4"><div onClick="{{ p.open }}" style="display:flex;flex-direction:column;align-items:center;gap:5px;padding:16px 10px 14px;border-radius:22px;background:#31353c;border:1px solid rgba(241,236,226,.08);text-align:center;cursor:pointer"><span style="width:96px;height:110px;border-radius:{{ p.shape }};border:1px solid {{ p.ring }};background:repeating-linear-gradient(135deg,rgba(241,236,226,.06) 0 1px,transparent 1px 8px),linear-gradient(165deg,#4a4f59,#2e3238);display:flex;align-items:center;justify-content:center;font-family:Brothers,Georgia,serif;font-size:30px;color:#e6e0d4">{{ p.initial }}</span><span style="margin-top:6px;font-family:Basteleur,Georgia,serif;font-weight:700;font-size:15px;line-height:1.2">{{ p.name }}</span><span style="font-size:12px;line-height:1.35;color:#b9b2a5">{{ p.line }}</span><span style="font-size:11.5px;color:{{ p.ring }}">{{ p.status }}</span></div></sc-for>
</div>
</div>
</sc-if>
</div>
</body>
</html>
