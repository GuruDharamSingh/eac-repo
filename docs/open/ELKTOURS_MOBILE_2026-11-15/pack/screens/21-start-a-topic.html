<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>21-start-a-topic</title>
<!--
Design reference, not production code.
Markup for one screen, cut from "Elkdonis App.dc.html" lines 1258-1274. All sizes, colours and radii are in the inline styles.
{{ name }}  a value filled in at runtime (see renderVals() in Elkdonis App.dc.html for what it holds)
<sc-if>     shows its children when the value is true
<sc-for>    repeats its children once per item in the list
Described in screens-guest.md. For the live, working version open "Elkdonis Experiences.dc.html".
-->
<style>@font-face{font-family:"Basteleur";src:url("../fonts/Basteleur-Moonlight.woff2") format("woff2");font-weight:400;font-display:swap}@font-face{font-family:"Basteleur";src:url("../fonts/Basteleur-Bold.woff2") format("woff2");font-weight:700;font-display:swap}@font-face{font-family:"Brothers";src:url("../fonts/BrothersTypeface-Regular.otf") format("opentype");font-display:swap}@font-face{font-family:"Venture";src:url("../fonts/Venture-nRqOR.otf") format("opentype");font-display:swap}@keyframes elkIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@keyframes elkUp{from{transform:translateY(100%)}to{transform:none}}@keyframes elkFade{from{opacity:0}to{opacity:1}}@keyframes elkToast{0%{opacity:0;transform:translateY(-8px)}10%{opacity:1;transform:none}85%{opacity:1}100%{opacity:0}}*{box-sizing:border-box}html,body{background:#1c1f24}body{margin:0}button,input,textarea{font-family:inherit}a{color:#dcc08a}a:hover{color:#f1ece2}input::placeholder,textarea::placeholder{color:#857f76}sc-if,sc-for{display:contents}body{background:#16181c;display:flex;justify-content:center;padding:24px}</style>
</head>
<body>
<div style="position:relative;flex:none;width:390px;height:844px;overflow:hidden;background:linear-gradient(180deg,#25282e 0%,#2b2f36 55%,#282b31 100%);color:#f1ece2;font-family:Basteleur,Georgia,serif;font-size:15px">
<sc-if value="{{ is.compose }}" hint-placeholder-val="{{ false }}">
<div style="position:absolute;inset:0;overflow-y:auto;scrollbar-width:none;padding:58px 0 60px;animation:elkIn .32s ease both">
<div style="display:flex;align-items:center;gap:14px;padding:0 16px"><button onClick="{{ back }}" style="flex:none;width:44px;height:44px;border-radius:22px;border:1px solid rgba(241,236,226,.16);background:rgba(241,236,226,.04);color:#f1ece2;font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0">←</button><span style="font-family:Venture,Georgia,serif;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:#b9b2a5">Elkdonis Forum</span></div>
<h1 style="margin:18px 20px 0;font-family:Brothers,Georgia,serif;font-weight:400;font-size:38px;line-height:1">Start a topic</h1>
<div style="display:flex;flex-direction:column;gap:18px;padding:20px 20px 0">
<div style="display:flex;flex-direction:column;gap:8px"><span style="font-family:Venture,Georgia,serif;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#b9b2a5">Section</span><div style="display:flex;flex-wrap:wrap;gap:6px"><sc-for list="{{ fcv.secs }}" as="c" hint-placeholder-count="6"><button onClick="{{ c.pick }}" style="height:34px;padding:0 12px;border-radius:17px;border:1px solid {{ c.border }};background:{{ c.bg }};color:{{ c.fg }};font-family:Basteleur,Georgia,serif;font-size:13px;cursor:pointer">{{ c.label }}</button></sc-for></div></div>
<div style="display:flex;flex-direction:column;gap:8px"><span style="font-family:Venture,Georgia,serif;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#b9b2a5">Kind</span><div style="display:flex;gap:6px"><sc-for list="{{ fcv.kinds }}" as="c" hint-placeholder-count="3"><button onClick="{{ c.pick }}" style="flex:1;height:38px;border-radius:19px;border:1px solid {{ c.border }};background:{{ c.bg }};color:{{ c.fg }};font-family:Basteleur,Georgia,serif;font-size:13.5px;cursor:pointer">{{ c.label }}</button></sc-for></div></div>
<label style="display:flex;flex-direction:column;gap:7px"><span style="font-family:Venture,Georgia,serif;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#b9b2a5">Title</span><input value="{{ fcv.title }}" onChange="{{ fcv.setTitle }}" placeholder="A question, an idea, a plan" style="height:50px;padding:0 16px;border-radius:16px;border:1px solid rgba(241,236,226,.14);background:#31353c;color:#f1ece2;font-size:15px;outline:0"></input></label>
<label style="display:flex;flex-direction:column;gap:7px"><span style="font-family:Venture,Georgia,serif;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#b9b2a5">What you want to say</span><textarea value="{{ fcv.body }}" onChange="{{ fcv.setBody }}" rows="5" style="padding:14px 16px;border-radius:16px;border:1px solid rgba(241,236,226,.14);background:#31353c;color:#f1ece2;font-size:15px;line-height:1.45;outline:0;resize:none"></textarea></label>
<label style="display:flex;flex-direction:column;gap:7px"><span style="font-family:Venture,Georgia,serif;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#b9b2a5">Link · optional</span><input type="url" value="{{ fcv.link }}" onChange="{{ fcv.setLink }}" placeholder="https://" style="height:50px;padding:0 16px;border-radius:16px;border:1px solid rgba(241,236,226,.14);background:#31353c;color:#f1ece2;font-size:15px;outline:0"></input></label>
<div style="display:flex;flex-direction:column;gap:8px"><span style="font-family:Venture,Georgia,serif;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#b9b2a5">Photos &amp; video · optional</span><sc-if value="{{ fcv.hasMedia }}" hint-placeholder-val="{{ false }}"><div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px"><sc-for list="{{ fcv.media }}" as="m" hint-placeholder-count="1"><div style="position:relative;height:130px;border-radius:12px;overflow:hidden;border:1px solid rgba(241,236,226,.1);background:repeating-linear-gradient(135deg,rgba(201,162,92,.1) 0 1px,transparent 1px 8px),linear-gradient(165deg,#474c56,#2e3238)"><sc-if value="{{ m.hasImg }}" hint-placeholder-val="{{ false }}"><img src="{{ m.url }}" alt="" style="width:100%;height:100%;object-fit:cover;display:block"></sc-if><sc-if value="{{ m.hasVid }}" hint-placeholder-val="{{ false }}"><video src="{{ m.url }}" muted controls style="width:100%;height:100%;object-fit:cover;display:block;background:#000"></video></sc-if><sc-if value="{{ m.noUrl }}" hint-placeholder-val="{{ true }}"><span style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:22px;color:rgba(241,236,226,.8)">{{ m.play }}</span><span style="position:absolute;left:8px;right:8px;bottom:7px;font-family:ui-monospace,Menlo,monospace;font-size:8.5px;letter-spacing:.04em;text-transform:uppercase;line-height:1.3;color:rgba(241,236,226,.6)">{{ m.cap }}</span></sc-if><sc-if value="{{ m.canRemove }}" hint-placeholder-val="{{ false }}"><button onClick="{{ m.remove }}" style="position:absolute;top:5px;right:5px;width:26px;height:26px;border-radius:13px;border:0;background:rgba(22,24,28,.8);color:#f1ece2;font-size:14px;cursor:pointer;padding:0">×</button></sc-if></div></sc-for></div></sc-if><label style="display:flex;align-items:center;justify-content:center;gap:8px;height:50px;border-radius:16px;border:1px dashed rgba(201,162,92,.7);color:#dcc08a;font-family:Basteleur,Georgia,serif;font-size:14.5px;cursor:pointer"><input type="file" accept="image/*,video/*" multiple onChange="{{ fcv.onFiles }}" style="display:none"></input>+ Add photos or video</label></div>
<div style="display:flex;flex-direction:column;gap:8px"><span style="font-family:Venture,Georgia,serif;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#b9b2a5">Who can read it</span><div style="display:flex;gap:6px"><sc-for list="{{ fcv.vis }}" as="c" hint-placeholder-count="3"><button onClick="{{ c.pick }}" style="flex:1;height:38px;border-radius:19px;border:1px solid {{ c.border }};background:{{ c.bg }};color:{{ c.fg }};font-family:Basteleur,Georgia,serif;font-size:13.5px;cursor:pointer">{{ c.label }}</button></sc-for></div><p style="margin:0;font-size:12.5px;line-height:1.45;color:#b9b2a5">{{ fcv.visHelp }}</p></div>
<sc-if value="{{ fcv.isPrivate }}" hint-placeholder-val="{{ false }}"><div style="display:flex;flex-direction:column;gap:8px"><span style="font-family:Venture,Georgia,serif;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#b9b2a5">Add people</span><div style="display:flex;flex-wrap:wrap;gap:6px"><sc-for list="{{ fcv.people }}" as="c" hint-placeholder-count="4"><button onClick="{{ c.pick }}" style="height:34px;padding:0 12px;border-radius:17px;border:1px solid {{ c.border }};background:{{ c.bg }};color:{{ c.fg }};font-family:Basteleur,Georgia,serif;font-size:13px;cursor:pointer">{{ c.label }}</button></sc-for></div></div></sc-if>
</div>
<button onClick="{{ fcv.post }}" style="display:block;width:calc(100% - 32px);height:56px;margin:24px 16px 0;border:0;background:{{ fcv.bg }};color:{{ fcv.fg }};font-family:Basteleur,Georgia,serif;font-weight:700;font-size:16px;cursor:pointer;clip-path:polygon(12px 0,calc(100% - 12px) 0,100% 12px,100% calc(100% - 12px),calc(100% - 12px) 100%,12px 100%,0 calc(100% - 12px),0 12px)">Post topic</button>
</div>
</sc-if>
</div>
</body>
</html>
