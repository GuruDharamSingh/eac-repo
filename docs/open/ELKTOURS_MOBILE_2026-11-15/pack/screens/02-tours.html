<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>02-tours</title>
<!--
Design reference, not production code.
Markup for one screen, cut from "Elkdonis App.dc.html" lines 143-179. All sizes, colours and radii are in the inline styles.
{{ name }}  a value filled in at runtime (see renderVals() in Elkdonis App.dc.html for what it holds)
<sc-if>     shows its children when the value is true
<sc-for>    repeats its children once per item in the list
Described in screens-guest.md. For the live, working version open "Elkdonis Experiences.dc.html".
-->
<style>@font-face{font-family:"Basteleur";src:url("../fonts/Basteleur-Moonlight.woff2") format("woff2");font-weight:400;font-display:swap}@font-face{font-family:"Basteleur";src:url("../fonts/Basteleur-Bold.woff2") format("woff2");font-weight:700;font-display:swap}@font-face{font-family:"Brothers";src:url("../fonts/BrothersTypeface-Regular.otf") format("opentype");font-display:swap}@font-face{font-family:"Venture";src:url("../fonts/Venture-nRqOR.otf") format("opentype");font-display:swap}@keyframes elkIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@keyframes elkUp{from{transform:translateY(100%)}to{transform:none}}@keyframes elkFade{from{opacity:0}to{opacity:1}}@keyframes elkToast{0%{opacity:0;transform:translateY(-8px)}10%{opacity:1;transform:none}85%{opacity:1}100%{opacity:0}}*{box-sizing:border-box}html,body{background:#1c1f24}body{margin:0}button,input,textarea{font-family:inherit}a{color:#dcc08a}a:hover{color:#f1ece2}input::placeholder,textarea::placeholder{color:#857f76}sc-if,sc-for{display:contents}body{background:#16181c;display:flex;justify-content:center;padding:24px}</style>
</head>
<body>
<div style="position:relative;flex:none;width:390px;height:844px;overflow:hidden;background:linear-gradient(180deg,#25282e 0%,#2b2f36 55%,#282b31 100%);color:#f1ece2;font-family:Basteleur,Georgia,serif;font-size:15px">
<sc-if value="{{ is.list }}" hint-placeholder-val="{{ false }}">
<div style="position:absolute;inset:0;overflow-y:auto;scrollbar-width:none;padding:62px 0 124px;animation:elkIn .32s ease both">
<div style="display:flex;align-items:flex-end;justify-content:space-between;padding:0 20px">
<div style="display:flex;flex-direction:column;gap:6px">
<span style="font-family:Venture,Georgia,serif;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:#c9a25c">Paris · {{ listCount }}</span>
<h1 style="margin:0;font-family:Brothers,Georgia,serif;font-weight:400;font-size:40px;line-height:1">Tours</h1>
</div>
</div>
<p style="margin:12px 20px 0;font-size:15px;line-height:1.5;color:#b9b2a5;text-wrap:pretty">Walks, studios and tables, each led by a guide on set dates. <button onClick="{{ toAbout }}" style="padding:0;border:0;background:transparent;color:#dcc08a;font-family:inherit;font-size:inherit;cursor:pointer;text-decoration:underline;text-underline-offset:3px">Read more</button></p>
<div style="margin:18px 20px 0;height:50px;border-radius:25px;background:#31353c;border:1px solid rgba(241,236,226,.12);display:flex;align-items:center;gap:11px;padding:0 18px">
<span style="flex:none;width:14px;height:14px;border:1.5px solid #b9b2a5;border-radius:50%"></span>
<input value="{{ q }}" onChange="{{ setQ }}" placeholder="Search walks, ateliers, museums" style="flex:1;min-width:0;height:100%;border:0;outline:0;background:transparent;color:#f1ece2;font-family:Basteleur,Georgia,serif;font-size:14.5px"></input>
</div>
<div style="display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:16px 20px 4px">
<sc-for list="{{ types }}" as="c" hint-placeholder-count="5">
<button onClick="{{ c.pick }}" style="flex:none;height:38px;padding:0 16px;border-radius:19px;border:1px solid {{ c.border }};background:{{ c.bg }};color:{{ c.fg }};font-family:Basteleur,Georgia,serif;font-size:14px;cursor:pointer">{{ c.label }}</button>
</sc-for>
</div>
<div style="display:flex;flex-direction:column;gap:12px;padding:14px 20px 0">
<sc-for list="{{ listTours }}" as="t" hint-placeholder-count="4">
<div onClick="{{ t.open }}" style="display:flex;gap:14px;padding:10px;border-radius:24px;background:#31353c;border:1px solid rgba(241,236,226,.08);cursor:pointer">
<div style="flex:none;width:112px;height:144px;border-radius:56px 56px 14px 14px;background:repeating-linear-gradient(135deg,rgba(201,162,92,.08) 0 1px,transparent 1px 10px),linear-gradient(165deg,#474c56 0%,#2e3238 100%);display:flex;align-items:flex-end;padding:9px"><span style="font-family:ui-monospace,Menlo,monospace;font-size:8.5px;letter-spacing:.04em;text-transform:uppercase;color:rgba(241,236,226,.45);line-height:1.35">{{ t.img }}</span></div>
<div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:5px;padding:6px 6px 4px 0">
<span style="font-family:Venture,Georgia,serif;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#b9b2a5">{{ t.typeLabel }} · {{ t.duration }}</span>
<span style="font-family:Basteleur,Georgia,serif;font-weight:700;font-size:17px;line-height:1.2">{{ t.title }}</span>
<span style="font-size:13px;color:#b9b2a5">with {{ t.guideName }}</span>
<div style="margin-top:auto;display:flex;align-items:flex-end;justify-content:space-between;gap:8px">
<span style="font-size:12.5px;line-height:1.3;color:#8f8a82">{{ t.nextLabel }}</span>
<span style="flex:none;font-family:Basteleur,Georgia,serif;font-weight:700;font-size:17px;color:#dcc08a">{{ t.priceLabel }}</span>
</div>
</div>
</div>
</sc-for>
<sc-if value="{{ listEmpty }}" hint-placeholder-val="{{ false }}"><p style="margin:20px 4px;color:#b9b2a5;font-size:14px">Nothing matches that yet.</p></sc-if>
</div>
</div>
</sc-if>
</div>
</body>
</html>
