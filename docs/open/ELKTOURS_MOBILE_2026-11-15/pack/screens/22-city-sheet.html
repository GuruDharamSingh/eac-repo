<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>22-city-sheet</title>
<!--
Design reference, not production code.
Markup for one screen, cut from "Elkdonis App.dc.html" lines 1333-1352. All sizes, colours and radii are in the inline styles.
{{ name }}  a value filled in at runtime (see renderVals() in Elkdonis App.dc.html for what it holds)
<sc-if>     shows its children when the value is true
<sc-for>    repeats its children once per item in the list
Described in screens-guest.md. For the live, working version open "Elkdonis Experiences.dc.html".
-->
<style>@font-face{font-family:"Basteleur";src:url("../fonts/Basteleur-Moonlight.woff2") format("woff2");font-weight:400;font-display:swap}@font-face{font-family:"Basteleur";src:url("../fonts/Basteleur-Bold.woff2") format("woff2");font-weight:700;font-display:swap}@font-face{font-family:"Brothers";src:url("../fonts/BrothersTypeface-Regular.otf") format("opentype");font-display:swap}@font-face{font-family:"Venture";src:url("../fonts/Venture-nRqOR.otf") format("opentype");font-display:swap}@keyframes elkIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@keyframes elkUp{from{transform:translateY(100%)}to{transform:none}}@keyframes elkFade{from{opacity:0}to{opacity:1}}@keyframes elkToast{0%{opacity:0;transform:translateY(-8px)}10%{opacity:1;transform:none}85%{opacity:1}100%{opacity:0}}*{box-sizing:border-box}html,body{background:#1c1f24}body{margin:0}button,input,textarea{font-family:inherit}a{color:#dcc08a}a:hover{color:#f1ece2}input::placeholder,textarea::placeholder{color:#857f76}sc-if,sc-for{display:contents}body{background:#16181c;display:flex;justify-content:center;padding:24px}</style>
</head>
<body>
<div style="position:relative;flex:none;width:390px;height:844px;overflow:hidden;background:linear-gradient(180deg,#25282e 0%,#2b2f36 55%,#282b31 100%);color:#f1ece2;font-family:Basteleur,Georgia,serif;font-size:15px">
<sc-if value="{{ sheet }}" hint-placeholder-val="{{ false }}">
<div onClick="{{ closeSheet }}" style="position:absolute;inset:0;z-index:50;background:rgba(10,11,13,.55);animation:elkFade .2s ease both"></div>
<div style="position:absolute;left:0;right:0;bottom:0;z-index:51;padding:12px 18px 34px;border-radius:30px 30px 0 0;background:#2f3339;border-top:1px solid rgba(201,162,92,.5);animation:elkUp .28s cubic-bezier(.2,.8,.2,1) both">
<div style="width:40px;height:4px;border-radius:2px;background:rgba(241,236,226,.25);margin:0 auto 16px"></div>
<span style="font-family:Venture,Georgia,serif;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:#c9a25c">The guide</span>
<h2 style="margin:6px 0 14px;font-family:Brothers,Georgia,serif;font-weight:400;font-size:32px;line-height:1">Choose a city</h2>
<div style="display:flex;flex-direction:column;gap:8px">
<sc-for list="{{ cities }}" as="c" hint-placeholder-count="5">
<button onClick="{{ c.pick }}" style="display:flex;align-items:center;gap:14px;padding:10px 14px 10px 10px;border-radius:22px;border:1px solid {{ c.border }};background:transparent;color:{{ c.fg }};text-align:left;cursor:{{ c.cursor }}">
<span style="flex:none;width:44px;height:44px;border-radius:22px 22px 8px 8px;background:repeating-linear-gradient(135deg,rgba(201,162,92,.12) 0 1px,transparent 1px 7px),#3d424a;opacity:{{ c.thumb }}"></span>
<div style="flex:1;display:flex;flex-direction:column;gap:2px"><span style="font-family:Basteleur,Georgia,serif;font-weight:700;font-size:16px">{{ c.name }}</span><span style="font-size:12.5px;color:#8f8a82">{{ c.status }}</span></div>
<span style="color:#c9a25c;font-size:16px">{{ c.mark }}</span>
</button>
</sc-for>
</div>
<div style="display:flex;align-items:center;gap:10px;margin:22px 0 8px"><span style="font-family:Venture,Georgia,serif;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:#c9a25c">More cities coming</span><div style="flex:1;height:1px;background:linear-gradient(90deg,rgba(201,162,92,.6),transparent)"></div></div>
<p style="margin:0;font-size:14px;line-height:1.5;color:#b9b2a5">{{ cityMore }}</p>
<button onClick="{{ suggestGo }}" style="display:flex;align-items:center;justify-content:center;width:100%;height:52px;margin-top:18px;border-radius:26px;border:1px solid #c9a25c;background:transparent;color:#dcc08a;font-family:Basteleur,Georgia,serif;font-size:15px;cursor:pointer">Suggest an artist or place</button>
</div>
</sc-if>
</div>
</body>
</html>
