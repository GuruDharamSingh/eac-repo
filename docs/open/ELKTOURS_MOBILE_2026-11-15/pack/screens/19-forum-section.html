<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>19-forum-section</title>
<!--
Design reference, not production code.
Markup for one screen, cut from "Elkdonis App.dc.html" lines 1224-1236. All sizes, colours and radii are in the inline styles.
{{ name }}  a value filled in at runtime (see renderVals() in Elkdonis App.dc.html for what it holds)
<sc-if>     shows its children when the value is true
<sc-for>    repeats its children once per item in the list
Described in screens-guest.md. For the live, working version open "Elkdonis Experiences.dc.html".
-->
<style>@font-face{font-family:"Basteleur";src:url("../fonts/Basteleur-Moonlight.woff2") format("woff2");font-weight:400;font-display:swap}@font-face{font-family:"Basteleur";src:url("../fonts/Basteleur-Bold.woff2") format("woff2");font-weight:700;font-display:swap}@font-face{font-family:"Brothers";src:url("../fonts/BrothersTypeface-Regular.otf") format("opentype");font-display:swap}@font-face{font-family:"Venture";src:url("../fonts/Venture-nRqOR.otf") format("opentype");font-display:swap}@keyframes elkIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@keyframes elkUp{from{transform:translateY(100%)}to{transform:none}}@keyframes elkFade{from{opacity:0}to{opacity:1}}@keyframes elkToast{0%{opacity:0;transform:translateY(-8px)}10%{opacity:1;transform:none}85%{opacity:1}100%{opacity:0}}*{box-sizing:border-box}html,body{background:#1c1f24}body{margin:0}button,input,textarea{font-family:inherit}a{color:#dcc08a}a:hover{color:#f1ece2}input::placeholder,textarea::placeholder{color:#857f76}sc-if,sc-for{display:contents}body{background:#16181c;display:flex;justify-content:center;padding:24px}</style>
</head>
<body>
<div style="position:relative;flex:none;width:390px;height:844px;overflow:hidden;background:linear-gradient(180deg,#25282e 0%,#2b2f36 55%,#282b31 100%);color:#f1ece2;font-family:Basteleur,Georgia,serif;font-size:15px">
<sc-if value="{{ is.forumSec }}" hint-placeholder-val="{{ false }}">
<div style="position:absolute;inset:0;overflow-y:auto;scrollbar-width:none;padding:58px 0 120px;animation:elkIn .32s ease both">
<div style="display:flex;align-items:center;gap:14px;padding:0 16px"><button onClick="{{ back }}" style="flex:none;width:44px;height:44px;border-radius:22px;border:1px solid rgba(241,236,226,.16);background:rgba(241,236,226,.04);color:#f1ece2;font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0">←</button><span style="font-family:Venture,Georgia,serif;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:#b9b2a5">{{ fs.path }}</span></div>
<div style="margin:18px 20px 0;padding-left:14px;border-left:3px solid {{ fs.accent }}"><h1 style="margin:0;font-family:Brothers,Georgia,serif;font-weight:400;font-size:38px;line-height:1">{{ fs.name }}</h1><p style="margin:8px 0 0;font-family:ui-monospace,Menlo,monospace;font-size:11.5px;color:#8f8a82">{{ fs.count }}</p></div>
<sc-if value="{{ fs.hasDesc }}" hint-placeholder-val="{{ true }}"><p style="margin:12px 20px 0;font-size:14.5px;line-height:1.5;color:#b9b2a5">{{ fs.desc }}</p></sc-if>
<sc-if value="{{ fs.hasSubs }}" hint-placeholder-val="{{ false }}"><div style="display:flex;flex-wrap:wrap;gap:8px;padding:16px 20px 0"><sc-for list="{{ fs.subs }}" as="y" hint-placeholder-count="2"><button onClick="{{ y.open }}" style="display:flex;align-items:center;gap:8px;height:38px;padding:0 14px;border-radius:19px;border:1px solid rgba(241,236,226,.2);background:transparent;color:#f1ece2;font-family:Basteleur,Georgia,serif;font-size:14px;cursor:pointer">↳ {{ y.name }}<span style="font-family:ui-monospace,Menlo,monospace;font-size:11px;color:#8f8a82">{{ y.count }}</span></button></sc-for></div></sc-if>
<div style="display:flex;flex-direction:column;padding:12px 16px 0">
<sc-for list="{{ fs.rows }}" as="r" hint-placeholder-count="4"><button onClick="{{ r.open }}" style="display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:10px;align-items:start;padding:12px 4px;border:0;border-bottom:1px solid rgba(241,236,226,.07);background:transparent;color:#f1ece2;text-align:left;cursor:pointer"><span style="color:{{ r.accent }};font-size:13px;text-align:center;padding-top:2px">{{ r.glyph }}</span><span style="display:flex;flex-direction:column;gap:3px;min-width:0"><span style="display:flex;align-items:center;gap:7px"><span style="flex:none;width:6px;height:6px;border-radius:3px;background:{{ r.dot }}"></span><span style="font-size:15px;line-height:1.3;font-weight:{{ r.weight }}">{{ r.title }}</span></span><span style="font-family:ui-monospace,Menlo,monospace;font-size:11px;color:#8f8a82">{{ r.meta }}</span><sc-if value="{{ r.hasLock }}" hint-placeholder-val="{{ false }}"><span style="align-self:flex-start;padding:1px 7px;border-radius:8px;border:1px solid rgba(241,236,226,.2);font-size:10.5px;color:#b9b2a5">{{ r.lock }}</span></sc-if></span><span style="font-family:ui-monospace,Menlo,monospace;font-size:11px;color:#8f8a82;padding-top:3px">{{ r.when }}</span></button></sc-for>
<sc-if value="{{ fs.empty }}" hint-placeholder-val="{{ false }}"><p style="margin:12px 4px;font-size:14px;color:#b9b2a5">Nothing in this section yet.</p></sc-if>
</div>
</div>
<button onClick="{{ fs.compose }}" style="position:absolute;left:20px;right:20px;bottom:30px;height:56px;border:0;background:#c9a25c;color:#1b1e23;font-family:Basteleur,Georgia,serif;font-weight:700;font-size:16px;cursor:pointer;z-index:5;clip-path:polygon(12px 0,calc(100% - 12px) 0,100% 12px,100% calc(100% - 12px),calc(100% - 12px) 100%,12px 100%,0 calc(100% - 12px),0 12px)">✎ Start a topic here</button>
</sc-if>
</div>
</body>
</html>
