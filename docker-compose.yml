      # Shown in Feeds in once the port is open, e.g. rtmp://live.arts-collective.com/in
      RELAY_PUBLIC_INGEST_URL: ${RELAY_PUBLIC_INGEST_URL:-}
      # 1 = Feeds in offers "Copy guest camera link" (/guest/camera/<key>, WHIP).
      RELAY_GUEST_CAMERAS: ${RELAY_GUEST_CAMERAS:-}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD}
      NEXT_PUBLIC_NEXTCLOUD_URL: ${NEXT_PUBLIC_NEXTCLOUD_URL}
      # Optional browser-reachable Silex editor origin for /edit/{slug} launch.
