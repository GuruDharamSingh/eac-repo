  # The Hidden Enneagram - dedicated app on hiddenenneagram.com.
  # Renders the friend's Silex-published site (shared @elkdonis/silex-render)
  # with its own org-scoped login/signup. Cookies stay host-only (no
  # EAC_COOKIE_DOMAIN) so the session is independent to his domain.
  hidden-enneagram:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    image: eac-dev
    user: "${EAC_UID:-3003}:${EAC_GID:-3003}"
    container_name: eac-hidden-enneagram
    # 1GB V8 heap + ~700MB of Node/Turbopack native overhead observed at
    # rest, so 2g sat at 86% on a freshly-started container. 3g leaves
    # real headroom while still bounding a runaway to one service.
    mem_limit: 5g
    depends_on:
      postgres:
        condition: service_healthy
      supabase-auth:
        condition: service_started
    environment:
      # GoTrue signing secret: auth-server verifies the session cookie with it
      # (verify-session.ts). Without it every check costs a GoTrue round trip.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env — it signs every GoTrue session}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-elkdonis_dev}
      NODE_ENV: production
      # V8 sizes its heap from HOST RAM when unset — on this 60GB box that
      # is a 4.1GB limit per dev server, so six of them can exhaust the
      # machine before any one of them collects. Cap it instead.
      NODE_OPTIONS: --max-old-space-size=1024
      PORT: 3012
      NEXT_PUBLIC_APP_URL: ${HIDDEN_ENNEAGRAM_URL:-http://localhost:3012}
      # Stripe — card payment for service bookings (@elkdonis/checkout
      # startThreadCheckout, 2026-09-27). Orders are confirmed by art-auction's
      # webhook and this app's /api/checkout/return hop; no webhook here.
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      NEXT_PUBLIC_ARTS_COLLECTIVE_URL: ${ARTS_COLLECTIVE_URL:-http://localhost:3007}
      # The Silex editor origin, so /edit can bounce an editor straight into
      # the page they were standing on. Redemption still goes through
      # arts-collective; only minting happens here.
      SILEX_EDITOR_PUBLIC_URL: ${SILEX_EDITOR_PUBLIC_URL:-}
      SILEX_PUBLIC_URL: ${SILEX_PUBLIC_URL:-}
      SUPABASE_URL: http://supabase-auth:9999
      NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_URL:-http://localhost:9999}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY}
      REDIS_URL: redis://redis:6379
      NEXTCLOUD_URL: ${NEXTCLOUD_URL:-http://nextcloud-nginx:80}
      NEXTCLOUD_PUBLIC_URL: ${NEXTCLOUD_PUBLIC_URL:-http://localhost:8080}
      NEXT_PUBLIC_NEXTCLOUD_URL: ${NEXT_PUBLIC_NEXTCLOUD_URL:-http://localhost:8080}
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY}
      EMAIL_AUTHENTICATED_DOMAINS: ${EMAIL_AUTHENTICATED_DOMAINS:-}
      EMAIL_FROM: ${EMAIL_FROM:-info@em6860.elkdonis-arts.org}
      EAC_OWNER_EMAIL: ${HIDDEN_ENNEAGRAM_OWNER_EMAIL:-}
      # Signs newsletter unsubscribe links. Without it every unsubscribe link
      # is dead, so sendNewsletter refuses to send at all rather than mail out
      # a letter nobody can opt out of. INTER_APP_JWT_SECRET is the fallback
      # the package reads when NEWSLETTER_SECRET is unset.
      NEWSLETTER_SECRET: ${NEWSLETTER_SECRET:-}
      INTER_APP_JWT_SECRET: ${INTER_APP_JWT_SECRET:-}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY}
    volumes:
      - .:/app
      - /app/apps/hidden-enneagram/.next
    ports:
      - "3012:3012"
    # Production mode: `next start` serves prebuilt output — no dev compiler,
    # no module graph held in memory. Build only when there is no build to
    # serve, so a crash-restart is seconds rather than a multi-minute rebuild.
    #
    # The sentinel is server/pages-manifest.json: the file `next start` opens
    # first, and one only a COMPLETED build writes. BUILD_ID is wrong (`next
    # dev` writes one too) and prerender-manifest.json is wrong (it lands
    # BEFORE page collection) — an OOM-killed build leaves both behind with no
    # .next/server at all, so a guard on either skips the rebuild forever and
    # the service restart-loops with no way out. That is exactly what happened
    # to amrit-canada. NEXT_BUILD_CPUS caps workers so the build fits under
    # mem_limit instead of being killed.
    command: sh -c "cd apps/hidden-enneagram && { [ -f .next/server/pages-manifest.json ] || NEXT_BUILD_CPUS=4 pnpm build; } && pnpm docker:start"
    restart: unless-stopped
    networks:
      - eac-network
      - nextcloud-network

