version: '3.8'

services:
  # PostgreSQL - Single database for all apps
  postgres:
    image: postgres:16-alpine
    container_name: eac-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-elkdonis_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Loopback only: apps reach these over eac-network; host scripts use
    # localhost. Nothing on the LAN needs the database port (2026-09-17).
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - eac-network

  # Supabase Auth Service
  supabase-auth:
    image: supabase/gotrue:v2.151.0
    container_name: eac-supabase-auth
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${SUPABASE_URL:-http://localhost:9999}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-elkdonis_dev}?search_path=auth
      GOTRUE_SITE_URL: ${SITE_URL:-http://localhost:3001}
      GOTRUE_URI_ALLOW_LIST: ${ADDITIONAL_REDIRECT_URLS:-}
      GOTRUE_DISABLE_SIGNUP: ${DISABLE_SIGNUP:-false}
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: ${JWT_EXPIRY:-3600}
      GOTRUE_JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env — it signs every GoTrue session}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: ${ENABLE_EMAIL_SIGNUP:-true}
      GOTRUE_MAILER_AUTOCONFIRM: true
      GOTRUE_EXTERNAL_GOOGLE_ENABLED: ${GOOGLE_OAUTH_ENABLED:-false}
      GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOTRUE_EXTERNAL_GOOGLE_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:9999/callback}
      GOTRUE_EXTERNAL_EMAIL_CLIENT: ${EMAIL_CLIENT:-smtp}
      GOTRUE_SMTP_HOST: ${SMTP_HOST}
      GOTRUE_SMTP_PORT: ${SMTP_PORT:-587}
      GOTRUE_SMTP_USER: ${SMTP_USER}
      GOTRUE_SMTP_PASS: ${SMTP_PASS}
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL:-admin@example.com}
    ports:
      - "9999:9999"
    networks:
      - eac-network
      - nextcloud-network

  # Supabase PostgREST (REST API for database)
  supabase-rest:
    image: postgrest/postgrest:v12.0.2
    container_name: eac-supabase-rest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-elkdonis_dev}
      PGRST_DB_SCHEMAS: public,storage
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env — it signs every GoTrue session}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env — it signs every GoTrue session}
      PGRST_APP_SETTINGS_JWT_EXP: ${JWT_EXPIRY:-3600}
    ports:
      - "127.0.0.1:9998:3000"
    networks:
      - eac-network
      - nextcloud-network

  # Supabase Realtime (for live updates)
  supabase-realtime:
    image: supabase/realtime:v2.29.15
    container_name: eac-supabase-realtime
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_NAME: realtime
      PORT: 4000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-elkdonis_dev}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      DB_SSL: "false"
      SECRET_KEY_BASE: ${REALTIME_SECRET:?set REALTIME_SECRET in .env}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env — it signs every GoTrue session}
      REPLICATION_MODE: RLS
      REPLICATION_POLL_INTERVAL: 100
      SECURE_CHANNELS: "true"
      RLIMIT_NOFILE: 1048576
      CLUSTER_STRATEGIES: ""
    ports:
      - "127.0.0.1:4000:4000"
    networks:
      - eac-network
      - nextcloud-network

  # Redis for caching (optional but recommended)
  redis:
    image: redis:7-alpine
    container_name: eac-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - eac-network

  # One-shot dependency install. node_modules in this repo belongs to the
  # containers (Alpine/musl native addons: sweph, sharp), so installs run here
  # and nowhere else — not on the host, and not as a side effect of starting an
  # app, which had five services racing each other into one node_modules.
  #     docker compose run --rm install
  install:
    image: eac-dev
    user: "${EAC_UID:-3003}:${EAC_GID:-3003}"
    profiles: ["tools"]
    working_dir: /app
    volumes:
      - .:/app
    # `n` declines pnpm's "remove node_modules and reinstall?" prompt, which
    # otherwise wipes the modules of every workspace at once.
    command: sh -c "printf 'n\\n' | pnpm install --config.package-import-method=hardlink"
    network_mode: bridge

  # Admin Dashboard App
  admin:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    # One slim image for every app, run as the host user so nothing written
    # into the bind mount is root-owned. See Dockerfile `development`.
    image: eac-dev
    user: "${EAC_UID:-3003}:${EAC_GID:-3003}"
    container_name: eac-admin
    restart: unless-stopped
    # 1GB V8 heap + ~700MB of Node/Turbopack native overhead observed at
    # rest, so 2g sat at 86% on a freshly-started container. 3g leaves
    # real headroom while still bounding a runaway to one service.
    mem_limit: 3g
    depends_on:
      postgres:
        condition: service_healthy
      supabase-auth:
        condition: service_started
    environment:
      # Database
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-elkdonis_dev}
      # Astro Studio helper AI (packages/astro-corpus); empty disables it.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_WORKSPACE_ID: ${ANTHROPIC_WORKSPACE_ID:-}

      # Supabase Auth
      SUPABASE_URL: http://supabase-auth:9999
      NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_URL:-http://localhost:9999}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxvY2FsIiwicm9sZSI6ImFub24iLCJpYXQiOjE2MDMxMTI5NDksImV4cCI6MTkxODY4ODk0OX0.vCiIxe5m9r7dLh3fh8MkV0b_3NwGZHZB2bXrGEaJhs8}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY:?set SUPABASE_SERVICE_KEY in .env — it is the service-role key}

      # OAuth2/OIDC Bridge for Nextcloud
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env — it signs every GoTrue session}
      NEXTCLOUD_OIDC_SECRET: ${NEXTCLOUD_OIDC_SECRET:?set NEXTCLOUD_OIDC_SECRET in .env}
      INTER_APP_JWT_SECRET: ${INTER_APP_JWT_SECRET:?set INTER_APP_JWT_SECRET in .env — it signs the network session handoff}

      # Redis
      REDIS_URL: redis://redis:6379

      # Nextcloud (external stack via shared network)
      NEXTCLOUD_URL: ${NEXTCLOUD_URL:-http://nextcloud-nginx:80}
      NEXTCLOUD_PUBLIC_URL: ${NEXTCLOUD_PUBLIC_URL:-http://localhost:8080}
      NEXT_PUBLIC_NEXTCLOUD_URL: ${NEXT_PUBLIC_NEXTCLOUD_URL:-http://localhost:8080}
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD}
      NEXTCLOUD_DEFAULT_GROUP: ${NEXTCLOUD_DEFAULT_GROUP:-EAC_Network}

      # Node environment
      NODE_ENV: production
      PORT: 3000
    volumes:
      - .:/app
      - /app/.next
    ports:
      - "3000:3000"
    command: sh -c "cd apps/admin && pnpm build && pnpm start"
    networks:
      - eac-network
      - nextcloud-network

  # Forum App (Activity Feed)
  forum:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    image: eac-dev
    user: "${EAC_UID:-3003}:${EAC_GID:-3003}"
    container_name: eac-forum
    restart: unless-stopped
    # Raised 2026-09-17: at a 1GB heap Next's memory watchdog restarted the
    # dev server on every first compile of a heavier route (the wiki editor
    # pulls Tiptap into the client bundle), dropping requests mid-run. 4GB
    # heap, 6GB container — bounded, but no longer in the way.
    mem_limit: 6g
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # GoTrue signing secret: auth-server verifies the session cookie with it
      # (verify-session.ts). Without it every check costs a GoTrue round trip.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env — it signs every GoTrue session}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-elkdonis_dev}
      NEXT_PUBLIC_APP_URL: ${FORUM_URL:-http://localhost:3003}
      ARTDIRECT_URL: ${ARTDIRECT_URL:-http://localhost:3013}
      NEXT_PUBLIC_NETWORK_URL: ${NETWORK_URL:-http://localhost:3007}
      NETWORK_HOST: ${NETWORK_HOST:-localhost:3007}
      # The forum reads the session now that it owns the wiki editor and the
      # quick-post box — until 2026-09-17 it had no auth env at all.
      SUPABASE_URL: http://supabase-auth:9999
      NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_URL:-http://localhost:9999}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxvY2FsIiwicm9sZSI6ImFub24iLCJpYXQiOjE2MDMxMTI5NDksImV4cCI6MTkxODY4ODk0OX0.vCiIxe5m9r7dLh3fh8MkV0b_3NwGZHZB2bXrGEaJhs8}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxvY2FsIiwicm9sZSI6ImFub24iLCJpYXQiOjE2MDMxMTI5NDksImV4cCI6MTkxODY4ODk0OX0.vCiIxe5m9r7dLh3fh8MkV0b_3NwGZHZB2bXrGEaJhs8}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY:?set SUPABASE_SERVICE_KEY in .env — it is the service-role key}
      # The sign-in handoff (api/auth/handoff/accept): the network site signs
      # people in and hands the session to this host with a short-lived JWT.
      INTER_APP_JWT_SECRET: ${INTER_APP_JWT_SECRET}
      NEXT_PUBLIC_NETWORK_HOST: ${NEXT_PUBLIC_NETWORK_HOST:-arts-collective.com}
      ADDITIONAL_REDIRECT_URLS: ${ADDITIONAL_REDIRECT_URLS:-}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      # Who may frame /embed (CSP frame-ancestors). Leave unset for the network's own hosts.
      FORUM_EMBED_ANCESTORS: ${FORUM_EMBED_ANCESTORS:-}
      # Non-production only: impersonate a users.id so the board can be exercised without GoTrue.
      FORUM_DEV_VIEWER_ID: ${FORUM_DEV_VIEWER_ID:-}
      NODE_ENV: development
      # V8 sizes its heap from HOST RAM when unset — on this 60GB box that
      # is a 4.1GB limit per dev server, so six of them can exhaust the
      # machine before any one of them collects. Cap it instead.
      NODE_OPTIONS: --max-old-space-size=4096
    volumes:
      - .:/app
      - /app/apps/forum/.next
    ports:
      - "3003:3003"
    command: sh -c "cd apps/forum && pnpm dev"
    networks:
      - eac-network
      - nextcloud-network

  # Sophia — the network's learning platform (packages/lms + lms-ui).
  # Canonical home of every course URL: sophia.arts-collective.com. See lms/SYNTHESIS.md.
  sophia:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    image: eac-dev
    user: "${EAC_UID:-3003}:${EAC_GID:-3003}"
    container_name: eac-sophia
    restart: unless-stopped
    mem_limit: 5g
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # GoTrue signing secret: auth-server verifies the session cookie with it
      # (verify-session.ts). Without it every check costs a GoTrue round trip.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env — it signs every GoTrue session}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-elkdonis_dev}
      NEXT_PUBLIC_APP_URL: ${SOPHIA_URL:-http://localhost:3020}
      NEXT_PUBLIC_NETWORK_URL: ${NETWORK_URL:-http://localhost:3007}
      NEXT_PUBLIC_FORUM_URL: ${FORUM_URL:-http://localhost:3003}
      ARTDIRECT_URL: ${ARTDIRECT_URL:-http://localhost:3013}
      NETWORK_HOST: ${NETWORK_HOST:-localhost:3007}
      SUPABASE_URL: http://supabase-auth:9999
      NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_URL:-http://localhost:9999}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxvY2FsIiwicm9sZSI6ImFub24iLCJpYXQiOjE2MDMxMTI5NDksImV4cCI6MTkxODY4ODk0OX0.vCiIxe5m9r7dLh3fh8MkV0b_3NwGZHZB2bXrGEaJhs8}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxvY2FsIiwicm9sZSI6ImFub24iLCJpYXQiOjE2MDMxMTI5NDksImV4cCI6MTkxODY4ODk0OX0.vCiIxe5m9r7dLh3fh8MkV0b_3NwGZHZB2bXrGEaJhs8}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY:?set SUPABASE_SERVICE_KEY in .env — it is the service-role key}
      # Sign-in is the network handoff (api/auth/handoff/accept), as on the forum.
      INTER_APP_JWT_SECRET: ${INTER_APP_JWT_SECRET}
      NEXT_PUBLIC_NETWORK_HOST: ${NEXT_PUBLIC_NETWORK_HOST:-arts-collective.com}
      ADDITIONAL_REDIRECT_URLS: ${ADDITIONAL_REDIRECT_URLS:-}
      REDIS_URL: redis://redis:6379
      # "Your guide answered" — course-operational mail only.
      SENDGRID_API_KEY: ${SENDGRID_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM:-info@em6860.elkdonis-arts.org}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-}
      EMAIL_AUTHENTICATED_DOMAINS: ${EMAIL_AUTHENTICATED_DOMAINS:-}
      EMAIL_SANDBOX: ${EMAIL_SANDBOX:-}
      # Course media: read through services' serveMedia, written by uploadOrgFile.
      NEXTCLOUD_URL: ${NEXTCLOUD_URL:-http://nextcloud-nginx:80}
      NEXTCLOUD_PUBLIC_URL: ${NEXTCLOUD_PUBLIC_URL:-http://localhost:8080}
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD}
      # Non-production only: impersonate a users.id.
      SOPHIA_DEV_VIEWER_ID: ${SOPHIA_DEV_VIEWER_ID:-}
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=1024
    volumes:
      - .:/app
      - /app/apps/sophia/.next
    ports:
      - "3020:3020"
    command: sh -c "cd apps/sophia && { [ -f .next/BUILD_ID ] && [ -f .next/server/pages-manifest.json ] || NODE_OPTIONS=--max-old-space-size=3584 NEXT_BUILD_CPUS=2 pnpm build; } && pnpm start"
    networks:
      - eac-network
      - nextcloud-network

  # Sunjay's Teaching Circle (org `sunjay`).
  #
  # Replaces the `blog-sunjay` service that held this port until 2026-09-19.
  # That was a Mantine-era blog on the same org; this is the amrit-canada
  # shape (Tailwind + shadcn + cms-ui surfaces), so the app directory is
  # apps/sunjay and nothing of the old one is mounted.
  sunjay:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    image: eac-dev
    user: "${EAC_UID:-3003}:${EAC_GID:-3003}"
    container_name: eac-sunjay
    restart: unless-stopped
    # Production mode since 2026-09-19, when the site got a public address.
    # Same shape as amrit-canada/innergathering: still the "development" build
    # TARGET (full monorepo + pnpm), just driven with NODE_ENV=production and
    # build-then-start instead of the dev server.
    #
    # The ceiling has to clear `next build` — the brief peak while compiling
    # and prerendering — not steady-state serving, which is a fraction of it
    # once `next start` is only handing out prebuilt output.
    mem_limit: 5g
    depends_on:
      postgres:
        condition: service_healthy
      supabase-auth:
        condition: service_started
    environment:
      # GoTrue signing secret: auth-server verifies the session cookie with it
      # (verify-session.ts). Without it every check costs a GoTrue round trip.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env — it signs every GoTrue session}
      # Cloudflare Turnstile (2026-11-06): the site key is baked in at build time;
      # the secret makes /api/auth/signup require a token. Set both or neither.
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-elkdonis_dev}
      NEXT_PUBLIC_APP_URL: ${SUNJAY_URL:-http://localhost:3001}
      NEXT_PUBLIC_ARTS_COLLECTIVE_URL: ${ARTS_COLLECTIVE_URL:-http://localhost:3007}
      # The marketplace — a member's store section links there
      NEXT_PUBLIC_ART_AUCTION_URL: ${ART_AUCTION_URL:-http://localhost:3009}
      NODE_ENV: production
      PORT: 3001
      # V8 sizes its heap from HOST RAM when unset — on this 60GB box that
      # is a 4.1GB limit per dev server, so six of them can exhaust the
      # machine before any one of them collects. Cap it instead.
      NODE_OPTIONS: --max-old-space-size=1024
      # Supabase Auth
      SUPABASE_URL: http://supabase-auth:9999
      NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_URL:-http://localhost:9999}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxvY2FsIiwicm9sZSI6ImFub24iLCJpYXQiOjE2MDMxMTI5NDksImV4cCI6MTkxODY4ODk0OX0.vCiIxe5m9r7dLh3fh8MkV0b_3NwGZHZB2bXrGEaJhs8}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxvY2FsIiwicm9sZSI6ImFub24iLCJpYXQiOjE2MDMxMTI5NDksImV4cCI6MTkxODY4ODk0OX0.vCiIxe5m9r7dLh3fh8MkV0b_3NwGZHZB2bXrGEaJhs8}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY:?set SUPABASE_SERVICE_KEY in .env — it is the service-role key}
      # Owner config — fallback recipient for guest RSVP notifications.
      SUNJAY_OWNER_EMAIL: ${SUNJAY_OWNER_EMAIL:-fnordj@gmail.com}
      # Nextcloud — media library, collaborative documents, Talk rooms.
      NEXTCLOUD_URL: ${NEXTCLOUD_URL:-http://nextcloud-nginx:80}
      NEXTCLOUD_PUBLIC_URL: ${NEXTCLOUD_PUBLIC_URL:-http://localhost:8080}
      NEXT_PUBLIC_NEXTCLOUD_URL: ${NEXT_PUBLIC_NEXTCLOUD_URL:-http://localhost:8080}
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD}
      # ArtDirect — "My profile" hub tile links out to a member's ArtDirect page.
      NEXT_PUBLIC_ARTDIRECT_URL: ${ARTDIRECT_URL:-http://localhost:3013}
      # The network's SSO hop (packages/auth-server/src/handoff.ts): the
      # inter-app signing secret and the origins a handoff may target.
      INTER_APP_JWT_SECRET: ${INTER_APP_JWT_SECRET}
      CONNECTIONS_KEY: ${CONNECTIONS_KEY:-}
      NEXT_PUBLIC_NETWORK_HOST: ${NEXT_PUBLIC_NETWORK_HOST:-arts-collective.com}
      ADDITIONAL_REDIRECT_URLS: ${ADDITIONAL_REDIRECT_URLS:-}
      # Redis
      REDIS_URL: redis://redis:6379
      # SendGrid
      SENDGRID_API_KEY: ${SENDGRID_API_KEY}
      EMAIL_AUTHENTICATED_DOMAINS: ${EMAIL_AUTHENTICATED_DOMAINS:-}
      EMAIL_FROM: ${EMAIL_FROM:-info@em6860.elkdonis-arts.org}
      # The host every org's inbound reply address sits on. Read server-side by
      # packages/email `inboundEnabled()`, which gates the email suite's Inbox
      # tab — UNSET means the tab renders "no inbound address is configured"
      # even though mail is arriving and visible under Activity. It used to go
      # only to arts-collective (which receives the webhook), but every app
      # that RENDERS the suite needs it too.
      EMAIL_INBOUND_DOMAIN: ${EMAIL_INBOUND_DOMAIN:-}
      # Stripe — each owner's own Express onboarding on /manage and in the
      # profile popup (src/lib/payout-actions.ts), and card booking of group
      # and self-paced services (src/lib/booking-actions.ts). Orders are
      # confirmed by art-auction's webhook and this app's /api/checkout/return
      # hop; there is no webhook here. The org holds no account of its own.
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
    volumes:
      - .:/app
      - /app/apps/sunjay/.next
    ports:
      - "3001:3001"
    # Build only when there is no COMPLETED build to serve, then start.
    #
    # Both files are tested, because each alone gives a false positive and the
    # two failures point opposite ways — this was learned the hard way here:
    #
    #   BUILD_ID alone            `next dev` writes one too, so a volume that
    #                             only ever ran the dev server looks built.
    #   pages-manifest alone      written during COMPILE, before type-checking.
    #                             A build that compiles and then fails tsc
    #                             leaves it behind with no BUILD_ID, the guard
    #                             skips the rebuild, and `next start` dies on
    #                             "Could not find a production build" forever.
    #   prerender-manifest        lands before page collection; an OOM-killed
    #                             build leaves it with no .next/server at all.
    #
    # BUILD_ID is written LAST, by a completed build; pages-manifest is what
    # `next start` then opens. Requiring both means only a real, finished
    # production build satisfies the guard, and every partial state self-heals
    # on the next restart.
    #
    # NEXT_BUILD_CPUS caps workers so the build fits under mem_limit rather
    # than being OOM-killed: Next defaults to one worker per CPU and this host
    # has 32 while the container is capped far below what 31 workers need.
    command: sh -c "cd apps/sunjay && { [ -f .next/BUILD_ID ] && [ -f .next/server/pages-manifest.json ] || NEXT_BUILD_CPUS=4 pnpm build; } && pnpm docker:start"
    networks:
      - eac-network
      - nextcloud-network

