      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxvY2FsIiwicm9sZSI6ImFub24iLCJpYXQiOjE2MDMxMTI5NDksImV4cCI6MTkxODY4ODk0OX0.vCiIxe5m9r7dLh3fh8MkV0b_3NwGZHZB2bXrGEaJhs8}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxvY2FsIiwicm9sZSI6ImFub24iLCJpYXQiOjE2MDMxMTI5NDksImV4cCI6MTkxODY4ODk0OX0.vCiIxe5m9r7dLh3fh8MkV0b_3NwGZHZB2bXrGEaJhs8}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY:?set SUPABASE_SERVICE_KEY in .env — it is the service-role key}
      # Owner config
      AMRIT_CANADA_OWNER_EMAIL: ${AMRIT_CANADA_OWNER_EMAIL:-gurudharamsingh@gmail.com}
      # Nextcloud — media library, collaborative documents, Talk rooms.
      # The service is already on nextcloud-network; it was missing only these.
      NEXTCLOUD_URL: ${NEXTCLOUD_URL:-http://nextcloud-nginx:80}
      NEXTCLOUD_PUBLIC_URL: ${NEXTCLOUD_PUBLIC_URL:-http://localhost:8080}
      NEXT_PUBLIC_NEXTCLOUD_URL: ${NEXT_PUBLIC_NEXTCLOUD_URL:-http://localhost:8080}
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD}
      # ArtDirect — "My profile" hub tile links out to a member's ArtDirect page.
      NEXT_PUBLIC_ARTDIRECT_URL: ${ARTDIRECT_URL:-http://localhost:3013}
      # The network's SSO hop (packages/auth-server/src/handoff.ts): the
      # inter-app signing secret and the origins a handoff may target. Values
      # come from .env; no defaults here on purpose.
      INTER_APP_JWT_SECRET: ${INTER_APP_JWT_SECRET}
      NEXT_PUBLIC_NETWORK_HOST: ${NEXT_PUBLIC_NETWORK_HOST:-arts-collective.com}
      ADDITIONAL_REDIRECT_URLS: ${ADDITIONAL_REDIRECT_URLS:-}
      # The Pipeline hub tile renders the org's OWN Deck board, resolved from
      # organizations.deck_board_id (migration 101) — no board id in env. The
      # former NEXTCLOUD_PIPELINE_BOARD_ID defaulted to 14, a board owned by
      # another member and shared with the whole collective, so every site
      # pointed at the same cards.
      # SendGrid
      SENDGRID_API_KEY: ${SENDGRID_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM:-info@em6860.elkdonis-arts.org}
    volumes:
      - .:/app
      - /app/apps/amrit-canada/.next
    ports:
      - "3006:3006"
    # Build only when there is no build to serve, then start — matches
    # inner-gathering's pattern above. `next start` serves prebuilt output,
    # so a crash-restart is seconds, not a multi-minute rebuild.
    #
    # Third sentinel, and the reason for each: BUILD_ID failed because
    # `next dev` writes one too. prerender-manifest.json then failed because it
    # lands BEFORE page collection — an OOM-killed build (31 workers on a
    # 32-core host, capped container) left it present with no .next/server
    # directory at all, so the guard skipped the rebuild, `next start` died on
    # the missing server manifest, and the restart loop could never self-heal.
    # server/pages-manifest.json is the file `next start` actually opens, and
    # only a completed build writes it. NEXT_BUILD_CPUS caps workers so the
    # build fits under mem_limit rather than being OOM-killed in the first place.
    command: sh -c "cd apps/amrit-canada && { [ -f .next/server/pages-manifest.json ] || NEXT_BUILD_CPUS=4 pnpm build; } && pnpm docker:start"
    networks:
      - eac-network
      - nextcloud-network

