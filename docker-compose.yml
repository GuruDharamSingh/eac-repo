  # EAC_COOKIE_DOMAIN) so the session is independent to his domain.
  hidden-enneagram:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: eac-hidden-enneagram
    # 1GB V8 heap + ~700MB of Node/Turbopack native overhead observed at
    # rest, so 2g sat at 86% on a freshly-started container. 3g leaves
    # real headroom while still bounding a runaway to one service.
    mem_limit: 5g
    depends_on:
      postgres:
        condition: service_healthy
      supabase-auth:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-elkdonis_dev}
      NODE_ENV: production
      # V8 sizes its heap from HOST RAM when unset — on this 60GB box that
      # is a 4.1GB limit per dev server, so six of them can exhaust the
      # machine before any one of them collects. Cap it instead.
      NODE_OPTIONS: --max-old-space-size=1024
      PORT: 3012
      NEXT_PUBLIC_APP_URL: ${HIDDEN_ENNEAGRAM_URL:-http://localhost:3012}
      NEXT_PUBLIC_ARTS_COLLECTIVE_URL: ${ARTS_COLLECTIVE_URL:-http://localhost:3007}
      # The Silex editor origin, so /edit can bounce an editor straight into
