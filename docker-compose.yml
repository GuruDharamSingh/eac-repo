      # https://edit.example.com. If unset, dev falls back to port 6805.
      SILEX_BRIDGE_SECRET: ${SILEX_BRIDGE_SECRET:?set SILEX_BRIDGE_SECRET in .env — it gates /api/silex/auth}
      SILEX_EDITOR_PUBLIC_URL: ${SILEX_EDITOR_PUBLIC_URL:-}
      SILEX_PUBLIC_URL: ${SILEX_PUBLIC_URL:-}
      # JWT shared secret for inter-app SSO bridge (Talk room join, etc.),
      # and the wider set: the network's site-to-site session handoff
      # (packages/auth-server/src/handoff.ts) needs to know which origins
      # it may accept a token FROM. Without this, arts-collective — the
      # network host every handoff bounces through — refused every other
      # site's token as an "unknown issuer" even though the token itself
      # was valid, because this was the one service missing the list.
      INTER_APP_JWT_SECRET: ${INTER_APP_JWT_SECRET:?set INTER_APP_JWT_SECRET in .env — it signs the network session handoff}
      CONNECTIONS_KEY: ${CONNECTIONS_KEY:-}
      ADDITIONAL_REDIRECT_URLS: ${ADDITIONAL_REDIRECT_URLS:-}
    volumes:
      - .:/app
      - /app/apps/arts-collective/.next
    ports:
      - "3007:3007"
    # Build only when there is no build to serve, then start — the same shape
    # as ifac/innergathering/amrit-canada above. server/pages-manifest.json is
    # the file `next start` actually opens, and only a completed build writes
    # it. The heap is raised FOR THE BUILD ONLY: this app is the largest on the
    # network and a Turbopack build of it gets OOM-killed (exit 137) at the
    # 1024MB the running server is capped to.
    command: sh -c "cd apps/arts-collective && { [ -f .next/server/pages-manifest.json ] || NODE_OPTIONS=--max-old-space-size=3584 NEXT_BUILD_CPUS=2 pnpm build; } && pnpm docker:start"
    networks:
      - eac-network
      - nextcloud-network

  # ArtDirect — standalone Online Artist Directory (OAD) app.
  # The network's public commons / front door. Shares the substrate: same
  # Postgres (directory_profiles, org_id='oad'), same Supabase auth, same
  # @elkdonis/cms-bindings dossier rendering. arts-collective /directory
  # redirects here.
  artdirect:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    image: eac-dev
    user: "${EAC_UID:-3003}:${EAC_GID:-3003}"
    container_name: eac-artdirect
    restart: unless-stopped
    # Bumped from 3g (2026-09-04): adding the inline profile editor pulled in
    # @elkdonis/ui's full barrel (ProfileGallery/LiveEditor drag in Excalidraw,
    # Mantine dropzone/tiptap transitively) — the exact same class of OOM ifac
    # hit compiling /[slug] the first time (see ifac's own mem_limit note
    # below), silently SIGKILLing the container mid-compile with no JS-level
    # error, just a clean-looking exit code 0 and a restart loop.
    mem_limit: 5g
    depends_on:
      postgres:
        condition: service_healthy
      supabase-auth:
        condition: service_started
    environment:
      # GoTrue signing secret: auth-server verifies the session cookie with it
      # (verify-session.ts). Without it every check costs a GoTrue round trip.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env — it signs every GoTrue session}
      # Cloudflare Turnstile (2026-11-06): the site key is baked in at build time;
      # the secret makes /api/auth/signup require a token. Set both or neither.
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-elkdonis_dev}
      NEXT_PUBLIC_APP_URL: ${ARTDIRECT_URL:-http://localhost:3013}
      # Stripe — card payment for service bookings (@elkdonis/checkout
      # startThreadCheckout, 2026-09-27). Orders are confirmed by art-auction's
      # webhook and this app's /api/checkout/return hop; no webhook here.
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      # Metis news desk — every box on /classifieds/news is one of the day's
      # stories (2026-10-28). The token opens /v1/news/headlines and nothing
      # else in Metis. Without them that page has no news.
      METIS_URL: ${METIS_URL:-}
      METIS_NEWS_TOKEN: ${METIS_NEWS_TOKEN:-}
      NEXT_PUBLIC_ARTDIRECT_URL: ${ARTDIRECT_URL:-http://localhost:3013}
      NEXT_PUBLIC_ARTS_COLLECTIVE_URL: ${ARTS_COLLECTIVE_URL:-http://localhost:3007}
      NEXT_PUBLIC_ART_AUCTION_URL: ${ART_AUCTION_URL:-http://localhost:3009}
      # Gallery pages live on IFAC (lib/oad.ts).
      NEXT_PUBLIC_IFAC_URL: ${IFAC_URL:-http://localhost:3008}
      # Network SSO (src/proxy.ts, /api/auth/handoff): the person page is the
      # root of a person's network presence, so it takes part (2026-09-26).
      INTER_APP_JWT_SECRET: ${INTER_APP_JWT_SECRET:?set INTER_APP_JWT_SECRET in .env — it signs the network session handoff}
      CONNECTIONS_KEY: ${CONNECTIONS_KEY:-}
      NEXT_PUBLIC_NETWORK_HOST: ${NEXT_PUBLIC_NETWORK_HOST:-arts-collective.com}
      # Connect Instagram / YouTube from the person's page (2026-11-01): the
      # row is created here with the collective's apps, consent runs on the
      # network host, and the feeds are read here.
      YOUTUBE_CLIENT_ID: ${YOUTUBE_CLIENT_ID:-}
      YOUTUBE_CLIENT_SECRET: ${YOUTUBE_CLIENT_SECRET:-}
      INSTAGRAM_APP_ID: ${INSTAGRAM_APP_ID:-}
      INSTAGRAM_APP_SECRET: ${INSTAGRAM_APP_SECRET:-}
      META_GRAPH_VERSION: ${META_GRAPH_VERSION:-v21.0}
      # Production mode since 2026-10-19: `next dev` served the public
      # directory host and held about 4 GB. Same shape as ifac below.
      NODE_ENV: production
      # V8 sizes its heap from HOST RAM when unset. 1024 matches the other
      # production apps; the 2048 was for compiling the Puck editor in dev.
      NODE_OPTIONS: --max-old-space-size=1024
      # Supabase Auth
      SUPABASE_URL: http://supabase-auth:9999
      NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_URL:-http://localhost:9999}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxvY2FsIiwicm9sZSI6ImFub24iLCJpYXQiOjE2MDMxMTI5NDksImV4cCI6MTkxODY4ODk0OX0.vCiIxe5m9r7dLh3fh8MkV0b_3NwGZHZB2bXrGEaJhs8}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY:?set SUPABASE_SERVICE_KEY in .env — it is the service-role key}
      # Redis
      REDIS_URL: redis://redis:6379
      # Places autocomplete: self-hosted Photon (see `photon` service, profile geo).
      # Until the OSM index is imported, dev uses offline fixtures via `mock`.
      GEO_PROVIDER: ${GEO_PROVIDER:-mock}
      PHOTON_URL: ${PHOTON_URL:-http://photon:2322}
      # Nextcloud — profile avatar/gallery uploads. The service is already
      # on nextcloud-network; it was missing only these.
      NEXTCLOUD_URL: ${NEXTCLOUD_URL:-http://nextcloud-nginx:80}
      NEXTCLOUD_PUBLIC_URL: ${NEXTCLOUD_PUBLIC_URL:-http://localhost:8080}
      NEXT_PUBLIC_NEXTCLOUD_URL: ${NEXT_PUBLIC_NEXTCLOUD_URL:-http://localhost:8080}
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD}
    volumes:
      - .:/app
      - /app/apps/artdirect/.next
    ports:
      - "3013:3013"
    # Build only when there is no complete build, then `next start`. Guard
    # and reasons: ifac's command below and docs/reference/ops.md.
    command: sh -c "cd apps/artdirect && { [ -f .next/BUILD_ID ] && [ -f .next/server/pages-manifest.json ] || NEXT_BUILD_CPUS=4 pnpm build; } && pnpm docker:start"
    networks:
      - eac-network
      - nextcloud-network

  # Amrit Vela Toronto – Sadhana community site
  amrit-canada:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    image: eac-dev
    user: "${EAC_UID:-3003}:${EAC_GID:-3003}"
    container_name: eac-amrit-canada
    restart: unless-stopped
    # Switched to production mode (2026-09-05), same shape as inner-gathering
    # below: still the "development" build target (full monorepo + pnpm, not
    # the multi-stage Dockerfile `production` stage — that stage assumes a
    # slim standalone runtime this deployment doesn't use), just driven with
    # NODE_ENV=production and `next build && next start` instead of the dev
    # server. The ceiling has to clear `next build` (the peak, briefly held
    # while compiling+prerendering), not steady-state serving, which is a
    # fraction of this once `next start` is just serving prebuilt output.
    mem_limit: 5g
    depends_on:
      postgres:
        condition: service_healthy
      supabase-auth:
        condition: service_started
    environment:
      # GoTrue signing secret: auth-server verifies the session cookie with it
      # (verify-session.ts). Without it every check costs a GoTrue round trip.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env — it signs every GoTrue session}
      # Cloudflare Turnstile (2026-11-06): the site key is baked in at build time;
      # the secret makes /api/auth/signup require a token. Set both or neither.
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-elkdonis_dev}
