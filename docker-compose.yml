  # IFAC - International Fine Art Collectors public site and org admin
  ifac:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: eac-ifac
    restart: unless-stopped
    # ifac serves a live public domain. It OOM'd against a 3g cap with a
    # 1GB JS heap, so the overhead is Turbopack native + file watching,
    # not JS. Give the one public site room; dev-only apps keep 3g.
    #
    # Switched to production mode (2026-09-12): ifac was running `next dev`
    # against live traffic. In dev mode, CSS isn't emitted as prebuilt <link>
    # tags — it's injected as each route's chunk compiles on demand, so a
    # cold route (first client nav to /artists, or /hub right after login)
    # could paint before its CSS finished compiling, rendering unstyled until
    # a refresh hit the now-warm module. `next start` serves prebuilt static
    # CSS, which structurally can't race like that. Same shape as
    # amrit-canada/inner-gathering below.
    mem_limit: 5g
    depends_on:
      postgres:
        condition: service_healthy
      supabase-auth:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-elkdonis_dev}
      NEXT_PUBLIC_APP_URL: ${IFAC_URL:-http://localhost:3008}
      # The marketplace — a member's store section links there
      NEXT_PUBLIC_ART_AUCTION_URL: ${ART_AUCTION_URL:-http://localhost:3009}
      NODE_ENV: production
      PORT: 3008
      # V8 sizes its heap from HOST RAM when unset — on this 60GB box that
      # is a 4.1GB limit per dev server, so six of them can exhaust the
      # machine before any one of them collects. Cap it instead.
      NODE_OPTIONS: --max-old-space-size=1024
      SUPABASE_URL: http://supabase-auth:9999
      NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_URL:-http://localhost:9999}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxvY2FsIiwicm9sZSI6ImFub24iLCJpYXQiOjE2MDMxMTI5NDksImV4cCI6MTkxODY4ODk0OX0.vCiIxe5m9r7dLh3fh8MkV0b_3NwGZHZB2bXrGEaJhs8}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxvY2FsIiwicm9sZSI6ImFub24iLCJpYXQiOjE2MDMxMTI5NDksImV4cCI6MTkxODY4ODk0OX0.vCiIxe5m9r7dLh3fh8MkV0b_3NwGZHZB2bXrGEaJhs8}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY:?set SUPABASE_SERVICE_KEY in .env — it is the service-role key}
      NEXT_PUBLIC_IFAC_OWNER_EMAIL: ${IFAC_OWNER_EMAIL:-info@ifacgroup.com}
      NEXT_PUBLIC_EAC_ADMIN_URL: ${EAC_ADMIN_URL:-http://localhost:3000}
      NEXT_PUBLIC_ARTDIRECT_URL: ${ARTDIRECT_URL:-http://localhost:3013}
      # The network's SSO hop (packages/auth-server/src/handoff.ts): the
      # inter-app signing secret and the origins a handoff may target.
      INTER_APP_JWT_SECRET: ${INTER_APP_JWT_SECRET}
      NEXT_PUBLIC_NETWORK_HOST: ${NEXT_PUBLIC_NETWORK_HOST:-arts-collective.com}
      ADDITIONAL_REDIRECT_URLS: ${ADDITIONAL_REDIRECT_URLS:-}
      REDIS_URL: redis://redis:6379
      # SendGrid
      SENDGRID_API_KEY: ${SENDGRID_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM:-info@em6860.elkdonis-arts.org}
      # Nextcloud (external stack via shared network) — member media storage
      NEXTCLOUD_URL: ${NEXTCLOUD_URL:-http://nextcloud-nginx:80}
      NEXTCLOUD_PUBLIC_URL: ${NEXTCLOUD_PUBLIC_URL:-http://localhost:8080}
      NEXT_PUBLIC_NEXTCLOUD_URL: ${NEXT_PUBLIC_NEXTCLOUD_URL:-http://localhost:8080}
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD}
    volumes:
      - .:/app
      - /app/apps/ifac/.next
    ports:
      - "3008:3008"
    # Build only when there is no build to serve, then start — matches
    # amrit-canada/inner-gathering's pattern above. server/pages-manifest.json
    # is the file `next start` actually opens, and only a completed build
    # writes it (BUILD_ID and prerender-manifest.json both land too early and
    # can strand a restart loop behind an OOM-killed build). NEXT_BUILD_CPUS
    # caps workers so the build fits under mem_limit instead of being killed.
    command: sh -c "cd apps/ifac && { [ -f .next/server/pages-manifest.json ] || NEXT_BUILD_CPUS=4 pnpm build; } && pnpm docker:start"
    networks:
      - eac-network
      - nextcloud-network

