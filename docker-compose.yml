      INTER_APP_JWT_SECRET: ${INTER_APP_JWT_SECRET}
      CONNECTIONS_KEY: ${CONNECTIONS_KEY:-}
      NEXT_PUBLIC_NETWORK_HOST: ${NEXT_PUBLIC_NETWORK_HOST:-arts-collective.com}
      ADDITIONAL_REDIRECT_URLS: ${ADDITIONAL_REDIRECT_URLS:-}
