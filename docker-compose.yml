      # (also the key in migration 243). Baked in at build time.
      NEXT_PUBLIC_KATIE_THE_POTTER_OWNER_EMAIL: ${KATIE_THE_POTTER_OWNER_EMAIL:-katie@katiethepotter.example}
      # The marketplace her pieces are sold through, and ArtDirect.
      NEXT_PUBLIC_ART_AUCTION_URL: ${ART_AUCTION_URL:-http://localhost:3009}
      NEXT_PUBLIC_ARTDIRECT_URL: ${ARTDIRECT_URL:-http://localhost:3013}
      # Keys the analytics visitor hash (packages/analytics).
      ANALYTICS_SECRET: ${INTER_APP_JWT_SECRET:?set INTER_APP_JWT_SECRET in .env}
      # The network's SSO hop (packages/auth-server): the inter-app signing
      # secret and the host a handoff may target. Same set as sunjay.
      INTER_APP_JWT_SECRET: ${INTER_APP_JWT_SECRET}
      NEXT_PUBLIC_NETWORK_HOST: ${NEXT_PUBLIC_NETWORK_HOST:-arts-collective.com}
      ADDITIONAL_REDIRECT_URLS: ${ADDITIONAL_REDIRECT_URLS:-}
      NODE_ENV: production
      PORT: 3023
      NODE_OPTIONS: --max-old-space-size=1024
      # Supabase Auth
      SUPABASE_URL: http://supabase-auth:9999
      NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_URL:-http://localhost:9999}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxvY2FsIiwicm9sZSI6ImFub24iLCJpYXQiOjE2MDMxMTI5NDksImV4cCI6MTkxODY4ODk0OX0.vCiIxe5m9r7dLh3fh8MkV0b_3NwGZHZB2bXrGEaJhs8}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxvY2FsIiwicm9sZSI6ImFub24iLCJpYXQiOjE2MDMxMTI5NDksImV4cCI6MTkxODY4ODk0OX0.vCiIxe5m9r7dLh3fh8MkV0b_3NwGZHZB2bXrGEaJhs8}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY:?set SUPABASE_SERVICE_KEY in .env — it is the service-role key}
      # Stripe — LIVE keys. Card checkout (src/lib/shop-actions.ts) opens Stripe's
      # hosted page and returns to THIS site (/api/checkout/return). The webhook
      # stays on the marketplace (market.arts-collective.com/api/stripe/webhook):
      # orders are in the shared database, and the webhook and our return hop
      # both call confirmOrderPaid, which is idempotent. Sample pieces are
      # refused on card (src/lib/sample-guard.ts).
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      # SendGrid — order emails (buyer invoice/receipt, Katie's "new order",
      # the platform copy) sent from this process. Same three lines as
      # art-auction; @elkdonis/email reads EMAIL_FROM (+ the authenticated
      # domains) and the org's site_config email identity. Added 2026-11-06.
      SENDGRID_API_KEY: ${SENDGRID_API_KEY}
      EMAIL_AUTHENTICATED_DOMAINS: ${EMAIL_AUTHENTICATED_DOMAINS:-}
      EMAIL_FROM: ${EMAIL_FROM:-info@em6860.elkdonis-arts.org}
      # Redis
      REDIS_URL: redis://redis:6379
      # Nextcloud (media upload/serve via src/app/api/media/*)
      NEXTCLOUD_URL: ${NEXTCLOUD_URL:-http://nextcloud-nginx:80}
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD}
    volumes:
      - .:/app
      - /app/apps/katie-the-potter/.next
    ports:
      - "3023:3023"
    # Build only when there is a COMPLETED build to serve (the two-file
    # sentinel — see sunjay above for why each file alone is a false positive).
    command: sh -c "cd apps/katie-the-potter && { [ -f .next/BUILD_ID ] && [ -f .next/server/pages-manifest.json ] || NEXT_BUILD_CPUS=4 pnpm build; } && pnpm docker:start"
    networks:
      - eac-network
      - nextcloud-network

  # Fourth Way Book Readers — books.elkdonis-arts.org (org: fourth_way_book_readers).
  # Port 3019: 3010 (the old fourth-way-book-readers stub's port) is held on
  # this host by open-webui, and 3017 by astrology-dev.
  fourthway-bookreaders:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    image: eac-dev
    user: "${EAC_UID:-3003}:${EAC_GID:-3003}"
    container_name: eac-fourthway-bookreaders
    restart: unless-stopped
    # Production mode since 2026-09-26, same shape as amrit-canada: guarded
    # `next build`, then `next start`. The limit has to clear the build peak.
    mem_limit: 5g
    depends_on:
      postgres:
        condition: service_healthy
      supabase-auth:
        condition: service_started
    environment:
      # GoTrue signing secret: auth-server verifies the session cookie with it
      # (verify-session.ts). Without it every check costs a GoTrue round trip.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env — it signs every GoTrue session}
      # Cloudflare Turnstile (2026-11-06): the site key is baked in at build time;
      # the secret makes /api/auth/signup require a token. Set both or neither.
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-elkdonis_dev}
      NEXT_PUBLIC_APP_URL: ${FOURTHWAY_BOOKREADERS_URL:-http://localhost:3019/books}
      # Served under a sub-path of the shared elkdonis-arts.org (which
      # innergathering owns the root of) rather than on a domain of its own —
      # no DNS record and no certificate needed. Next's `basePath` reads this,
      # as do withBase() in src/lib/base-path.ts and @elkdonis/auth-client.
      # Unset it (and repoint the proxy) to move to books.elkdonis-arts.org.
      NEXT_PUBLIC_BASE_PATH: ${FOURTHWAY_BASE_PATH-/books}
      NEXT_PUBLIC_ARTS_COLLECTIVE_URL: ${ARTS_COLLECTIVE_URL:-http://localhost:3007}
      NEXT_PUBLIC_ART_AUCTION_URL: ${ART_AUCTION_URL:-http://localhost:3009}
      NEXT_PUBLIC_ARTDIRECT_URL: ${ARTDIRECT_URL:-http://localhost:3013}
      NODE_ENV: production
      PORT: 3019
      # Runtime heap for `next start`. It was 2048 while this ran `next dev`
      # (a Turbopack compile of the shared editor crossed 1GB).
      NODE_OPTIONS: --max-old-space-size=1024
      # Supabase Auth
      SUPABASE_URL: http://supabase-auth:9999
      NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_URL:-http://localhost:9999}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxvY2FsIiwicm9sZSI6ImFub24iLCJpYXQiOjE2MDMxMTI5NDksImV4cCI6MTkxODY4ODk0OX0.vCiIxe5m9r7dLh3fh8MkV0b_3NwGZHZB2bXrGEaJhs8}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxvY2FsIiwicm9sZSI6ImFub24iLCJpYXQiOjE2MDMxMTI5NDksImV4cCI6MTkxODY4ODk0OX0.vCiIxe5m9r7dLh3fh8MkV0b_3NwGZHZB2bXrGEaJhs8}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY:?set SUPABASE_SERVICE_KEY in .env — it is the service-role key}
      REDIS_URL: redis://redis:6379
      # Nextcloud — covers, the side banner, handouts, and the recordings the
      # front page's theatre lists (EAC_Network/fourth_way_book_readers/Media/Videos).
      # The Akhand Path admin creates YouTube connections here (2026-11-01).
      YOUTUBE_CLIENT_ID: ${YOUTUBE_CLIENT_ID:-}
      YOUTUBE_CLIENT_SECRET: ${YOUTUBE_CLIENT_SECRET:-}
      NEXTCLOUD_URL: ${NEXTCLOUD_URL:-http://nextcloud-nginx:80}
      NEXTCLOUD_PUBLIC_URL: ${NEXTCLOUD_PUBLIC_URL:-http://localhost:8080}
      NEXT_PUBLIC_NEXTCLOUD_URL: ${NEXT_PUBLIC_NEXTCLOUD_URL:-http://localhost:8080}
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD}
      # The network's SSO hop (packages/auth-server/src/handoff.ts).
      INTER_APP_JWT_SECRET: ${INTER_APP_JWT_SECRET}
      CONNECTIONS_KEY: ${CONNECTIONS_KEY:-}
      NEXT_PUBLIC_NETWORK_HOST: ${NEXT_PUBLIC_NETWORK_HOST:-arts-collective.com}
      ADDITIONAL_REDIRECT_URLS: ${ADDITIONAL_REDIRECT_URLS:-}
    volumes:
      - .:/app
      - /app/apps/fourthwayBookreaders/.next
    ports:
      - "3019:3019"
    # Build only when there is no completed build (two-file sentinel, see
    # sunjay above), then serve it. Source edits are not live until a rebuild:
    # docs/reference/ops.md "Build and deploy a production-mode app".
    # The build gets a larger heap than the 1024 runtime: the dev compile of
    # the shared editor already crossed 1GB.
    command: sh -c "cd apps/fourthwayBookreaders && { [ -f .next/BUILD_ID ] && [ -f .next/server/pages-manifest.json ] || NODE_OPTIONS=--max-old-space-size=3072 NEXT_BUILD_CPUS=4 pnpm build; } && pnpm docker:start"
    networks:
      - eac-network
      - nextcloud-network

  # Port 3021: Elkdonis Tours & Experiences (apps/elktours, org `elktours`),
  # a tour company in Paris selling dated departures by card (migration 208).
  # Dev mode while the site is being built and has no domain; switch to the
  # production shape above (sentinel + `pnpm docker:start`) when it launches.
  elktours:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    image: eac-dev
    user: "${EAC_UID:-3003}:${EAC_GID:-3003}"
    container_name: eac-elktours
    restart: unless-stopped
    # Production mode (2026-11-03), same shape as danamccool: "development" image target,
    # NODE_ENV=production, guarded `next build` then `next start`. The ceiling clears the build peak.
    mem_limit: 5g
    depends_on:
      postgres:
        condition: service_healthy
      supabase-auth:
        condition: service_started
    environment:
      # GoTrue signing secret: auth-server verifies the session cookie with it
      # (verify-session.ts). Without it every check costs a GoTrue round trip.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env — it signs every GoTrue session}
      # Cloudflare Turnstile (2026-11-06): the site key is baked in at build time;
      # the secret makes /api/auth/signup require a token. Set both or neither.
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-elkdonis_dev}
      REDIS_URL: redis://redis:6379
      NEXT_PUBLIC_APP_URL: ${ELKTOURS_URL:-http://localhost:3021}
      NEXT_PUBLIC_ARTS_COLLECTIVE_URL: ${ARTS_COLLECTIVE_URL:-http://localhost:3007}
      NEXT_PUBLIC_ART_AUCTION_URL: ${ART_AUCTION_URL:-http://localhost:3009}
      NEXT_PUBLIC_ARTDIRECT_URL: ${ARTDIRECT_URL:-http://localhost:3013}
      NODE_ENV: production
      PORT: 3021
      NODE_OPTIONS: --max-old-space-size=3584
      SUPABASE_URL: http://supabase-auth:9999
      NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_URL:-http://localhost:9999}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxvY2FsIiwicm9sZSI6ImFub24iLCJpYXQiOjE2MDMxMTI5NDksImV4cCI6MTkxODY4ODk0OX0.vCiIxe5m9r7dLh3fh8MkV0b_3NwGZHZB2bXrGEaJhs8}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxvY2FsIiwicm9sZSI6ImFub24iLCJpYXQiOjE2MDMxMTI5NDksImV4cCI6MTkxODY4ODk0OX0.vCiIxe5m9r7dLh3fh8MkV0b_3NwGZHZB2bXrGEaJhs8}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY:?set SUPABASE_SERVICE_KEY in .env — it is the service-role key}
      ELKTOURS_OWNER_EMAIL: ${ELKTOURS_OWNER_EMAIL:-danamccoolart@gmail.com}
      NEXTCLOUD_URL: ${NEXTCLOUD_URL:-http://nextcloud-nginx:80}
      NEXTCLOUD_PUBLIC_URL: ${NEXTCLOUD_PUBLIC_URL:-http://localhost:8080}
      NEXT_PUBLIC_NEXTCLOUD_URL: ${NEXT_PUBLIC_NEXTCLOUD_URL:-http://localhost:8080}
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD}
      INTER_APP_JWT_SECRET: ${INTER_APP_JWT_SECRET}
      NEXT_PUBLIC_NETWORK_HOST: ${NEXT_PUBLIC_NETWORK_HOST:-arts-collective.com}
      ADDITIONAL_REDIRECT_URLS: ${ADDITIONAL_REDIRECT_URLS:-}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY}
      EMAIL_AUTHENTICATED_DOMAINS: ${EMAIL_AUTHENTICATED_DOMAINS:-}
      EMAIL_FROM: ${EMAIL_FROM:-info@em6860.elkdonis-arts.org}
      EMAIL_INBOUND_DOMAIN: ${EMAIL_INBOUND_DOMAIN:-}
      # Card bookings and the guide's Stripe Express onboarding
      # (packages/checkout). The webhook stays on art-auction; this app only
      # creates sessions and reconciles on the return hop.
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      # Optional. Unset, each stop links out to Google Street View; set, the
      # stop embeds the panorama (Maps Embed API, no charge).
      NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      # Geocoder for the stop editor (same as ArtDirect).
      PHOTON_URL: ${PHOTON_URL:-https://photon.komoot.io}
    volumes:
      - .:/app
      - /app/apps/elktours/.next
    ports:
      - "3021:3021"
    command: sh -c "cd apps/elktours && { [ -f .next/server/pages-manifest.json ] || NEXT_BUILD_CPUS=4 pnpm build; } && pnpm docker:start"
    networks:
      - eac-network
      - nextcloud-network

  # Silex 3.9 - browser-based visual site builder (opt-in custom layout per org).
  # Built from silexlabs/silex-platform:3.9.0 (the current canonical image;
  # `silexlabs/silex` is a deprecated Autobuild name frozen at 3.7.0) with our
  # deploy-config override baked in. See packages/silex/Dockerfile +
  # SILEX_3.9_UPGRADE_BRIEF.md. Editor is root-mounted at http://localhost:6805;
  # arts-collective owns /edit/{slug} as the authenticated launch gate and nginx
  # should expose Silex on a dedicated editor origin (it owns /api, /silex.js, …).
  silex:
    build:
      context: .
      dockerfile: packages/silex/Dockerfile
    container_name: eac-silex
    environment:
      SILEX_URL: ${SILEX_PUBLIC_URL:-http://localhost:6805}
      SILEX_PORT: 6805
      SILEX_SESSION_SECRET: ${SILEX_SESSION_SECRET:?set SILEX_SESSION_SECRET in .env}
      SILEX_BRIDGE_SECRET: ${SILEX_BRIDGE_SECRET:?set SILEX_BRIDGE_SECRET in .env — it gates /api/silex/auth}
      # Server plugin (Nextcloud storage/hosting + one-time token bridge) and
      # client plugin (editor blocks/templates). Bind-mounted so they can be
      # iterated without an image rebuild.
      SILEX_SERVER_CONFIG: /silex/extensions/silex-nextcloud-connector/index.js
      SILEX_CLIENT_CONFIG: /silex/extensions/silex-nextcloud-connector/src/client-config.js
      # Where the connector redeems one-time editor tokens (see src/auth.js).
      ARTS_INTERNAL_URL: ${ARTS_INTERNAL_URL:-http://arts-collective:3007}
    volumes:
      - ./packages/silex-nextcloud-connector:/silex/extensions/silex-nextcloud-connector:ro
      # The live-component catalogue, so the editor's block panel is built from
      # the same list the renderer reads (served at /eac-components.json).
      - ./packages/silex-render/src/components.data.json:/silex/extensions/eac-components.json:ro
    ports:
      - "6805:6805"
    restart: unless-stopped
    networks:
      - eac-network
      - nextcloud-network

  # ── Photon: self-hosted places-autocomplete geocoder (OpenStreetMap) ────────
  # Powers the artist-directory location search (city / neighbourhood / region /
  # postal code) without Google or any external API.
  #
  # NOTE: first `up` downloads a prebuilt OSM search index for REGION — multi-GB
  # (a country is a few GB; the planet is ~75GB+). It is therefore behind a
  # compose profile so it does NOT start with the normal stack. Bring it up
  # explicitly once, then point the app at it:
  #   docker compose --profile geo up -d photon
  #   (arts-collective) GEO_PROVIDER=photon  PHOTON_URL=http://photon:2322
  # Host access for local `next dev`: http://localhost:2322
  photon:
    image: rtuszik/photon-docker:latest
    container_name: eac-photon
    profiles: ["geo"]
    environment:
      # Country/region extract to index, e.g. "ca" (Canada), "us", or "planet".
      REGION: ${PHOTON_REGION:-ca}
      UPDATE_STRATEGY: PARALLEL
    volumes:
      - photon_data:/photon/photon_data
    ports:
      - "2322:2322"
    restart: unless-stopped
    networks:
      - eac-network

volumes:
  postgres_data:
  redis_data:
  photon_data:
  video-work:
  reel-work:
  obs-home:
  obs-recordings:
  relay-data:

networks:
  eac-network:
    driver: bridge
  nextcloud-network:
    external: true
    name: nextcloud-network
