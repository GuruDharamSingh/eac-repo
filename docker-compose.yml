  # Arts Collective – User/Artist network subdomains
  arts-collective:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: eac-arts-network
    restart: unless-stopped
    # 1GB V8 heap + ~700MB of Node/Turbopack native overhead observed at
    # rest, so 2g sat at 86% on a freshly-started container.
    #
    # Bumped 3g → 5g (2026-09-05): the org subdomain grew from one page to
    # four (offering / profile / community / workshop workspace) and Next's
    # dev server started logging "approaching the used memory threshold,
    # restarting..." mid-session while compiling them on demand. Same class
    # of OOM, and same fix, as the artdirect bump below.
    mem_limit: 5g
    depends_on:
      postgres:
        condition: service_healthy
      supabase-auth:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-elkdonis_dev}
      NEXT_PUBLIC_APP_URL: ${ARTS_COLLECTIVE_URL:-http://localhost:3007}
      # The network's own host (no scheme). Org subdomains hang off it, and the
      # middleware treats it as the root; NEXT_PUBLIC_ so middleware, server and
      # client code all see the same value.
      NEXT_PUBLIC_NETWORK_HOST: ${NETWORK_HOST:-localhost:3007}
      NEXT_PUBLIC_ARTDIRECT_URL: ${ARTDIRECT_URL:-http://localhost:3013}
      NEXT_PUBLIC_ART_AUCTION_URL: ${ART_AUCTION_URL:-}
      NODE_ENV: development
      # V8 sizes its heap from HOST RAM when unset — on this 60GB box that
      # is a 4.1GB limit per dev server, so six of them can exhaust the
      # machine before any one of them collects. Cap it instead.
      NODE_OPTIONS: --max-old-space-size=1024
      # Supabase Auth
      SUPABASE_URL: http://supabase-auth:9999
      NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_URL:-http://localhost:9999}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxvY2FsIiwicm9sZSI6ImFub24iLCJpYXQiOjE2MDMxMTI5NDksImV4cCI6MTkxODY4ODk0OX0.vCiIxe5m9r7dLh3fh8MkV0b_3NwGZHZB2bXrGEaJhs8}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxvY2FsIiwicm9sZSI6ImFub24iLCJpYXQiOjE2MDMxMTI5NDksImV4cCI6MTkxODY4ODk0OX0.vCiIxe5m9r7dLh3fh8MkV0b_3NwGZHZB2bXrGEaJhs8}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY:?set SUPABASE_SERVICE_KEY in .env — it is the service-role key}
      # Redis
      REDIS_URL: redis://redis:6379
      # Nextcloud — arts-collective is on nextcloud-network (not nextcloud-aio),
      # so it uses the public URL for WebDAV rather than the internal AIO hostname.
      NEXTCLOUD_URL: ${NEXTCLOUD_PUBLIC_URL:-https://cloud.elkdonis-arts.org}
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD}
      NEXT_PUBLIC_NEXTCLOUD_URL: ${NEXT_PUBLIC_NEXTCLOUD_URL}
      # Optional browser-reachable Silex editor origin for /edit/{slug} launch.
      # In prod this should be the reverse-proxied editor origin, e.g.
      # https://edit.example.com. If unset, dev falls back to port 6805.
      SILEX_EDITOR_PUBLIC_URL: ${SILEX_EDITOR_PUBLIC_URL:-}
      SILEX_PUBLIC_URL: ${SILEX_PUBLIC_URL:-}
      # JWT shared secret for inter-app SSO bridge (Talk room join, etc.),
      # and the wider set: the network's site-to-site session handoff
      # (packages/auth-server/src/handoff.ts) needs to know which origins
      # it may accept a token FROM. Without this, arts-collective — the
      # network host every handoff bounces through — refused every other
      # site's token as an "unknown issuer" even though the token itself
      # was valid, because this was the one service missing the list.
      INTER_APP_JWT_SECRET: ${INTER_APP_JWT_SECRET:?set INTER_APP_JWT_SECRET in .env — it signs the network session handoff}
      ADDITIONAL_REDIRECT_URLS: ${ADDITIONAL_REDIRECT_URLS:-}
    volumes:
      - .:/app
      - /app/apps/arts-collective/.next
    ports:
      - "3007:3007"
    command: sh -c "cd apps/arts-collective && pnpm dev"
    networks:
      - eac-network
      - nextcloud-network

