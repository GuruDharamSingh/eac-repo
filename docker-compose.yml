    # so a crash-restart is seconds, not a multi-minute rebuild.
    #
    # Third sentinel, and the reason for each: BUILD_ID failed because
    # `next dev` writes one too. prerender-manifest.json then failed because it
    # lands BEFORE page collection — an OOM-killed build (31 workers on a
    # 32-core host, capped container) left it present with no .next/server
