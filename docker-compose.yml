  # Video pipelines (migration 147) — watches each org's Nextcloud drop
  # folders, auto-edits the recordings (dead air trimmed, loudness evened,
  # intro/outro joined) and puts the result back in the folder. Only this
  # container has ffmpeg; the apps just read video_jobs. Capped at 8 CPUs so
  # a two-hour encode can't starve the sites sharing the box.
  video-worker:
    build:
      context: .
      dockerfile: docker/video-worker.Dockerfile
    image: eac-video-worker
    user: "${EAC_UID:-3003}:${EAC_GID:-3003}"
    container_name: eac-video-worker
    restart: unless-stopped
    cpus: 8
    mem_limit: 4g
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-elkdonis_dev}
      NEXTCLOUD_URL: ${NEXTCLOUD_URL:-http://nextcloud-nginx:80}
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD}
      VIDEO_WORK_DIR: /work
      VIDEO_SCAN_SECONDS: ${VIDEO_SCAN_SECONDS:-60}
      VIDEO_FFMPEG_THREADS: 8
      NODE_OPTIONS: --max-old-space-size=512
      # Decrypts user_connections tokens for YouTube uploads (services/connections.ts, migration 192).
      INTER_APP_JWT_SECRET: ${INTER_APP_JWT_SECRET}
      CONNECTIONS_KEY: ${CONNECTIONS_KEY:-}
      # Daily connection maintenance (services/connection-maintenance.ts): Meta token refresh and reconnect mail.
      NEXT_PUBLIC_NETWORK_HOST: ${NEXT_PUBLIC_NETWORK_HOST:-arts-collective.com}
      META_APP_ID: ${META_APP_ID:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
      META_GRAPH_VERSION: ${META_GRAPH_VERSION:-v21.0}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
    volumes:
      - .:/app
      # Scratch for downloads and encodes — recordings are gigabytes, so not
      # the container's own layer.
      - video-work:/work
    working_dir: /app/packages/services
    command: node_modules/.bin/tsx scripts/video-worker.mts
    networks:
      - eac-network
      - nextcloud-network

  # The auction clock (2026-10-18): opens, closes and settles auction lots on
  # time and releases unpaid auction orders. Same monorepo image as the apps;
  # one small loop in packages/commerce/scripts/auction-clock.mts.
  auction-clock:
    image: eac-dev
    user: "${EAC_UID:-3003}:${EAC_GID:-3003}"
    container_name: eac-auction-clock
    restart: unless-stopped
    cpus: 1
    mem_limit: 512m
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-elkdonis_dev}
      NEXT_PUBLIC_ART_AUCTION_URL: ${ART_AUCTION_URL:-https://market.arts-collective.com}
      AUCTION_CLOCK_SECONDS: ${AUCTION_CLOCK_SECONDS:-30}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      NODE_OPTIONS: --max-old-space-size=256
    volumes:
      - .:/app
    working_dir: /app/packages/services
    command: node_modules/.bin/tsx ../commerce/scripts/auction-clock.mts
    networks:
      - eac-network

  # Stream chat (2026-11-01, migration 228): follows the chat of each ticked
  # stream destination that names a channel (Twitch: anonymous IRC, read
  # only) and writes messages to stream_chat_messages for the Studio's Chat
  # panel; keeps 30 days. packages/services/scripts/stream-chat.mts.
  stream-chat:
    image: eac-dev
    user: "${EAC_UID:-3003}:${EAC_GID:-3003}"
    container_name: eac-stream-chat
    restart: unless-stopped
    cpus: 0.5
    mem_limit: 256m
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-elkdonis_dev}
      STREAM_CHAT_SCAN_SECONDS: ${STREAM_CHAT_SCAN_SECONDS:-15}
      # YouTube chat: at most one chat read per this many seconds (5 quota units each).
      STREAM_CHAT_YOUTUBE_SECONDS: ${STREAM_CHAT_YOUTUBE_SECONDS:-10}
      # Decrypt user_connections tokens to read YouTube chat (services/connections.ts).
      INTER_APP_JWT_SECRET: ${INTER_APP_JWT_SECRET}
      CONNECTIONS_KEY: ${CONNECTIONS_KEY:-}
      NODE_OPTIONS: --max-old-space-size=160
    volumes:
      - .:/app
    working_dir: /app/packages/services
    command: node_modules/.bin/tsx scripts/stream-chat.mts
    networks:
      - eac-network

  # Reel renderer (Remotion). Polls reel_renders (migration 189) for the
  # Studio's /studio/video jobs. Folder renders by hand:
  #   docker compose run --rm reel-render --project "EAC_Network/<org>/Private/Video/Reels/<name>" [--init]
  # Debian image with its own renderer install (docker/reel-render.Dockerfile);
  # templates come from the bind-mounted packages/reels (restart to pick up edits).
  # Server-side OBS Studio: one shared instance on a headless display.
  # Controlled from arts-collective /studio/broadcast through the agent on
  # :4456 (eac-network only). The full OBS window is noVNC on
  # 127.0.0.1:6080 (ssh -L 6080:127.0.0.1:6080, then /vnc.html; no password
  # since 2026-10-28, OBS_VNC_PASSWORD is unused). /dev/dri: the AMD iGPU,
  # for rendering (headless sway) and VA-API encoding.
  obs:
    build:
      context: docker/obs
    image: eac-obs
    container_name: eac-obs
    restart: unless-stopped
    user: "${EAC_UID:-3003}:${EAC_GID:-3003}"
    group_add: ["107", "44"]
    devices:
      - /dev/dri:/dev/dri
    cpus: 8
    mem_limit: 6g
    shm_size: 1g
    environment:
      OBS_WEBSOCKET_PASSWORD: ${OBS_WEBSOCKET_PASSWORD:?set OBS_WEBSOCKET_PASSWORD in .env}
      OBS_AGENT_SECRET: ${OBS_AGENT_SECRET:?set OBS_AGENT_SECRET in .env}
      OBS_VNC_PASSWORD: ${OBS_VNC_PASSWORD:-}
      # auto = VA-API on the iGPU when present, else x264; x264 forces the CPU.
      OBS_ENCODER: ${OBS_ENCODER:-auto}
      # OBS publishes the program to the relay and reads feeds from it as user "obs".
      RELAY_OBS_PASS: ${RELAY_OBS_PASS:-}
      NEXTCLOUD_URL: ${NEXTCLOUD_URL:-http://nextcloud-nginx:80}
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD}
    volumes:
      - ./docker/obs/agent.mjs:/opt/obs-agent/agent.mjs:ro
      # The overlay page (agent.mjs serves it to OBS's "Overlays" source).
      - ./docker/obs/overlay:/opt/obs-overlay:ro
      - obs-home:/home/obs
      - obs-recordings:/recordings
    ports:
      # The booth door (agent.mjs): noVNC files, and desktop/audio/program
      # streams that each need a one-time token. The edge sends
      # arts-collective.com/obs/ here.
      - "4458:4458"
    networks:
      - eac-network
      - nextcloud-network

  # Stream relay: MediaMTX + ffmpeg fan-out + agent (docker/relay/). OBS
  # publishes once to rtmp://relay:1935/program; the agent copies it (no
  # encode) to every destination armed from the Go live card. Feeds in
  # publish to rtmp://relay:1935/in/<key>. RTMP 1935 is published on
  # RELAY_RTMP_BIND, 127.0.0.1 by default (closed to the outside). To take
  # feeds from the internet (Zoom): RELAY_RTMP_BIND=0.0.0.0 in .env, the
  # router forwarding WAN 1935 to this host, `docker compose up -d relay`;
  # set it back to close. Agent bind-mounted: restart after editing.
  relay:
    build:
      context: docker/relay
    image: eac-relay
    container_name: eac-relay
    restart: unless-stopped
    user: "${EAC_UID:-3003}:${EAC_GID:-3003}"
    cpus: 2
    mem_limit: 1g
    environment:
      RELAY_AGENT_SECRET: ${RELAY_AGENT_SECRET:?set RELAY_AGENT_SECRET in .env}
      RELAY_OBS_PASS: ${RELAY_OBS_PASS:?set RELAY_OBS_PASS in .env}
      # WHIP guest cameras (docker/relay/start.sh): public host(s) for ICE
      # candidates, optional TURN (coturn shared secret), TCP ICE on 8189.
      RELAY_WEBRTC_HOSTS: ${RELAY_WEBRTC_HOSTS:-}
      RELAY_TURN_URL: ${RELAY_TURN_URL:-}
      RELAY_TURN_SECRET: ${RELAY_TURN_SECRET:-}
      RELAY_WEBRTC_TCP: ${RELAY_WEBRTC_TCP:-}
    volumes:
      - ./docker/relay/agent.mjs:/opt/relay-agent/agent.mjs:ro
      - relay-data:/data
    ports:
      - "${RELAY_RTMP_BIND:-127.0.0.1}:1935:1935"
      # WHIP over HTTP (NPM location /relay/ -> 192.168.0.11:8889) and ICE.
      - "${RELAY_WEBRTC_BIND:-127.0.0.1}:8889:8889"
      - "${RELAY_WEBRTC_BIND:-127.0.0.1}:8189:8189/udp"
      - "${RELAY_WEBRTC_BIND:-127.0.0.1}:8189:8189/tcp"
    networks:
      - eac-network

  reel-render:
    build:
      context: .
      dockerfile: docker/reel-render.Dockerfile
    image: eac-reel-render
    container_name: eac-reel-render
    restart: unless-stopped
    user: "${EAC_UID:-3003}:${EAC_GID:-3003}"
    cpus: 8
    mem_limit: 6g
    shm_size: 1g
    depends_on:
      postgres:
        condition: service_healthy
    command: ["--worker"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-elkdonis_dev}
      NEXTCLOUD_URL: ${NEXTCLOUD_URL:-http://nextcloud-nginx:80}
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD}
      REEL_WORK_DIR: /work
      REEL_CONCURRENCY: 4
    volumes:
      - .:/app
      - reel-work:/work
    working_dir: /opt/reel
    entrypoint: ["node", "/app/packages/reels/render/render.mjs"]
    networks:
      - eac-network
      - nextcloud-network

  # Pigeonshoot — Toronto street pigeons, crowdsourced as trading cards
  pigeonshoot:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    image: eac-dev
    user: "${EAC_UID:-3003}:${EAC_GID:-3003}"
    container_name: eac-pigeonshoot
    restart: unless-stopped
    # 1GB V8 heap + ~700MB of Node/Turbopack native overhead observed at
    # rest, so 2g sat at 86% on a freshly-started container. 3g leaves
    # real headroom while still bounding a runaway to one service.
    mem_limit: 3g
    depends_on:
      postgres:
        condition: service_healthy
      supabase-auth:
        condition: service_started
    environment:
      # GoTrue signing secret: auth-server verifies the session cookie with it
      # (verify-session.ts). Without it every check costs a GoTrue round trip.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env — it signs every GoTrue session}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-elkdonis_dev}
      NEXT_PUBLIC_APP_URL: ${PIGEONSHOOT_URL:-http://localhost:3014}
      NODE_ENV: development
      # V8 sizes its heap from HOST RAM when unset — on this 60GB box that
      # is a 4.1GB limit per dev server, so six of them can exhaust the
      # machine before any one of them collects. Cap it instead.
      NODE_OPTIONS: --max-old-space-size=1024
      # Supabase Auth
      SUPABASE_URL: http://supabase-auth:9999
      NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_URL:-http://localhost:9999}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxvY2FsIiwicm9sZSI6ImFub24iLCJpYXQiOjE2MDMxMTI5NDksImV4cCI6MTkxODY4ODk0OX0.vCiIxe5m9r7dLh3fh8MkV0b_3NwGZHZB2bXrGEaJhs8}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxvY2FsIiwicm9sZSI6ImFub24iLCJpYXQiOjE2MDMxMTI5NDksImV4cCI6MTkxODY4ODk0OX0.vCiIxe5m9r7dLh3fh8MkV0b_3NwGZHZB2bXrGEaJhs8}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY:?set SUPABASE_SERVICE_KEY in .env — it is the service-role key}
      # Nextcloud — REQUIRED. Every photo on this site lives there, and the
      # WebDAV auth header in packages/services/src/nextcloud.ts is built at
      # module load: missing credentials produce silent 401s on upload rather
      # than a startup error.
      NEXTCLOUD_URL: ${NEXTCLOUD_URL:-http://nextcloud-nginx:80}
      NEXTCLOUD_PUBLIC_URL: ${NEXTCLOUD_PUBLIC_URL:-http://localhost:8080}
      NEXT_PUBLIC_NEXTCLOUD_URL: ${NEXT_PUBLIC_NEXTCLOUD_URL:-http://localhost:8080}
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD}
      # Signs the anonymous contributor cookie (src/lib/guest.ts). An unsigned
      # guest id would be a trivial rate-limit bypass and would let anyone
      # claim someone else's cards.
      INTER_APP_JWT_SECRET: ${INTER_APP_JWT_SECRET:?set INTER_APP_JWT_SECRET in .env — it signs the network session handoff}
      # Owner config
      PIGEONSHOOT_OWNER_EMAIL: ${PIGEONSHOOT_OWNER_EMAIL:-justin.gillisb@gmail.com}
      # SendGrid
      SENDGRID_API_KEY: ${SENDGRID_API_KEY}
      EMAIL_AUTHENTICATED_DOMAINS: ${EMAIL_AUTHENTICATED_DOMAINS:-}
      EMAIL_FROM: ${EMAIL_FROM:-info@em6860.elkdonis-arts.org}
    volumes:
      - .:/app
      - /app/apps/pigeonshoot/.next
    ports:
      - "3014:3014"
    # `pnpm install` first: this app adds sharp, exifr and leaflet, and the
    # bind mount above shadows the image's node_modules. Installing in the
    # container also links sharp's musl binary rather than the host's glibc one.
    command: sh -c "cd apps/pigeonshoot && pnpm docker:dev"
    networks:
      - eac-network
      - nextcloud-network

  # Elastrocal — natal charts (org: elastrocal). Engine: @elkdonis/astro on
  # sweph, a native addon compiled during `pnpm install` (the Dockerfile's base
  # stage carries the toolchain for it).
  elastrocal:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    image: eac-dev
    user: "${EAC_UID:-3003}:${EAC_GID:-3003}"
    container_name: eac-elastrocal
    restart: unless-stopped
    mem_limit: 3g
    depends_on:
      postgres:
        condition: service_healthy
      supabase-auth:
        condition: service_started
    environment:
      # GoTrue signing secret: auth-server verifies the session cookie with it
      # (verify-session.ts). Without it every check costs a GoTrue round trip.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env — it signs every GoTrue session}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-elkdonis_dev}
      # Astro Studio helper AI (packages/astro-corpus); empty disables it.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_WORKSPACE_ID: ${ANTHROPIC_WORKSPACE_ID:-}
      NEXT_PUBLIC_APP_URL: ${ELASTROCAL_URL:-http://localhost:3016}
      # Stripe — card payment for service bookings (@elkdonis/checkout
      # startThreadCheckout, 2026-09-27). Orders are confirmed by art-auction's
      # webhook and this app's /api/checkout/return hop; no webhook here.
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      # Served under this prefix so it can sit inside arts-collective.com/astro.
      # Local access is therefore http://localhost:3016/astro (the bare root 404s).
      NEXT_PUBLIC_BASE_PATH: ${ELASTROCAL_BASE_PATH:-/astro}
      NODE_ENV: development
      NODE_OPTIONS: --max-old-space-size=1024
      # Supabase Auth
      SUPABASE_URL: http://supabase-auth:9999
      NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_URL:-http://localhost:9999}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxvY2FsIiwicm9sZSI6ImFub24iLCJpYXQiOjE2MDMxMTI5NDksImV4cCI6MTkxODY4ODk0OX0.vCiIxe5m9r7dLh3fh8MkV0b_3NwGZHZB2bXrGEaJhs8}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxvY2FsIiwicm9sZSI6ImFub24iLCJpYXQiOjE2MDMxMTI5NDksImV4cCI6MTkxODY4ODk0OX0.vCiIxe5m9r7dLh3fh8MkV0b_3NwGZHZB2bXrGEaJhs8}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY:?set SUPABASE_SERVICE_KEY in .env — it is the service-role key}
      # Swiss Ephemeris data files (packages/astro/ephe, committed). Without
      # them the engine falls back to the built-in Moshier model — see that
      # directory's README.
      SWISSEPH_PATH: ${SWISSEPH_PATH:-/app/packages/astro/ephe}
      # Nextcloud for the app media uploads (Jerusalem media, /api/mobile/v1/media), as arts-collective:
      # the public URL, since this container is not on the nextcloud-aio network.
      NEXTCLOUD_URL: ${NEXTCLOUD_PUBLIC_URL:-https://cloud.elkdonis-arts.org}
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD}
      # Signs the guest cookie (src/lib/guest.ts): charts kept without an account.
      INTER_APP_JWT_SECRET: ${INTER_APP_JWT_SECRET:?set INTER_APP_JWT_SECRET in .env — it signs the network session handoff}
    volumes:
      - .:/app
      - /app/apps/elastrocal/.next
    ports:
      - "3016:3016"
    # `pnpm install` first: the bind mount shadows the image's node_modules,
    # and installing here builds sweph's musl binary rather than using a glibc one.
    command: sh -c "cd apps/elastrocal && pnpm docker:dev"
    networks:
      - eac-network

  # IFAC - International Fine Art Collectors public site and org admin
  ifac:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    image: eac-dev
    user: "${EAC_UID:-3003}:${EAC_GID:-3003}"
    container_name: eac-ifac
    restart: unless-stopped
    # ifac serves a live public domain. It OOM'd against a 3g cap with a
    # 1GB JS heap, so the overhead is Turbopack native + file watching,
    # not JS. Give the one public site room; dev-only apps keep 3g.
    #
    # Switched to production mode (2026-09-12): ifac was running `next dev`
    # against live traffic. In dev mode, CSS isn't emitted as prebuilt <link>
    # tags — it's injected as each route's chunk compiles on demand, so a
    # cold route (first client nav to /artists, or /hub right after login)
    # could paint before its CSS finished compiling, rendering unstyled until
    # a refresh hit the now-warm module. `next start` serves prebuilt static
    # CSS, which structurally can't race like that. Same shape as
    # amrit-canada/inner-gathering below.
    mem_limit: 5g
    depends_on:
      postgres:
        condition: service_healthy
      supabase-auth:
        condition: service_started
    environment:
      # GoTrue signing secret: auth-server verifies the session cookie with it
      # (verify-session.ts). Without it every check costs a GoTrue round trip.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env — it signs every GoTrue session}
      # Cloudflare Turnstile (2026-11-06): the site key is baked in at build time;
      # the secret makes /api/auth/signup require a token. Set both or neither.
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-elkdonis_dev}
      NEXT_PUBLIC_APP_URL: ${IFAC_URL:-http://localhost:3008}
      # Stripe — IFAC takes no money itself; its artists connect the network's
      # one Stripe account from the profile popup's Payouts tab, and the
      # marketplace settles through it. The key is read only to know whether
      # to offer the control and to start Express onboarding.
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      # The marketplace — a member's store section links there
      NEXT_PUBLIC_ART_AUCTION_URL: ${ART_AUCTION_URL:-http://localhost:3009}
      NODE_ENV: production
      PORT: 3008
      # V8 sizes its heap from HOST RAM when unset — on this 60GB box that
      # is a 4.1GB limit per dev server, so six of them can exhaust the
      # machine before any one of them collects. Cap it instead.
      NODE_OPTIONS: --max-old-space-size=1024
      SUPABASE_URL: http://supabase-auth:9999
      NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_URL:-http://localhost:9999}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxvY2FsIiwicm9sZSI6ImFub24iLCJpYXQiOjE2MDMxMTI5NDksImV4cCI6MTkxODY4ODk0OX0.vCiIxe5m9r7dLh3fh8MkV0b_3NwGZHZB2bXrGEaJhs8}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxvY2FsIiwicm9sZSI6ImFub24iLCJpYXQiOjE2MDMxMTI5NDksImV4cCI6MTkxODY4ODk0OX0.vCiIxe5m9r7dLh3fh8MkV0b_3NwGZHZB2bXrGEaJhs8}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY:?set SUPABASE_SERVICE_KEY in .env — it is the service-role key}
      NEXT_PUBLIC_IFAC_OWNER_EMAIL: ${IFAC_OWNER_EMAIL:-info@ifacgroup.com}
      NEXT_PUBLIC_EAC_ADMIN_URL: ${EAC_ADMIN_URL:-http://localhost:3000}
      NEXT_PUBLIC_ARTDIRECT_URL: ${ARTDIRECT_URL:-http://localhost:3013}
      # The network's SSO hop (packages/auth-server/src/handoff.ts): the
      # inter-app signing secret and the origins a handoff may target.
      INTER_APP_JWT_SECRET: ${INTER_APP_JWT_SECRET}
      CONNECTIONS_KEY: ${CONNECTIONS_KEY:-}
      NEXT_PUBLIC_NETWORK_HOST: ${NEXT_PUBLIC_NETWORK_HOST:-arts-collective.com}
      ADDITIONAL_REDIRECT_URLS: ${ADDITIONAL_REDIRECT_URLS:-}
      REDIS_URL: redis://redis:6379
      # SendGrid
      SENDGRID_API_KEY: ${SENDGRID_API_KEY}
      EMAIL_AUTHENTICATED_DOMAINS: ${EMAIL_AUTHENTICATED_DOMAINS:-}
      EMAIL_FROM: ${EMAIL_FROM:-info@em6860.elkdonis-arts.org}
      # The host every org's inbound reply address sits on. Read server-side by
      # packages/email `inboundEnabled()`, which gates the email suite's Inbox
      # tab — UNSET means the tab renders "no inbound address is configured"
      # even though mail is arriving and visible under Activity. It used to go
      # only to arts-collective (which receives the webhook), but every app
      # that RENDERS the suite needs it too.
      EMAIL_INBOUND_DOMAIN: ${EMAIL_INBOUND_DOMAIN:-}
      # Nextcloud (external stack via shared network) — member media storage
      NEXTCLOUD_URL: ${NEXTCLOUD_URL:-http://nextcloud-nginx:80}
      NEXTCLOUD_PUBLIC_URL: ${NEXTCLOUD_PUBLIC_URL:-http://localhost:8080}
      NEXT_PUBLIC_NEXTCLOUD_URL: ${NEXT_PUBLIC_NEXTCLOUD_URL:-http://localhost:8080}
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD}
    volumes:
      - .:/app
      - /app/apps/ifac/.next
    ports:
      - "3008:3008"
    # Build only when there is no build to serve, then start — matches
    # amrit-canada/inner-gathering's pattern above. server/pages-manifest.json
    # is the file `next start` actually opens, and only a completed build
    # writes it (BUILD_ID and prerender-manifest.json both land too early and
    # can strand a restart loop behind an OOM-killed build). NEXT_BUILD_CPUS
    # caps workers so the build fits under mem_limit instead of being killed.
    # Guard tests BOTH files. pages-manifest.json is written during COMPILE,
    # before type-checking, so a build that compiles then fails tsc leaves it
    # behind with no BUILD_ID — the guard then skips the rebuild forever and
    # `next start` dies on "Could not find a production build". BUILD_ID alone
    # false-positives because `next dev` writes one too. (Hit on apps/sunjay,
    # 2026-09-19.)
    command: sh -c "cd apps/ifac && { [ -f .next/BUILD_ID ] && [ -f .next/server/pages-manifest.json ] || NEXT_BUILD_CPUS=4 pnpm build; } && pnpm docker:start"
    networks:
      - eac-network
      - nextcloud-network

