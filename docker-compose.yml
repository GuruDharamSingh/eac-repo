  # Arts Collective – User/Artist network subdomains
  arts-collective:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    image: eac-dev
    user: "${EAC_UID:-3003}:${EAC_GID:-3003}"
    container_name: eac-arts-network
    restart: unless-stopped
    # 1GB V8 heap + ~700MB of Node/Turbopack native overhead observed at
    # rest, so 2g sat at 86% on a freshly-started container.
    #
    # Bumped 3g → 5g (2026-09-05): the org subdomain grew from one page to
    # four (offering / profile / community / workshop workspace) and Next's
    # dev server started logging "approaching the used memory threshold,
    # restarting..." mid-session while compiling them on demand. Same class
    # of OOM, and same fix, as the artdirect bump below.
    mem_limit: 5g
    depends_on:
      postgres:
        condition: service_healthy
      supabase-auth:
        condition: service_started
    environment:
      # GoTrue signing secret: auth-server verifies the session cookie with it
      # (verify-session.ts). Without it every check costs a GoTrue round trip.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env — it signs every GoTrue session}
      # Cloudflare Turnstile (2026-11-06): the site key is baked in at build time;
      # the secret makes /api/auth/signup require a token. Set both or neither.
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-elkdonis_dev}
      NEXT_PUBLIC_APP_URL: ${ARTS_COLLECTIVE_URL:-http://localhost:3007}
      # The network's own host (no scheme). Org subdomains hang off it, and the
      # middleware treats it as the root; NEXT_PUBLIC_ so middleware, server and
      # client code all see the same value.
      NEXT_PUBLIC_NETWORK_HOST: ${NETWORK_HOST:-localhost:3007}
      NEXT_PUBLIC_ARTDIRECT_URL: ${ARTDIRECT_URL:-http://localhost:3013}
      # Sophia (the LMS). The hub shows its course button only while this answers.
      NEXT_PUBLIC_SOPHIA_URL: ${SOPHIA_URL:-}
      NEXT_PUBLIC_ART_AUCTION_URL: ${ART_AUCTION_URL:-}
      # Email — arts-collective hosts the network's email suite at /hub/email
      # and BOTH SendGrid webhooks (/api/email/inbound, /api/email/events),
      # because Inbound Parse allows one endpoint per MX host and the hub is
      # the one app that already serves every organisation.
      SENDGRID_API_KEY: ${SENDGRID_API_KEY}
      # The collective's Google client for YouTube connections (2026-11-01).
      YOUTUBE_CLIENT_ID: ${YOUTUBE_CLIENT_ID:-}
      YOUTUBE_CLIENT_SECRET: ${YOUTUBE_CLIENT_SECRET:-}
      META_APP_ID: ${META_APP_ID}
      META_APP_SECRET: ${META_APP_SECRET}
      META_GRAPH_VERSION: ${META_GRAPH_VERSION:-v21.0}
      META_LOGIN_CONFIG_ID: ${META_LOGIN_CONFIG_ID:-}
      # Studio sound effects: Freesound CC0 search/import (packages/services/src/reels.ts); empty = off.
      FREESOUND_API_KEY: ${FREESOUND_API_KEY:-}
      THREADS_APP_ID: ${THREADS_APP_ID}
      THREADS_APP_SECRET: ${THREADS_APP_SECRET}
      INSTAGRAM_APP_ID: ${INSTAGRAM_APP_ID}
      INSTAGRAM_APP_SECRET: ${INSTAGRAM_APP_SECRET}
      META_WEBHOOK_VERIFY_TOKEN: ${META_WEBHOOK_VERIFY_TOKEN:-}
      EMAIL_FROM: ${EMAIL_FROM:-info@em6860.elkdonis-arts.org}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-}
      EMAIL_AUTHENTICATED_DOMAINS: ${EMAIL_AUTHENTICATED_DOMAINS:-}
      EMAIL_SANDBOX: ${EMAIL_SANDBOX:-}
      # Blank until inbound.elkdonis-arts.org has its MX record — see
      # .env.example. Unset, the Inbox tab says inbound isn't configured
      # rather than advertising an address that would bounce.
      EMAIL_INBOUND_DOMAIN: ${EMAIL_INBOUND_DOMAIN:-}
      SENDGRID_INBOUND_PUBLIC_KEY: ${SENDGRID_INBOUND_PUBLIC_KEY:-}
      SENDGRID_EVENT_PUBLIC_KEY: ${SENDGRID_EVENT_PUBLIC_KEY:-}
      # Production mode (2026-09-18). This was `next dev` against the live
      # arts-collective.com, the last of the public sites still on it.
      #
      # It stayed on dev because "the build was broken": every `next build`
      # died exporting Next's own /_global-error or /_not-found with
      # `Cannot read properties of null (reading 'useContext')`, ignore-listed
      # in every stack trace. The build was never broken. The builds were being
      # run INSIDE this container, which set NODE_ENV=development, so Next
      # built a production bundle against React's development runtime and its
      # static prerender of the built-in error pages hit a null dispatcher. The
      # four apps that built fine all already ran NODE_ENV=production. Setting
      # it here fixed the build outright — nothing in the app had to change.
      NODE_ENV: production
      # V8 sizes its heap from HOST RAM when unset — on this 60GB box that
      # is a 4.1GB limit per server, so several can exhaust the machine
      # before any one of them collects. Cap it instead.
      NODE_OPTIONS: --max-old-space-size=1024
      # Supabase Auth
      SUPABASE_URL: http://supabase-auth:9999
      NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_URL:-http://localhost:9999}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxvY2FsIiwicm9sZSI6ImFub24iLCJpYXQiOjE2MDMxMTI5NDksImV4cCI6MTkxODY4ODk0OX0.vCiIxe5m9r7dLh3fh8MkV0b_3NwGZHZB2bXrGEaJhs8}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxvY2FsIiwicm9sZSI6ImFub24iLCJpYXQiOjE2MDMxMTI5NDksImV4cCI6MTkxODY4ODk0OX0.vCiIxe5m9r7dLh3fh8MkV0b_3NwGZHZB2bXrGEaJhs8}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY:?set SUPABASE_SERVICE_KEY in .env — it is the service-role key}
      # Redis
      REDIS_URL: redis://redis:6379
      # Nextcloud — arts-collective is on nextcloud-network (not nextcloud-aio),
      # so it uses the public URL for WebDAV rather than the internal AIO hostname.
      NEXTCLOUD_URL: ${NEXTCLOUD_PUBLIC_URL:-https://cloud.elkdonis-arts.org}
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER}
