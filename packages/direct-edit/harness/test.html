<style>
:root{--paper:#ebe5d4;--ink:#1d1a16;--tab:#1c2024}
body{background:var(--paper);color:var(--ink);font:15px Georgia,serif;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:60px 80px}
#page{max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
#page header{display:flex;flex-direction:column;gap:8px}.rw{display:flex;flex-wrap:wrap;justify-content:space-between;gap:16px;border-bottom:1px solid var(--ink);padding-bottom:6px;font-size:11px;letter-spacing:.2em;text-transform:uppercase}
#page h1{font-size:clamp(38px,8vw,72px);margin:0;text-align:center;line-height:1.05;text-wrap:balance}#page nav{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 22px;font-size:13px;letter-spacing:.14em;text-transform:uppercase}#page nav a{color:inherit}
#band{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}.col{display:flex;flex-direction:column;gap:8px;border:1px solid var(--ink);padding:12px;min-width:0}
#page h2{font-size:13px;letter-spacing:.2em;text-transform:uppercase;margin:0;text-align:center;border-block:1px solid var(--ink);padding:4px 0}.col p{margin:0;line-height:1.4}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.gal i{display:block;height:64px;background:#b6b0a7}.gal i:nth-child(2n){background:#8f8a80}
.tt-tabs{position:fixed;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:2147483002;display:flex;gap:4px;padding:4px;background:var(--tab);border-radius:8px;font:13px system-ui,sans-serif}
.tt-tabs button{font:inherit;color:#fff;background:none;border:0;border-radius:5px;padding:5px 10px;cursor:pointer}.tt-tabs button[aria-pressed=true]{background:#0a7ea4}.tt-tabs button:focus-visible{outline:2px solid #fff}
#tt-acts{position:fixed;left:max(12px,env(safe-area-inset-left,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:2147483002;display:flex;gap:4px;padding:4px;background:var(--tab);border-radius:8px;font:13px system-ui,sans-serif}
#tt-acts[hidden]{display:none}
#tt-acts button{font:inherit;color:#fff;background:none;border:0;border-radius:5px;padding:5px 10px;cursor:pointer}#tt-acts button:focus-visible{outline:2px solid #fff}
@media (max-width:720px){.tt-tabs{left:max(12px,env(safe-area-inset-left,0px));flex-wrap:wrap;justify-content:flex-end}#tt-acts{bottom:calc(112px + env(safe-area-inset-bottom,0px))}}
.tt-try{margin:0 0 -28px;padding:10px 14px;background:#fff3c4;border:1px solid #d9b84a;border-radius:8px;font:14px/1.4 system-ui,sans-serif;color:#2b2410}
.tt-tree{min-height:100vh;padding-top:44px;margin-inline:calc(-1 * max(16px, env(safe-area-inset-left, 0px)))}
.tt-blocks{padding-inline:16px}
/* The tabs lie over the foot of the panel. This room lets its last row scroll clear of them. */
.de-vpanel .de-body::after{content:"";display:block;height:88px}
body.tt-land{padding:0}
