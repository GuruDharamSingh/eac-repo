<!--
  eac-br-nav.html
  ===============
  Masthead ribbon — a banner-shaped bar (notched ends) carrying a small
  crest/seal mark, the org name, and a primary CTA.
-->
<header class="eac-br-nav" data-gjs-type="eac-br-nav">
  <div class="eac-br-nav__ribbon">
    <div class="eac-br-nav__crest" aria-hidden="true">
      <span class="eac-br-nav__crest-mark">&#10022;</span>
    </div>
    <span class="eac-br-nav__name"
          data-gjs-editable="true"
          data-trait="orgName">
      Elkdonis Arts Collective
    </span>
    <nav class="eac-br-nav__links" aria-label="Primary">
      <a href="#about">About</a>
      <a href="#services">Offerings</a>
      <a href="#dispatch">Dispatches</a>
      <a href="#almanac">Calendar</a>
    </nav>
    <a class="eac-br-nav__cta"
       href="#almanac"
       data-trait="ctaLabel">
      Join us
    </a>
  </div>
</header>
