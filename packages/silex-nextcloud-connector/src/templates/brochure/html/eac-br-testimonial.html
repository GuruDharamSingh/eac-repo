<!--
  eac-br-testimonial.html
  =========================
  A single pull-quote beside a wax-seal ornament.
-->
<section class="eac-br-testimonial" data-gjs-type="eac-br-testimonial">
  <div class="eac-br-testimonial__inner">
    <div class="eac-br-seal" aria-hidden="true">
      <span>&#10047;</span>
    </div>
    <blockquote class="eac-br-testimonial__quote"
                data-gjs-editable="true"
                data-trait="quote">
      &ldquo;It felt less like attending an event and more like being let
      in on something already underway.&rdquo;
    </blockquote>
    <footer class="eac-br-testimonial__attr"
            data-gjs-editable="true"
            data-trait="attribution">
      A member, on their first visit
    </footer>
  </div>
</section>
