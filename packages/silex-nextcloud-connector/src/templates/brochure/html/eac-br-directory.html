<!--
  eac-br-directory.html
  =======================
  Officers / roster panel — the live directory embed, headed like a
  brochure's back-page committee list.
-->
<section class="eac-br-directory" data-gjs-type="eac-br-directory">
  <div class="eac-br-directory__inner">
    <p class="eac-br-label"
       data-gjs-editable="true"
       data-trait="eyebrowText">
      Who convenes here
    </p>
    <h2 class="eac-br-directory__title"
        data-gjs-editable="true"
        data-trait="title">
      Members published to this page
    </h2>
    <eac-embed data-eac-component="directory" data-title="Members" data-limit="8" data-variant="inline"><div class="eac-editor-placeholder"><strong>Members</strong><span>Live Arts component renders on the public site.</span></div></eac-embed>
  </div>
</section>
