<!--
  eac-br-cta.html
  ================
  Ticket-stub call to action: an "information" half and a perforated
  "stub" half, the latter carrying the RSVP/inquiry CTA.
-->
<section class="eac-br-cta" data-gjs-type="eac-br-cta">
  <div class="eac-br-ticket">
    <div class="eac-br-ticket__info">
      <p class="eac-br-label"
         data-gjs-editable="true"
         data-trait="eyebrowText">
        Admit one
      </p>
      <h2 class="eac-br-ticket__title"
          data-gjs-editable="true"
          data-trait="title">
        Reserve your place
      </h2>
      <p class="eac-br-ticket__sub"
         data-gjs-editable="true"
         data-trait="subtitle">
        Space is limited and held on a first-arrived basis.
      </p>
    </div>
    <div class="eac-br-ticket__perforation" aria-hidden="true"></div>
    <div class="eac-br-ticket__stub">
      <eac-embed data-eac-component="inquiry" data-title="Send your inquiry" data-variant="inline"><div class="eac-editor-placeholder"><strong>Send your inquiry</strong><span>Live Arts component renders on the public site.</span></div></eac-embed>
    </div>
  </div>
</section>
