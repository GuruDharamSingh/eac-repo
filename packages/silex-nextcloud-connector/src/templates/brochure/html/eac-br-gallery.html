<!--
  eac-br-gallery.html
  ====================
  Torn-edge photograph frames, gently rotated for a hand-pasted feel.
  Use for workshop/session photos, or a single piece of art on an
  offering page (drop to one frame and enlarge via the style manager).
-->
<section class="eac-br-gallery" data-gjs-type="eac-br-gallery">
  <div class="eac-br-gallery__head">
    <p class="eac-br-label"
       data-gjs-editable="true"
       data-trait="eyebrowText">
      From the archive
    </p>
    <h2 class="eac-br-gallery__title"
        data-gjs-editable="true"
        data-trait="title">
      Images from past gatherings
    </h2>
  </div>
  <div class="eac-br-gallery__grid" data-trait="galleryItems">
    <figure class="eac-br-torn-frame eac-br-torn-frame--a">
      <img src="https://placehold.co/640x480/ece0c3/241c15?text=I" alt="Replace with your image" />
    </figure>
    <figure class="eac-br-torn-frame eac-br-torn-frame--b">
      <img src="https://placehold.co/640x480/e4d5ae/241c15?text=II" alt="Replace with your image" />
    </figure>
    <figure class="eac-br-torn-frame eac-br-torn-frame--c">
      <img src="https://placehold.co/640x480/ece0c3/241c15?text=III" alt="Replace with your image" />
    </figure>
  </div>
</section>
