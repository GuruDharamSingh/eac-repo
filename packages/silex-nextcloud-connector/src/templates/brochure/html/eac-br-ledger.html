<!--
  eac-br-ledger.html
  ===================
  Ledger / account-book panel. On an org-profile page this reads as
  impact figures; on an offering page it reads as the fact sheet
  (price, date, format, capacity). Rows use dotted leaders like a
  table of contents.
-->
<section class="eac-br-ledger" data-gjs-type="eac-br-ledger">
  <div class="eac-br-ledger__inner">
    <p class="eac-br-label"
       data-gjs-editable="true"
       data-trait="eyebrowText">
      By the numbers
    </p>
    <h2 class="eac-br-ledger__title"
        data-gjs-editable="true"
        data-trait="title">
      The particulars
    </h2>

    <div class="eac-br-leader">
      <span class="eac-br-leader__label" data-gjs-editable="true">Founded</span>
      <span class="eac-br-leader__fill" aria-hidden="true"></span>
      <span class="eac-br-leader__value" data-gjs-editable="true" data-trait="rowOneValue">2019</span>
    </div>
    <div class="eac-br-leader">
      <span class="eac-br-leader__label" data-gjs-editable="true">Sessions held</span>
      <span class="eac-br-leader__fill" aria-hidden="true"></span>
      <span class="eac-br-leader__value" data-gjs-editable="true" data-trait="rowTwoValue">124</span>
    </div>
    <div class="eac-br-leader">
      <span class="eac-br-leader__label" data-gjs-editable="true">Members in good standing</span>
      <span class="eac-br-leader__fill" aria-hidden="true"></span>
      <span class="eac-br-leader__value" data-gjs-editable="true" data-trait="rowThreeValue">86</span>
    </div>
    <div class="eac-br-leader">
      <span class="eac-br-leader__label" data-gjs-editable="true">Cities reached</span>
      <span class="eac-br-leader__fill" aria-hidden="true"></span>
      <span class="eac-br-leader__value" data-gjs-editable="true" data-trait="rowFourValue">9</span>
    </div>
  </div>
</section>
