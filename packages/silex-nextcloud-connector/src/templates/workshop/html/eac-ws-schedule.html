<!--
  eac-ws-schedule.html
  ======================
  Session-by-session schedule, one row per entry in the workshop's `sessions`
  array. The whole section is dropped when there are no sessions.

  The <ol> is the list container (data-trait="sessions"); its first <li> is the
  row template — the engine clones it once per session. Everything a designer
  needs to restyle a row lives here, not in a TypeScript string builder.

  CMS fields consumed (threads.sessions JSONB):
    sessions[].scheduled_at  → sessionWeekday / sessionDate / sessionTime
    sessions[].title         → sessionTitle
    sessions[].location      → sessionDesc
-->
<section class="eac-ws-schedule" data-gjs-type="eac-ws-schedule" id="schedule"
         data-trait="scheduleSection">
  <div class="eac-ws-schedule__inner">

    <span class="eac-ws-label eac-ws-label--schedule">schedule</span>

    <div class="eac-ws-schedule__header">
      <h2 class="eac-ws-schedule__heading">Session breakdown</h2>
      <a class="eac-ws-schedule__gate-cta" href="#register">
        Register to see full schedule
      </a>
    </div>

    <ol class="eac-ws-schedule__list" data-trait="sessions">

      <li class="eac-ws-schedule__item">
        <div class="eac-ws-schedule__date">
          <span class="eac-ws-schedule__day" data-trait="sessionWeekday">Sat</span>
          <span class="eac-ws-schedule__num" data-trait="sessionDate">Jan 11</span>
        </div>
        <div class="eac-ws-schedule__content">
          <h3 class="eac-ws-schedule__title" data-trait="sessionTitle">
            Opening circle — arriving in language
          </h3>
          <p class="eac-ws-schedule__desc" data-trait="sessionDesc">
            Warm-up prompts, group agreements, and free-writing to land in the room.
          </p>
        </div>
        <div class="eac-ws-schedule__time" data-trait="sessionTime">10:00 am</div>
      </li>

    </ol>
  </div>
</section>
