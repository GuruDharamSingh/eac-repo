<!--
  eac-ws-gallery.html
  =====================
  Past-session media grid. The whole section is dropped when there are neither
  images nor a promo video.

  The .eac-ws-gallery__grid is the list container (data-trait="galleryImages");
  its first .eac-ws-gallery__item is the tile template, cloned once per image.
  The first rendered tile gets the --featured modifier.

  CMS fields consumed (workshop_pages):
    gallery_image_urls[]  → { url, alt } per tile
    promo_video_url       → optional iframe
-->
<section class="eac-ws-gallery" data-gjs-type="eac-ws-gallery" id="gallery"
         data-trait="gallerySection">
  <div class="eac-ws-gallery__inner">

    <span class="eac-ws-label eac-ws-label--media">media</span>

    <h2 class="eac-ws-gallery__heading">From past sessions</h2>

    <div class="eac-ws-gallery__grid" data-trait="galleryImages">
      <div class="eac-ws-gallery__item">
        <img class="eac-ws-gallery__img" src="" alt="Workshop session photo"
             loading="lazy" data-trait="imgSrc">
      </div>
    </div>

    <!-- Optional video embed -->
    <div class="eac-ws-gallery__video" data-trait="promoVideo" hidden>
      <iframe
        class="eac-ws-gallery__iframe"
        src=""
        title="Workshop promo video"
        frameborder="0"
        allow="autoplay; fullscreen"
        allowfullscreen
        data-trait="promoVideoSrc">
      </iframe>
    </div>

  </div>
</section>
