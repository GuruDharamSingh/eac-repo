<section class="eac-dossier-identity eac-dos-section" data-gjs-type="eac-dossier-identity">
  <div class="eac-dos-stamp" data-trait="stampLabel" data-state="unclaimed">Unclaimed</div>
  <div class="eac-dos-header-block">
    <div class="eac-dos-profile-container">
      <img src="https://placehold.co/380x480/e9e2d2/5b5347?text=SUBJECT" alt="Subject" class="eac-dos-profile-pic" data-trait="photoUrl">
      <div class="eac-dos-profile-pic eac-dos-nophoto" data-trait="noPhoto">No photograph on file</div>
    </div>
    <div class="eac-dos-header-content">
      <span class="eac-dos-alias-kicker">Subject</span>
      <h1 class="eac-dos-alias" data-trait="aliasName">Marcus Vance</h1>
      <div class="eac-dos-form-row">
        <span class="eac-dos-label">Occupation</span>
        <span class="eac-dos-value" data-trait="occupation">Investigative photographer</span>
      </div>
      <div class="eac-dos-form-row">
        <span class="eac-dos-label">Location</span>
        <span class="eac-dos-value" data-trait="location">Chicago, IL</span>
      </div>
      <div class="eac-dos-form-row">
        <span class="eac-dos-label">File status</span>
        <span class="eac-dos-value" data-trait="fileStatus">Open — accepting contact</span>
      </div>
      <div class="eac-dos-bio" data-trait="bioBlock">
        <span class="eac-dos-bio-head">Notes</span>
        <div data-trait="bioNotes"><p>Subject documents urban decay and underground subcultures, working at night on 35mm film.</p></div>
      </div>
      <div class="eac-dos-actions" data-trait="contactBlock">
        <a href="#" class="eac-dos-btn" data-href-trait="contactHref">Make contact</a>
      </div>
    </div>
  </div>
</section>
