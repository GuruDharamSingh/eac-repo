<label class="eac-pen-fold" data-pen="fold-card" data-speed="normal" data-ratio="portrait">
  <input class="eac-pen-fold-toggle" type="checkbox" aria-label="Open card">
  <div class="eac-pen-fold-view eac-pen-fold-overview">
    <div class="eac-pen-fold-face">
      <img class="eac-pen-fold-face-img" src="https://placehold.co/800x800/efe9dd/5a5045?text=Portrait" alt="">
      <div class="eac-pen-fold-face-body">
        <p class="eac-kicker">Artist</p>
        <h3>Name</h3>
        <p class="eac-pen-fold-face-hint">Tap to open</p>
      </div>
    </div>
    <div class="eac-pen-fold-overlay"></div>
  </div>
  <div class="eac-pen-fold-view eac-pen-fold-details">
    <div class="eac-pen-fold-paper" style="--fold: 0">
      <div class="eac-pen-fold-anchor"></div>
      <div class="eac-pen-fold-paper" style="--fold: 3">
        <div class="eac-pen-fold-paper" style="--fold: 2">
          <div class="eac-pen-fold-paper" style="--fold: 1"></div>
        </div>
      </div>
    </div>
    <div class="eac-pen-fold-content">
      <div class="eac-pen-fold-content-inner">
        <img class="eac-pen-fold-content-img" src="https://placehold.co/800x800/efe9dd/5a5045?text=Portrait" alt="">
        <p class="eac-kicker">Artist</p>
        <h3>Name</h3>
        <p>A line or two about the practice, the studio, or what is on right now.</p>
        <div class="eac-pen-fold-actions">
          <a href="#" data-variant="solid">See the work</a>
          <a href="#">Get in touch</a>
          <a href="#">Follow</a>
        </div>
        <span class="eac-pen-fold-close">Tap anywhere else to fold away</span>
      </div>
    </div>
  </div>
</label>
