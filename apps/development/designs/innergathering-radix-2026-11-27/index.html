<!doctype html>
<html lang="en" data-scheme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elkdonis 9-step redraw</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap">
<style id="static-css">
/* Site fonts: the three faces apps/innergathering ships in public/fonts, referenced by relative path
   (they load when this file sits in the monorepo; otherwise the Google fallbacks below are used). */
@font-face{font-family:"Venture";src:url("fonts/Venture-nRqOR.otf") format("opentype");font-display:swap}
@font-face{font-family:"Brothers";src:url("fonts/BrothersTypeface-Regular.otf") format("opentype");font-display:swap}
@font-face{font-family:"Basteleur";src:url("fonts/Basteleur-Moonlight.woff2") format("woff2"),url("fonts/Basteleur-Moonlight.woff") format("woff");font-weight:400;font-display:swap}
@font-face{font-family:"Basteleur";src:url("fonts/Basteleur-Bold.woff2") format("woff2"),url("fonts/Basteleur-Bold.woff") format("woff");font-weight:700;font-display:swap}

:root{
  --r:2px;
  --f-label:"Venture","Cinzel",Georgia,serif;
  --f-display:"Brothers","Cormorant Garamond",Georgia,serif;
  --f-text:"Basteleur","Cormorant Garamond",Georgia,serif;
  --gut:20px; --max:1120px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--f-text);font-size:17px;line-height:1.65;overflow-x:clip}
html[data-scheme=dark]{color-scheme:dark}
img,svg{max-width:100%}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:400;line-height:1.1;margin:0 0 .5em;letter-spacing:.005em}
h1{font-size:clamp(40px,7vw,84px)} h2{font-size:clamp(30px,4.6vw,52px)} h3{font-size:clamp(21px,2.4vw,27px)}
p{margin:0 0 1em}
a{color:var(--accent-text)}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:var(--max);margin:0 auto;padding:0 var(--gut)}
.sec{background:var(--bg);color:var(--text);padding:72px 0}
.sec[data-tone=deep],.sec[data-tone=accent]{padding:80px 0}
.eyebrow{font-family:var(--f-label);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--text-muted);margin:0 0 14px}
.muted{color:var(--text-muted)}
.rule{border:0;height:2px;width:64px;background:var(--a2);margin:22px 0}
.center{text-align:center}.center .rule{margin-inline:auto}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:48px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.grid2s{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stack>*+*{margin-top:1em}

/* header */
.hdr{position:sticky;top:0;z-index:30;background:var(--bg);color:var(--text);border-bottom:1px solid var(--divider)}
.hdr .wrap{display:flex;align-items:center;gap:24px;height:64px}
.brand{font-family:var(--f-display);font-size:24px;color:var(--text);text-decoration:none;white-space:nowrap}
.nav{display:flex;gap:4px;margin-left:auto;align-items:center}
.nav a,.nav button.nl{font-family:var(--f-label);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--text);text-decoration:none;padding:10px 12px;border:0;background:none;border-bottom:2px solid transparent}
.nav a[aria-current=page]{border-bottom-color:var(--solid)}
.nav a:hover{background:var(--panel-hover)}
.nav .door{border:1px solid var(--ctl-border);margin-left:8px}
.burger{display:none;margin-left:auto;border:1px solid var(--ctl-border);background:none;padding:8px 12px;font-family:var(--f-label);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--text)}
.msheet{display:none;background:var(--bg);border-bottom:1px solid var(--divider)}
.msheet a{display:block;padding:14px var(--gut);font-family:var(--f-label);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--text);text-decoration:none;border-top:1px solid var(--divider)}
.msheet.open{display:block}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--solid);color:var(--on-solid);border:1px solid var(--solid);border-radius:var(--r);padding:12px 22px;font-family:var(--f-label);font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;text-decoration:none;min-height:44px}
.btn:hover{background:var(--solid-hover);border-color:var(--solid-hover)}
.btn.quiet{background:transparent;color:var(--text);border-color:var(--ctl-border)}
.btn.quiet:hover{background:var(--panel-hover)}
.btn.sm{padding:8px 14px;min-height:36px}
.lnk{background:none;border:0;padding:0;color:var(--accent-text);text-decoration:underline;text-underline-offset:3px;font-family:var(--f-text);font-size:inherit}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
.field{display:block;margin:0 0 16px}
.field>span{display:block;font-family:var(--f-label);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--text-muted);margin-bottom:6px}
.field input,.field textarea,.field select{width:100%;font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--ctl-border);border-radius:var(--r);padding:11px 12px;min-height:44px}
.field input::placeholder{color:var(--text-muted)}
.tag{display:inline-block;font-family:var(--f-label);font-size:10px;letter-spacing:.16em;text-transform:uppercase;padding:3px 8px;border:1px solid var(--border);color:var(--text);background:var(--bg-sunken);border-radius:var(--r)}
.tag.a2{background:var(--a2);color:var(--on-a2);border-color:var(--a2)}
.tag.a3{background:var(--a3);color:var(--on-a3);border-color:var(--a3)}
.card{background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:var(--r);padding:20px}
.card.hot{cursor:pointer}.card.hot:hover{background:var(--panel-hover)}
.ph{position:relative;background:repeating-linear-gradient(135deg,var(--divider) 0 1px,transparent 1px 11px),var(--bg-sunken);border:1px solid var(--border);color:var(--text-muted);display:flex;align-items:center;justify-content:center;font-family:var(--f-label);font-size:10px;letter-spacing:.2em;text-transform:uppercase;min-height:140px}
.meta{font-size:15px;color:var(--text-muted);margin:0 0 .6em}
.offer .ph{margin:-20px -20px 16px;border-width:0 0 1px;min-height:120px}
.offer h3{margin-top:10px}
.bar{height:6px;background:var(--bg-sunken);border:1px solid var(--border)}
.bar>i{display:block;height:100%;background:var(--solid)}

/* hero */
.hero .wrap{display:grid;grid-template-columns:1.15fr .85fr;gap:56px;align-items:center}
.hero h1{margin-bottom:.2em}
.hero .sub{font-family:var(--f-label);font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--text-muted)}
.hero .tag-line{font-size:20px;max-width:34ch}
.hero .ph{min-height:380px}

/* lists */
.qual{display:grid;grid-template-columns:56px 1fr;gap:20px;padding:26px 0;border-top:1px solid var(--divider)}
.qual .n{font-family:var(--f-display);font-size:40px;color:var(--accent-text);line-height:1}
.members{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.member{text-align:center}
.member .av{width:96px;height:96px;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;background:var(--bg-sunken);border:1px solid var(--border);font-family:var(--f-display);font-size:34px;color:var(--text-muted)}
.cities{display:grid;grid-template-columns:repeat(3,1fr);text-align:center}
.cities>div{padding:18px 20px}.cities>div+div{border-left:1px solid var(--text-muted)}
.cities b{display:block;font-family:var(--f-display);font-weight:400;font-size:clamp(28px,3.4vw,42px)}
.cities span{font-family:var(--f-label);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase}
.slides{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(240px,32%);gap:16px;overflow-x:auto;padding-bottom:8px}
.slides .ph{min-height:220px}
.join{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:start}
.bullets{padding-left:1.1em}.bullets li{margin:.4em 0}
.warr{display:flex;flex-direction:column;gap:0}
.shelf{list-style:none;margin:0;padding:0}
.shelf li{display:grid;grid-template-columns:120px 1fr auto;gap:20px;padding:18px 0;border-top:1px solid var(--divider);align-items:center;cursor:pointer}
.shelf li:hover{background:var(--panel-hover)}
.shelf .ph{min-height:80px}
.shelf h3{margin:0 0 .15em}
.banner{padding:64px 0 40px;border-bottom:1px solid var(--divider)}
.banner::before{content:"";display:block;width:64px;height:4px;background:var(--a3);margin-bottom:22px}
.authcard{max-width:460px;margin:0 auto}
.tabs{display:flex;border-bottom:1px solid var(--divider);margin-bottom:22px}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:12px;font-family:var(--f-label);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--text-muted)}
.tabs button[aria-selected=true]{border-bottom-color:var(--solid);color:var(--text)}
.band{padding:36px 0;border-top:1px solid var(--divider)}
.band h2{font-size:clamp(24px,3vw,34px)}
.rsvprow{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:14px 0;border-top:1px solid var(--divider);flex-wrap:wrap}
.errands{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.errands a{display:block;padding:16px;border:1px solid var(--ctl-border);color:var(--text);text-decoration:none;font-family:var(--f-label);font-size:11px;letter-spacing:.16em;text-transform:uppercase;background:var(--panel)}
.errands a:hover{background:var(--panel-hover)}
.chat p{display:flex;gap:10px;align-items:center;margin:0 0 10px}
.chat .av{width:32px;height:32px;flex:none;background:var(--bg-sunken);border:1px solid var(--border)}
.chat .ln{height:10px;background:var(--divider);flex:1;max-width:var(--w,70%)}
.notice{border:1px dashed var(--border);padding:10px 14px;font-size:14px;color:var(--text-muted);margin-bottom:24px}
.foot .grid3{gap:32px}
.foot a{color:var(--text)}
.foot ul{list-style:none;margin:0;padding:0}.foot li{margin:.3em 0}
.foot .fine{border-top:1px solid var(--divider);margin-top:36px;padding-top:18px;font-size:14px;color:var(--text-muted)}

/* surfaces */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(10,12,20,.52);display:flex;align-items:center;justify-content:center;padding:16px}
.sheet{width:min(680px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column;background:var(--bg);color:var(--text);border:1px solid var(--ctl-border);border-top:3px solid var(--solid);border-radius:var(--r);box-shadow:0 18px 50px rgba(0,0,0,.35)}
.sh-head{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--divider);min-height:56px}
.sh-head h2{font-size:22px;margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sh-head .crumb{background:none;border:0;color:var(--accent-text);font-family:var(--f-label);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap;max-width:40%;overflow:hidden;text-overflow:ellipsis;padding:8px 0}
.sh-head .hb,.sh-head .x{background:none;border:1px solid var(--ctl-border);color:var(--text);padding:6px 10px;min-height:36px;min-width:36px;font-family:var(--f-label);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;border-radius:var(--r)}
.sh-head .hb .t{display:inline}
.sh-body{padding:20px 22px;overflow:auto;flex:1}
.sh-body .ph.cover{min-height:150px;margin-bottom:18px}
.sh-body.read{font-size:17px}.sheet.big .sh-body.read{font-size:19.5px}
.sh-foot{padding:14px 18px;border-top:1px solid var(--divider);display:flex;gap:10px;justify-content:flex-end;background:var(--bg-sunken);flex-wrap:wrap}
.sh-grab{display:none}
.kv{display:grid;grid-template-columns:96px 1fr;gap:6px 14px;margin:0 0 18px;font-size:16px}
.kv dt{font-family:var(--f-label);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--text-muted);padding-top:4px}.kv dd{margin:0}
.done-mark{width:48px;height:48px;background:var(--a3);color:var(--on-a3);display:flex;align-items:center;justify-content:center;font-size:24px;margin-bottom:14px;border-radius:var(--r)}
.idx{list-style:none;margin:20px 0 0;padding:0;border-top:1px solid var(--divider)}
.idx li{padding:10px 0;border-bottom:1px solid var(--divider)}
.idx button{background:none;border:0;padding:0;text-align:left;color:var(--accent-text);text-decoration:underline;text-underline-offset:3px}

/* theme panel */
.tp-btn{position:fixed;right:16px;bottom:16px;z-index:90;background:var(--solid);color:var(--on-solid);border:1px solid var(--solid);padding:10px 16px;font-family:var(--f-label);font-size:11px;letter-spacing:.16em;text-transform:uppercase;border-radius:var(--r);box-shadow:0 6px 20px rgba(0,0,0,.3)}
.tp{position:fixed;right:16px;bottom:64px;z-index:90;width:392px;max-width:calc(100vw - 24px);max-height:min(76vh,720px);display:none;flex-direction:column;background:var(--bg);color:var(--text);border:1px solid var(--ctl-border);border-top:3px solid var(--a3);border-radius:var(--r);box-shadow:0 18px 50px rgba(0,0,0,.4);font-family:system-ui,sans-serif;font-size:13px;line-height:1.45}
.tp.open{display:flex}
.tp h4{font-family:system-ui,sans-serif;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-muted);margin:14px 0 6px}
.tp-tabs{display:flex;border-bottom:1px solid var(--divider)}
.tp-tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:10px 4px;font:600 12px system-ui,sans-serif;color:var(--text-muted)}
.tp-tabs button[aria-selected=true]{color:var(--text);border-bottom-color:var(--solid)}
.tp-body{padding:12px 14px 16px;overflow:auto}
.tp .seg{display:flex}.tp .seg button{flex:1;padding:8px;border:1px solid var(--ctl-border);background:var(--bg);color:var(--text);font:inherit;margin-left:-1px}
.tp .seg button[aria-pressed=true]{background:var(--solid);color:var(--on-solid);border-color:var(--solid);position:relative}
.tp .pal{display:grid;grid-template-columns:64px 44px 1fr auto;gap:8px;align-items:center;margin:6px 0}
.tp input[type=color]{width:44px;height:32px;padding:0;border:1px solid var(--ctl-border);background:none}
.tp code,.tp pre{font:11.5px/1.5 ui-monospace,Menlo,monospace}
.tp pre{background:var(--bg-sunken);border:1px solid var(--divider);padding:10px;overflow:auto;margin:6px 0;white-space:pre}
.tp table{border-collapse:collapse;width:100%;font-size:12px}
.tp td,.tp th{border-top:1px solid var(--divider);padding:5px 6px;text-align:left;vertical-align:top}
.tp th{font-weight:600;color:var(--text-muted)}
.tp .tw{overflow-x:auto}
.tp .sw{display:inline-block;width:14px;height:14px;border:1px solid var(--border);vertical-align:-2px;margin-right:6px}
.tp .scale{display:grid;grid-template-columns:repeat(9,1fr);gap:0;margin:2px 0 8px}
.tp .scale span{height:34px;font:10px/34px ui-monospace,monospace;text-align:center;border:1px solid transparent}
.tp .lab{font-size:11px;color:var(--text-muted);margin-top:6px}
.ok{color:var(--accent-text);font-weight:700}.bad{color:#b00020;font-weight:700}
html[data-scheme=dark] .bad{color:#ff8a8a}
.tp select{font:inherit;padding:6px;border:1px solid var(--ctl-border);background:var(--bg);color:var(--text);width:100%}
.sb{position:absolute;left:0;top:0;z-index:40;background:#111;color:#fff;font:10px/1.3 ui-monospace,monospace;padding:1px 5px;pointer-events:none;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;opacity:.92}
body.steps [data-reads]{outline:1px dashed rgba(255,0,120,.7);outline-offset:-1px}

@media (max-width:820px){
  :root{--gut:16px}
  .nav{display:none}.burger{display:block}
  .brand{font-size:19px}.hdr .wrap{gap:12px}
  .hero .wrap,.grid2,.join{grid-template-columns:1fr;gap:32px}
  .grid3{grid-template-columns:1fr}
  .grid2s{grid-template-columns:1fr}
  .members{grid-template-columns:repeat(2,1fr)}
  .errands{grid-template-columns:repeat(2,1fr)}
  .sec,.sec[data-tone=deep],.sec[data-tone=accent]{padding:48px 0}
  .hero .ph{min-height:220px}
  .cities{grid-template-columns:1fr}.cities>div+div{border-left:0;border-top:1px solid var(--text-muted)}
  .slides{grid-auto-columns:78%}
  .shelf li{grid-template-columns:84px 1fr}.shelf li .aside{display:none}
  .qual{grid-template-columns:36px 1fr;gap:12px}
}
@media (max-width:640px){
  body{font-size:16.5px}
  .scrim{align-items:flex-end;padding:0}
  .sheet{width:100%;max-height:92vh;border-radius:0;border-left:0;border-right:0;border-bottom:0}
  .sh-grab{display:block;width:40px;height:3px;background:var(--border);margin:8px auto 0}
  .sh-head .hb .t{display:none}
  .sh-foot .btn{flex:1}
  .sh-foot{padding-bottom:max(14px,env(safe-area-inset-bottom))}
  .tp{left:8px;right:8px;bottom:60px;width:auto;max-width:none;max-height:70vh}
  .tp-btn{right:8px;bottom:8px}
  .kv{grid-template-columns:78px 1fr}
}
</style>
<style id="gen-css"></style>

<body data-tone="plain">
<div id="app"></div>
<div id="surface"></div>
<button class="tp-btn" id="tpb" aria-expanded="false" aria-controls="tp">Theme</button>
<aside class="tp" id="tp" data-tone="plain" aria-label="Theme panel"></aside>

<script>
/*CORE*/
/* ---- OKLCH, contrast, 9-step scales, role resolution. No DOM access in this block. ---- */
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
function hexToRgb(h){h=h.replace('#','');if(h.length===3)h=[...h].map(c=>c+c).join('');const n=parseInt(h,16);return[(n>>16)&255,(n>>8)&255,n&255];}
const lin=c=>{c/=255;return c<=.04045?c/12.92:Math.pow((c+.055)/1.055,2.4)};
const delin=c=>c<=.0031308?12.92*c:1.055*Math.pow(c,1/2.4)-.055;
function hexToOklch(hex){
  const[r,g,b]=hexToRgb(hex).map(lin);
  const l=Math.cbrt(.4122214708*r+.5363325363*g+.0514459929*b),m=Math.cbrt(.2119034982*r+.6806995451*g+.1073969566*b),s=Math.cbrt(.0883024619*r+.2817188376*g+.6299787005*b);
  const L=.2104542553*l+.7936177850*m-.0040720468*s,a=1.9779984951*l-2.4285922050*m+.4505937099*s,bb=.0259040371*l+.7827717662*m-.8086757660*s;
  return[L,Math.hypot(a,bb),(Math.atan2(bb,a)*180/Math.PI+360)%360];
}
function oklabToLin(L,a,b){const l=(L+.3963377774*a+.2158037573*b)**3,m=(L-.1055613458*a-.0638541728*b)**3,s=(L-.0894841775*a-1.2914855480*b)**3;
  return[4.0767416621*l-3.3077115913*m+.2309699292*s,-1.2684380046*l+2.6097574011*m-.3413193965*s,-.0041960863*l-.7034186147*m+1.7076147010*s];}
/* Out-of-gamut: keep L and H, reduce C (same rule as packages/gradients oklchToHex). */
function oklchToHex(L,C,H){
  const h=H*Math.PI/180,ok=c=>oklabToLin(L,c*Math.cos(h),c*Math.sin(h)).every(v=>v>=-1e-4&&v<=1+1e-4);
  let best=C;
  if(!ok(C)){let lo=0,hi=C;for(let i=0;i<24;i++){const mid=(lo+hi)/2;ok(mid)?lo=mid:hi=mid}best=lo}
  const rgb=oklabToLin(L,best*Math.cos(h),best*Math.sin(h)).map(v=>Math.round(clamp(delin(clamp(v,0,1)),0,1)*255));
  return'#'+rgb.map(v=>v.toString(16).padStart(2,'0')).join('');
}
const lum=h=>{const[r,g,b]=hexToRgb(h).map(lin);return .2126*r+.7152*g+.0722*b};
const cr=(a,b)=>{const x=lum(a),y=lum(b);return(Math.max(x,y)+.05)/(Math.min(x,y)+.05)};

/* Steps 1-6 sit on a fixed lightness curve per scheme (every scale shares it, so step n matches in value across hues).
   Step 7 keeps the seed's own lightness inside a band, 8 is one notch further from the ground, 9 is the text step. */
const CURVE={
  light:{L:[.992,.972,.945,.918,.885,.84],C:[.06,.14,.26,.38,.52,.70]},
  dark:{L:[.165,.200,.235,.270,.315,.375],C:[.12,.18,.28,.38,.50,.62]}
};
function genScale(seed,scheme,o={}){
  let[L0,C0,H]=hexToOklch(seed);
  let C=Math.max(C0,o.minC||0);if(o.maxC!=null)C=Math.min(C,o.maxC);if(o.H!=null)H=o.H;

  accentText:'--accent-text',solid:'--solid',solidHover:'--solid-hover',onSolid:'--on-solid',ring:'--ring',ctlBorder:'--ctl-border',a2:'--a2',onA2:'--on-a2',a3:'--a3',onA3:'--on-a3'};

  for(const[sc,k]of[['light','l'],['dark','d']])css+=`:root{${NAMES.map(n=>S[sc][n].map((h,i)=>`--${k}-${n}-${i+1}:${h};`).join('')).join('')}}\n`;

    const[t,h]=key.split(':'),R=RES[sc][key];

   ${[['I','Essentialism','Our work centers on the soulfulness of presence, what emerges when form is stripped to its most honest state.'],['II','Timelessness','Our art invites viewers to experience the eternal present. In doing so, we unlock new dimensions of perception and connection.'],['III','Spaciousness','We prioritize the viewer’s experience, crafting scenes that envelop and engage.']].map(([n,t,b])=>`<div class="qual"><span class="n">${n}</span><div><h3>${t}</h3><p style="margin:0">${b}</p></div></div>`).join('')}</div>`)
 +sec('plain',`<div class="wrap"><h2>Three Commitments</h2><div class="grid3" style="margin-top:24px">${[['Inquiry Through Making','Creating art as the medium to inquire into our shared human existence.'],['Sanctuary','Providing a place where beauty and inquiry can meet.'],['Education & Community','Providing education through demonstrations, workshops, and inviting access to our process as it happens.']].map(([t,b])=>`<div class="card" data-reads="panel"><div style="color:var(--accent-text);font-size:22px">&#10022;</div><h3>${t}</h3><p style="margin:0">${b}</p></div>`).join('')}</div></div>`)
 +sec('soft',`<div class="wrap"><h2>The Board</h2><p class="muted">The listed members of the non-profit. Each keeps their own page; names here are placeholders.</p>${boardList()}</div>`)
 +sec('plain',`<div class="wrap"><p class="eyebrow">Join</p></div>${joinBlock()}`,{id:'join'})
 +sec('deep',`<div class="wrap center" style="max-width:760px"><blockquote style="margin:0 0 22px;font-size:clamp(18px,2.1vw,22px);line-height:1.8">&ldquo;Our works are timeless, essential, reductionist, and often violate scale.&rdquo;</blockquote><p class="eyebrow">Toronto · Los Angeles · Paris</p></div>`);

PAGES['/login']=()=>
 sec('soft',`<div class="wrap"><div class="authcard card" data-reads="panel"><div class="tabs" role="tablist"><button role="tab" aria-selected="${ST.authMode==='in'}" data-auth="in">Sign in</button><button role="tab" aria-selected="${ST.authMode==='up'}" data-auth="up">Create account</button></div>
  <h2 style="font-size:30px">${ST.authMode==='in'?'Welcome back':'Start Here'}</h2>
  <p class="muted">Sign in to RSVP for gatherings. One account works across the whole Arts Collective network.</p>
  ${ST.authMode==='up'?'<label class="field"><span>Name</span><input placeholder="Your name"></label>':''}
  <label class="field"><span>Email</span><input data-reads="ctlBorder" placeholder="you@example.org"></label>
  <label class="field"><span>Password</span><input type="password" placeholder="Password"></label>
  <button class="btn" data-reads="solid" style="width:100%" data-go="/hub">${ST.authMode==='in'?'Sign in':'Create account'}</button>
  <p class="center muted" style="margin:14px 0">or</p><button class="btn quiet" style="width:100%">Continue with Google</button>
  <p class="meta center" style="margin:16px 0 0">By continuing you accept the network <a href="#/login">Terms</a>.</p></div></div>`,{cls:'',id:''}).replace('class="sec "','class="sec " style="padding:56px 0 72px"');

PAGES['/hub']=()=>{
 const wk=['meet-1','meet-2'].map(id=>`<div class="rsvprow"><div><strong>${MEET[id].title}</strong><div class="meta" style="margin:0">${MEET[id].when}</div></div><div class="row"><button class="btn sm" data-reads="solid" aria-pressed="true">Coming</button><button class="btn quiet sm">Can't make it</button></div></div>`).join('');
 return`<header class="banner" data-tone="plain" data-reads="bg"><div class="wrap"><p class="eyebrow">Portal</p><h1 style="font-size:clamp(34px,5vw,56px)">Welcome back, Member A</h1></div></header>`
 +sec('plain',`<div class="wrap"><p class="notice" data-reads="sunken">Signed-in view, drawn with placeholder data only. Nothing here comes from a member's account.</p>
  <div class="band" style="border-top:0;padding-top:0"><h2>This week</h2>${wk}</div>
  <div class="band"><h2>Make</h2><div class="grid3"><div class="card hot" data-reads="panel"><h3>Publish</h3><p class="muted">Write a post or a piece.</p></div><div class="card hot" data-reads="panel"><h3>Group research</h3><p class="muted">Questionnaire · Poll · Arrange a time</p></div><div class="card hot" data-reads="panel"><h3>Studio</h3><p class="muted">Open the editor.</p></div></div></div>
  <div class="band"><h2>You</h2><div class="card row" data-reads="panel"><div class="member"><div class="av" data-reads="sunken" style="margin:0">A</div></div><div><strong>Member A</strong><p class="meta" style="margin:0">Role title · profile page</p></div><button class="btn quiet sm" style="margin-left:auto">Edit profile</button></div></div>
  </div>`)
 +sec('soft',`<div class="wrap"><div class="grid2" style="gap:32px"><div><h2 style="font-size:30px">General Chat</h2><div class="card chat" data-reads="panel">${[60,80,45,70].map(w=>`<p><span class="av"></span><span class="ln" style="--w:${w}%"></span></p>`).join('')}<label class="field" style="margin:14px 0 0"><span>Message</span><input placeholder="Write a message"></label></div></div>
   <div><h2 style="font-size:30px">Errands</h2><div class="errands" style="grid-template-columns:1fr 1fr"><a href="#/hub" data-reads="panel">Manage</a><a href="#/hub" data-reads="panel">Forum</a><a href="#/hub" data-reads="panel">Calendar</a><a href="#/hub" data-reads="panel">Email</a></div></div></div></div>`);
}

function header(path){
 const L=[['/offerings','Offerings'],['/writing','Writing'],['/about','About']];
 const cur=p=>path===p?' aria-current="page"':'';
 const hub=path==='/hub';
 return`<header class="hdr" data-tone="plain" data-reads="bg"><div class="wrap"><a class="brand" href="#/">Elkdonis Arts Collective</a>
  <nav class="nav" aria-label="Primary">${L.map(([p,t])=>`<a href="#${p}"${cur(p)}>${t}</a>`).join('')}<a class="door" href="#${hub?'/hub':'/login'}"${cur(hub?'/hub':'/login')}>${hub?'Portal':'Sign in'}</a></nav>
  <button class="burger" aria-expanded="${ST.menu}" data-menu>${ST.menu?'Close':'Menu'}</button></div>
  <nav class="msheet${ST.menu?' open':''}" aria-label="Primary">${L.map(([p,t])=>`<a href="#${p}">${t}</a>`).join('')}<a href="#${hub?'/hub':'/login'}">${hub?'Portal':'Sign in'}</a></nav></header>`;
}
function footer(){return`<footer class="sec foot" data-tone="deep" data-reads="bg" style="padding:56px 0 40px"><div class="wrap"><div class="grid3"><div><a class="brand" href="#/" style="color:var(--text)">Elkdonis Arts Collective</a><p class="muted" style="margin-top:10px">Toronto · Los Angeles · Paris</p></div>
 <div><p class="eyebrow">Follow</p><ul><li><a href="#/" onclick="return false">Instagram</a></li><li><a href="#/" onclick="return false">GoFundMe</a></li><li><a href="#/" onclick="return false">Substack</a></li></ul></div>
 <div><p class="eyebrow">Contact</p><ul><li><a href="#/" onclick="return false">info@elkdonis-arts.org</a></li><li><button class="lnk" style="color:var(--text)" data-s="share">Leave a message</button></li></ul></div></div>
 <div class="fine"><a href="#/login">Member sign in</a> · <a href="#/" onclick="return false">Your data</a></div></div></footer>`}

/* ---------------- surfaces ---------------- */
function layer(id,stack,i){
 const prev=stack[i-1];
 if(MEET[id]){const m=MEET[id];return{title:m.title,hb:'↗|Share',foot:`<button class="btn quiet" data-close>Close</button><button class="btn" data-reads="solid" data-push="rsvp">RSVP</button>`,
  body:`${hat('cover','cover')}<div class="row" style="margin-bottom:14px"><span class="tag">${m.kind}</span><span class="tag a3" data-reads="a3">${m.cycle}</span></div>
  <dl class="kv"><dt>When</dt><dd>${m.when}</dd><dt>Length</dt><dd>${m.len}</dd><dt>Where</dt><dd>${m.where}</dd><dt>Host</dt><dd>${m.host}</dd><dt>Coming</dt><dd>${m.going} so far (sample)</dd></dl>${m.body.map(t=>`<p>${t}</p>`).join('')}`}}
 if(id==='rsvp'){const m=MEET[prev]||MEET['meet-1'];return{title:'Are you coming?',foot:`<button class="btn quiet" data-pop>Back</button><button class="btn" data-reads="solid" data-push="done">Yes, I'm coming</button>`,
  body:`<p class="muted">${m.title} · ${m.when}</p><label class="field"><span>Your name</span><input data-reads="ctlBorder" placeholder="Your name"></label><label class="field"><span>Email</span><input placeholder="you@example.org"></label><p class="meta">A confirmation link is sent to this address. Signed-in members skip this step.</p>`}}
 if(id==='done'){return{title:'One more step',foot:`<button class="btn quiet" data-reads="solid">Add to calendar</button><button class="btn" data-close>Done</button>`,
  body:`<div class="done-mark" data-reads="a3">&#10003;</div><h3>Check your email to confirm your place.</h3><p class="muted">The link in the message confirms your RSVP. If it does not arrive in a few minutes, look in the spam folder.</p>`}}
 if(id==='share'){return{title:'Share',foot:`<button class="btn" data-pop>Done</button>`,body:`<label class="field"><span>Link</span><input readonly value="https://elkdonis-arts.org/offerings?surface=${stack.slice(0,i).join('/')||'meet-1'}"></label><div class="row"><button class="btn quiet sm">Copy link</button><button class="btn quiet sm">Email</button></div>`}}
 if(PIECES[id]){const p=PIECES[id],ix=PIECE_IDS.indexOf(id),nx=PIECE_IDS[(ix+1)%PIECE_IDS.length];
  return{title:p.title,hb:'Aa|'+(ST.big?'−':'+'),read:true,foot:`<button class="btn quiet" data-close>Close</button><button class="btn quiet" data-swap="${nx}">Next ›</button>`,
  body:`<p class="meta">${p.author} · ${p.date}</p><p style="font-size:1.12em">${p.lede}</p>${p.body.map(t=>`<p>${t}</p>`).join('')}<ul class="idx">${PIECE_IDS.filter(x=>x!==id).map(x=>`<li><button data-swap="${x}">${PIECES[x].title}</button></li>`).join('')}</ul>`}}
 return{title:id,body:'',foot:''};
}
function surfaceHtml(stack){
 if(!stack.length)return'';
 const i=stack.length-1,id=stack[i],L=layer(id,stack,i),prev=stack[i-1];
 const hb=L.hb?(([ic,t])=>`<button class="hb" data-hb="${id}" aria-label="${t||ic}">${ic}${t?` <span class="t">${t}</span>`:''}</button>`)(L.hb.split('|')):'';
 return`<div class="scrim" data-scrim><div class="sheet${ST.big?' big':''}" data-tone="plain" role="dialog" aria-modal="true" aria-label="${L.title}" tabindex="-1"><div class="sh-grab"></div>
  <div class="sh-head" data-reads="bg">${prev?`<button class="crumb" data-pop>‹ ${ttl(prev)}</button>`:''}<h2>${L.title}</h2>${hb}<button class="x" data-close aria-label="Close">✕</button></div>
  <div class="sh-body${L.read?' read':''}">${L.body}</div><div class="sh-foot" data-reads="sunken">${L.foot}</div></div></div>`;
}

/* ---------------- theme panel ---------------- */
const STEP_JOBS=[[1,'Page background','bg'],[2,'Subtle background: cards, sunken areas','bg-sunken'],[3,'Component background','panel'],[4,'Component hover / selected','panel-hover'],[5,'Divider, subtle border (decorative)','divider'],[6,'Stronger decorative border, hover border','border'],[7,'Solid fill; input border and focus ring (3:1)','solid, ring, ctl-border'],[8,'Solid hover; secondary text (4.5:1)','solid-hover, text-muted, accent-text'],[9,'High-contrast text (4.5:1+)','text']];
const ROLE_LABEL={bg:'bg',sunken:'bg-sunken',panel:'panel',hover:'panel-hover',divider:'divider',border:'border',text:'text',muted:'text-muted',accentText:'accent-text',solid:'solid',solidHover:'solid-hover',onSolid:'on-solid',ring:'ring',ctlBorder:'ctl-border',a2:'accent-2',onA2:'on-accent-2',a3:'accent-3',onA3:'on-accent-3'};
function tpBody(){
 const sc=ST.scheme,R=RES[sc][ST.toneKey];
 if(ST.tab==='controls')return`<h4>Scheme</h4><div class="seg">${['light','dark'].map(x=>`<button data-sch="${x}" aria-pressed="${sc===x}">${x}</button>`).join('')}</div>
  <h4>Neutral tint</h4><div class="seg">${['space','water','none'].map(x=>`<button data-tint="${x}" aria-pressed="${ST.tint===x}">${x}</button>`).join('')}</div>
  <h4>Palette (the only stored colours)</h4>${['space','water','fire','earth','wind'].map(n=>`<div class="pal"><span>${n}</span><input type="color" data-pal="${n}" value="${ST.pal[n].toLowerCase()}" aria-label="${n} colour"><code data-hex="${n}">${ST.pal[n]}</code><span><i class="sw" style="background:var(--${n}-7);margin:0"></i> ${n}-7</span></div>`).join('')}
  <h4>Overlay</h4><label><input type="checkbox" data-steps ${ST.steps?'checked':''}> Show steps: label each element with the step it reads</label>
  <p class="lab">Pass/fail summary, all 6 tones in both schemes: <b class="${summary().fails?'bad':'ok'}">${summary().text}</b></p>
  <p style="margin-top:12px"><button class="btn quiet sm" data-reset>Reset palette</button></p>`;
 if(ST.tab==='scales'){return`<h4>Step jobs (same on every scale)</h4><div class="tw"><table><tr><th>Step</th><th>Job</th><th>Roles</th></tr>${STEP_JOBS.map(([n,j,r])=>`<tr><td>${n}</td><td>${j}</td><td><code>${r}</code></td></tr>`).join('')}</table></div>
  <h4>Generated scales, ${sc} scheme (steps 1 to 9)</h4>${NAMES.map(n=>`<div class="lab">${n}</div><div class="scale">${S[sc][n].map((h,i)=>`<span style="background:${h};color:${cr(h,'#000')>cr(h,'#fff')?'#000':'#fff'}" title="${n}-${i+1} ${h}">${i+1}</span>`).join('')}</div>`).join('')}
  <p class="lab">Dark scheme uses its own scales (steps 1 to 6 on a dark lightness curve, 9 is light text); it is not an inversion of the light hexes.</p>`}
 const tonePick=`<select data-tone-pick aria-label="Tone">${TONE_KEYS.map(k=>`<option value="${k}" ${k===ST.toneKey?'selected':''}>${k.replace(':',' · ')}</option>`).join('')}</select>`;
 if(ST.tab==='roles'){
  const ex=(k,r)=>`<tr><td><code>${ROLE_VAR[k]}</code></td><td><code>var(${varName(r[k].ref,sc)})</code></td><td><i class="sw" style="background:${r[k].hex}"></i>${refLabel(r[k].ref)}</td></tr>`;
  return`<h4>Tone</h4>${tonePick}<h4>Role map (pointers, never hex)</h4><div class="tw"><table><tr><th>Role</th><th>Points to</th><th>Step</th></tr>${Object.keys(ROLE_VAR).map(k=>ex(k,R)).join('')}</table></div>
  <h4>The layers, as generated</h4><pre>${layerCode(sc,R)}</pre>`}
 if(ST.tab==='contrast'){
  return`<h4>Tone</h4>${tonePick}<p class="lab">Scheme: ${sc}. A step changed from the first choice is marked <b>stepped</b>.${R.variant?' Ground moved to a darker step for this tone.':''}</p>
  <div class="tw"><table><tr><th>Text / ground</th><th>Ratio</th><th>Need</th><th></th><th>Reads</th></tr>${R.checks.map(c=>`<tr><td>${ROLE_LABEL[c.fg]} on ${ROLE_LABEL[c.bg]}</td><td>${c.ratio.toFixed(2)}</td><td>${c.min?c.min+':1':'n/a'}</td><td>${c.pass===null?'<span class="lab">decorative</span>':c.pass?'<span class="ok">pass</span>':'<span class="bad">FAIL</span>'}</td><td><code>${refLabel(R[c.fg].ref)}</code>${R[c.fg].first===false?' <b>stepped</b>':''}</td></tr>`).join('')}</table></div>
  <p class="lab">4.5:1 body text; 3:1 for the fill, focus ring and input border. Dividers and card edges are decorative (the fill and label carry meaning), so they carry no requirement.</p>`}
}
function summary(){let f=0,t=0;for(const sc of['light','dark'])for(const k of TONE_KEYS)for(const c of RES[sc][k].checks)if(c.pass!==null){t++;if(!c.pass)f++}return{fails:f,text:`${t-f}/${t} pairs pass`}}
function layerCode(sc,R){const k=sc==='dark'?'d':'l';
 return`/* 1 palette: stored */\nwater:${ST.pal.water}  fire:${ST.pal.fire}  ...\n\n/* 2 shades: generated, OKLCH */\n--l-fire-7:${S.light.fire[6]};  --d-fire-7:${S.dark.fire[6]};\n\n/* 2b scheme alias */\nhtml[data-scheme=${sc}]{--fire-7:var(--${k}-fire-7)}\n\n/* 3 role = pointer */\n--solid:var(${varName(R.solid.ref,sc)});\n--on-solid:var(${varName(R.onSolid.ref,sc)});\n\n/* 4 tone re-points roles */\n[data-tone="deep"]{--bg:var(${varName(RES[sc].deep.bg.ref,sc)})}\n\n/* 5 block reads roles only */\n.btn{background:var(--solid);\n     color:var(--on-solid)}`}
function renderPanel(){
 const tp=document.getElementById('tp');
 tp.classList.toggle('open',ST.open);document.getElementById('tpb').setAttribute('aria-expanded',ST.open);
 document.getElementById('tpb').textContent=ST.open?'Close theme':'Theme';
 if(!ST.open)return;
 tp.innerHTML=`<div class="tp-tabs" role="tablist">${[['controls','Controls'],['scales','Scales'],['roles','Roles'],['contrast','Contrast']].map(([k,t])=>`<button role="tab" aria-selected="${ST.tab===k}" data-tab="${k}">${t}</button>`).join('')}</div><div class="tp-body">${tpBody()}</div>`;
}

/* ---------------- steps overlay ---------------- */
function badges(){
 document.querySelectorAll('.sb').forEach(n=>n.remove());
 document.querySelectorAll('[data-sbpos]').forEach(n=>{n.style.position='';n.removeAttribute('data-sbpos')});
 document.body.classList.toggle('steps',ST.steps);
 if(!ST.steps)return;
 document.querySelectorAll('[data-reads]').forEach(el=>{
  const t=el.closest('[data-tone]'),key=t.dataset.tone==='accent'?'accent:'+(t.dataset.hue||'fire'):t.dataset.tone,R=RES[ST.scheme][key];
  const label=el.dataset.reads.split(',').map(r=>`${ROLE_LABEL[r]||r}=${refLabel(R[r].ref)}`).join(' · ');
  if(getComputedStyle(el).position==='static'){el.style.position='relative';el.setAttribute('data-sbpos','1')}
  const b=document.createElement('span');b.className='sb';b.textContent=label;el.prepend(b);
 });
}

/* ---------------- render ---------------- */
function render(){
 const{path,stack}=route();
 const page=(PAGES[path]||PAGES['/']);
 document.getElementById('app').innerHTML=header(path)+`<main>${page()}</main>`+footer();
 document.getElementById('surface').innerHTML=surfaceHtml(stack);
 document.body.style.overflow=stack.length?'hidden':'';
 if(stack.length){const s=document.querySelector('.sheet');s&&s.focus({preventScroll:true})}
 renderPanel();badges();
}
function update(){rebuild();renderPanel();badges()}

document.addEventListener('click',e=>{
 const t=e.target,q=s=>t.closest(s);
 const{path,stack}=route();
 let el;
 if(t.classList&&t.classList.contains('scrim')){nav(path,[]);return}
 if(el=q('[data-close]')){nav(path,[]);return}
 if(el=q('[data-pop]')){nav(path,stack.slice(0,-1));return}
 if(el=q('[data-push]')){nav(path,[...stack,el.dataset.push]);return}
 if(el=q('[data-swap]')){nav(path,[...stack.slice(0,-1),el.dataset.swap]);return}
 if(el=q('[data-hb]')){if(el.dataset.hb.startsWith('piece-')){ST.big=!ST.big;render()}else nav(path,[...stack,'share']);return}
 if(el=q('[data-s]')){const v=el.dataset.s;nav(path,v.split('/'));return}
 if(el=q('[data-go]')){nav(el.dataset.go,[]);return}
 if(el=q('[data-menu]')){ST.menu=!ST.menu;render();return}
 if(el=q('[data-auth]')){ST.authMode=el.dataset.auth;render();return}
 if(q('#tpb')){ST.open=!ST.open;renderPanel();return}
 if(el=q('[data-tab]')){ST.tab=el.dataset.tab;renderPanel();return}
 if(el=q('[data-sch]')){ST.scheme=el.dataset.sch;update();return}
 if(el=q('[data-tint]')){ST.tint=el.dataset.tint;update();return}
 if(q('[data-reset]')){ST.pal={...DEFAULT_PAL};update();return}
});
document.addEventListener('keydown',e=>{
 const{path,stack}=route();
 if(e.key==='Escape'&&stack.length){nav(path,stack.slice(0,-1));return}
 if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('li[data-s]')){e.preventDefault();nav(path,e.target.dataset.s.split('/'))}
});
document.addEventListener('input',e=>{
 const t=e.target;
 if(t.dataset.pal){ST.pal[t.dataset.pal]=t.value;const c=document.querySelector(`[data-hex="${t.dataset.pal}"]`);if(c)c.textContent=t.value;rebuild();badges();if(ST.tab!=='controls')renderPanel()}
});
document.addEventListener('change',e=>{
 const t=e.target;
 if(t.matches('[data-steps]')){ST.steps=t.checked;badges()}
 if(t.matches('[data-tone-pick]')){ST.toneKey=t.value;renderPanel()}
});
let lastPath=route().path;
window.addEventListener('hashchange',()=>{ST.menu=false;const y=window.scrollY,np=route().path;render();if(np!==lastPath){window.scrollTo(0,0);lastPath=np}else window.scrollTo(0,y)});
rebuild();render();
</script>
</body>
</html>
